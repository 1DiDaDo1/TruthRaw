name: TruthRaw Camera5 8160x6144 RAW10 v0.57 test

on:
  workflow_dispatch:
  push:
    branches: [test/cam5-8160x6144-raw10-v057]
    paths:
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt'
      - '.github/workflows/android-truthraw-cam5-8160x6144-raw10-v057.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify isolated RAW10 probe invariants
        run: |
          set -euo pipefail
          SRC='suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt'
          grep -F 'private const val TARGET_W = 8160' "$SRC"
          grep -F 'private const val TARGET_H = 6144' "$SRC"
          grep -F 'ImageReader.newInstance(TARGET_W, TARGET_H, ImageFormat.RAW10, 1)' "$SRC"
          grep -F 'RAW10_SEALED_ANALYSIS_ONLY_NO_U16_ADMISSION' "$SRC"
          grep -F 'physicalFrameCount", 1' "$SRC"
          grep -F 'independentEvidenceCount", 1' "$SRC"
          grep -F 'calibrationAuthorityGranted", false' "$SRC"
          grep -F 'scientificMasterCreationAllowed", false' "$SRC"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-cam5-8160x6144-raw10-v057-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
