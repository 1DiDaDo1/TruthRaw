name: TruthRaw v0.61 HONOR RAW Remosaic Vendor Oracle

on:
  push:
    branches:
      - research/honor-raw-remosaic-v061
    paths:
      - 'suite_android/app/src/main/AndroidManifest.xml'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/RawRemosaicVendorCharacteristicsOracleActivity.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/TruthRawSettingsActivity.kt'
      - 'docs/HONOR_V061_RAW_REMOSAIC_VENDOR_CHARACTERISTICS_PLAN_2026-09-23.md'
      - 'state/HONOR_V061_RAW_REMOSAIC_VENDOR_CHARACTERISTICS_PLAN_2026-09-23.json'
      - '.github/workflows/android-truthraw-v061-raw-remosaic-vendor-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v061:
    name: Build v0.61 RAW remosaic vendor oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify v0.61 read-only boundaries
        run: |
          set -euo pipefail
          ACT='suite_android/app/src/main/java/com/truthraw/adaptiveui/RawRemosaicVendorCharacteristicsOracleActivity.kt'
          grep -F 'truthraw.honor-raw-remosaic-vendor-characteristics-oracle.v0.61' "$ACT"
          grep -F 'CAMERA2_CHARACTERISTICS_RAW_REMOSAIC_DIRECT_TYPED_READ_ONLY' "$ACT"
          grep -F 'physicalCameraScene' "$ACT"
          grep -F 'professionalTeleRawLogicalCameraID' "$ACT"
          grep -F 'hwCaptureRawStreamConfigurations' "$ACT"
          grep -F 'rawCaptureSize' "$ACT"
          grep -F 'remosaicSupported' "$ACT"
          grep -F 'sensorRemosaicSupported' "$ACT"
          grep -F 'rearSensorZoomRemosaicSupported' "$ACT"
          grep -F 'IntArray::class.java' "$ACT"
          grep -F 'java.lang.Byte.TYPE' "$ACT"
          grep -F 'java.lang.Integer.TYPE' "$ACT"
          grep -F 'c.get(key)' "$ACT"
          grep -F 'cameraOpenedByTruthRaw", false' "$ACT"
          grep -F 'honorBinderInvokedByTruthRaw", false' "$ACT"

          python3 - <<'PY'
          from pathlib import Path
          s=Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/RawRemosaicVendorCharacteristicsOracleActivity.kt').read_text()
          required=[
              'getCameraCharacteristics(',
              'CameraCharacteristics.Key(spec.name, clazz)',
              'physicalCameraSceneContains66',
              'recordWidthFrom452Parser',
              'packageIdentitySpoofedByTruthRaw", false',
          ]
          for token in required:
              assert token in s, token
          forbidden=[
              'openCamera(',
              'createCaptureRequest',
              'ImageReader.newInstance(',
              'CameraCaptureSession',
              'bindService(',
              'setPhysicalCameraKey',
              'createExtensionSession',
              'ServiceHostSession',
          ]
          for token in forbidden:
              assert token not in s, token
          print('v0.61 read-only invariants PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-v061-honor-raw-remosaic-vendor-oracle-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
