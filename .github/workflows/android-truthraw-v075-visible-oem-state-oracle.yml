name: TruthRaw v0.75 Scene53 visible OEM state oracle

on:
  workflow_dispatch:
  push:
    branches:
      - test/physical5-visible-oem-state-oracle-v075
    paths:
      - 'suite_android/app/src/main/AndroidManifest.xml'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/Physical5HintRemosaicOracleActivity.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/TruthRawSettingsActivity.kt'
      - '.github/workflows/android-truthraw-v075-visible-oem-state-oracle.yml'

permissions:
  contents: read

jobs:
  build-v075:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify v0.75 route invariants
        run: |
          set -euo pipefail
          SRC='suite_android/app/src/main/java/com/truthraw/adaptiveui/Physical5HintRemosaicOracleActivity.kt'
          grep -F 'truthraw.physical5-visible-oem-state-oracle.v0.75' "$SRC"
          grep -F 'CAMERA2_OEM_SCENE53_VISIBLE_STATE_SINGLE_FRAME_ORACLE' "$SRC"
          grep -F 'cameraSceneMode' "$SRC"
          grep -F 'aiCaptureHint' "$SRC"
          grep -F 'smartSuggestHint' "$SRC"
          grep -F 'FrameType' "$SRC"
          grep -F 'masterSensorSlotId' "$SRC"
          grep -F 'previewPhysicalCam' "$SRC"
          grep -F 'ActiveCameraInfo' "$SRC"
          grep -F 'MultiCameraIds' "$SRC"
          grep -F 'snapshotVisibleOemState' "$SRC"
          grep -F 'SCENE_ULTRA_HIGH_PIXEL = 53' "$SRC"
          grep -F 'addSensorPixelModeUsed' "$SRC"
          grep -F 'captureSingleRequest' "$SRC"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/Physical5HintRemosaicOracleActivity.kt').read_text()
          forbidden=['setRepeatingRequest','captureBurst','setRepeatingBurst','DngCreator(','bindService(']
          for token in forbidden:
              assert token not in s, token
          assert 'scientificMasterModified", false' in s
          assert 'multiFrameFusionUsed", false' in s
          assert 'independentEvidenceCount", 1' in s
          assert 'val derivedRemosaic = if (chosenHint == 5) 1 else 0' in s
          print('v0.75 visible-state route invariants PASS')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-v075-visible-oem-state-oracle-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
