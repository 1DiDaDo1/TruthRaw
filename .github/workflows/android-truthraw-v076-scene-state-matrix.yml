name: TruthRaw v0.76 matched scene-state matrix

on:
  workflow_dispatch:
  push:
    branches:
      - test/physical5-scene-state-matrix-v076
    paths:
      - 'suite_android/app/src/main/AndroidManifest.xml'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/Physical5SceneStateMatrixActivity.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/TruthRawSettingsActivity.kt'
      - '.github/workflows/android-truthraw-v076-scene-state-matrix.yml'

permissions:
  contents: read

jobs:
  build-v076:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify v0.76 matrix invariants
        run: |
          set -euo pipefail
          SRC='suite_android/app/src/main/java/com/truthraw/adaptiveui/Physical5SceneStateMatrixActivity.kt'
          grep -F 'truthraw.physical5-scene-state-matrix.v0.76' "$SRC"
          grep -F 'CAMERA2_MATCHED_LOCKED_SCENE_STATE_MATRIX_SINGLE_FRAME_PER_EVIDENCE' "$SRC"
          grep -F 'cameraSceneMode_UltraHighPixel_53' "$SRC"
          grep -F 'cameraSceneMode_UltraResolution_110' "$SRC"
          grep -F 'cameraSceneMode_ProRaw_66' "$SRC"
          grep -F 'chooseLockedSettings' "$SRC"
          grep -F 'applyLockedControls' "$SRC"
          grep -F 'CONTROL_AE_MODE_OFF' "$SRC"
          grep -F 'CONTROL_AF_MODE_OFF' "$SRC"
          grep -F 'snapshotVisibleOemState' "$SRC"
          grep -F 'visibleOemStateDifferentialObserved' "$SRC"
          grep -F 'hintUserValue' "$SRC"
          grep -F 'captureSingleRequest' "$SRC"
          grep -F 'addSensorPixelModeUsed' "$SRC"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/Physical5SceneStateMatrixActivity.kt').read_text()
          forbidden=['setRepeatingRequest','captureBurst','setRepeatingBurst','DngCreator(','bindService(']
          for token in forbidden:
              assert token not in s, token
          assert 'MasterFilmSensorType_tele_3' not in s
          assert 'teleconverterEnable_on' not in s
          assert 'multiFrameFusionUsed", false' in s
          assert 'scientificMasterModified", false' in s
          assert 'singleFramePerEvidenceItem", true' in s
          assert 'fusionAcrossFrames", false' in s
          assert 'analysisBasisHonorCameraApkSha256' in s
          print('v0.76 matrix invariants PASS')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-v076-matched-scene-state-matrix-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
