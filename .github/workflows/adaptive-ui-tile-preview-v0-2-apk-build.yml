name: Adaptive UI Tile Preview v0.2 APK Build

on:
  push:
    branches:
      - research/adaptive-ui-tile-preview-v0.2-2026-09-11
    paths:
      - 'app/android/truthraw-adaptive-ui-v01/**'
      - 'docs/research/adaptive-ui-ingress-v0.1/**'
      - 'docs/research/adaptive-ui-tile-preview-v0.2/**'
      - 'docs/research/tile-native-dng-source-v0.1/**'
      - 'docs/research/full-frame-streaming-v0.1/native/**'
      - 'canonical/reconstruction/v4.7i/native/include/**'
      - '.github/workflows/adaptive-ui-tile-preview-v0-2-apk-build.yml'
  pull_request:
    paths:
      - 'app/android/truthraw-adaptive-ui-v01/**'
      - 'docs/research/adaptive-ui-tile-preview-v0.2/**'
      - 'docs/research/tile-native-dng-source-v0.1/**'
      - 'docs/research/full-frame-streaming-v0.1/native/**'
      - 'canonical/reconstruction/v4.7i/native/include/**'
      - '.github/workflows/adaptive-ui-tile-preview-v0-2-apk-build.yml'

permissions:
  contents: read

jobs:
  build-tile-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Upstream TruthRaw integrity
        run: |
          python3 docs/research/building-runtime-v0.1/tools/verify_integrity_v0_1.py
          python3 docs/research/technical-backplane-v0.1/tools/verify_integrity_v0_1.py
          python3 docs/research/tile-native-dng-source-v0.1/tools/verify_integrity_v0_1.py
          python3 docs/research/adaptive-ui-ingress-v0.1/tools/verify_contract_v0_1.py

      - name: Adaptive tile-preview contract
        run: python3 docs/research/adaptive-ui-tile-preview-v0.2/tools/verify_contract_v0_2.py

      - name: UI still has no camera permission
        run: |
          if grep -R "android.permission.CAMERA" app/android/truthraw-adaptive-ui-v01/app/src/main/AndroidManifest.xml; then
            echo "Adaptive UI must not acquire capture authority"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK and NDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'cmake;3.22.1' \
            'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble adaptive tile-preview APK
        working-directory: app/android/truthraw-adaptive-ui-v01
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify native bridge packaged and report evidence
        run: |
          APK='app/android/truthraw-adaptive-ui-v01/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libtruthraw_ui_preview_bridge.so'
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/libtruthraw_ui_preview_bridge.so'; then
            echo 'Unexpected non-arm64 preview bridge ABI' >&2
            exit 1
          fi
          echo "adaptive_ui_tile_preview_apk_bytes=$(stat -c%s "$APK")"
          echo "adaptive_ui_tile_preview_apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"
          echo "source_raw_full_materialization=0_by_contract"
          echo "preview_source_workspace=BOUNDED_CHUNKS"
          echo "scientific_color_authority=0"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-adaptive-ui-tile-preview-v0.2-debug-arm64
          path: app/android/truthraw-adaptive-ui-v01/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
