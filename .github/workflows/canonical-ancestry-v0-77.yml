name: Canonical Ancestry v0.77

on:
  push:
    branches:
      - integration/truthraw-suite-v0-77-canonical-ancestry-spine
    paths:
      - 'suite_android/app/src/main/cpp/canonical_ancestry_v0_77.*'
      - 'docs/research/canonical-ancestry-spine-v0.77/**'
      - '.github/workflows/canonical-ancestry-v0-77.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ancestry:
    name: ${{ matrix.compiler }} ancestry exactness
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S docs/research/canonical-ancestry-spine-v0.77 -B build/ancestry -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/ancestry --parallel 2
      - name: Test
        run: ctest --test-dir build/ancestry --output-on-failure
