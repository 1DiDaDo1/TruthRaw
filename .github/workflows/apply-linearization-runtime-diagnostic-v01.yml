name: Apply LinearizationTable Runtime Diagnostic v0.1

on:
  push:
    paths:
      - 'tools/apply_linearization_runtime_diagnostic_v01.py'
      - '.github/workflows/apply-linearization-runtime-diagnostic-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-capability-linearization-table-runtime-diagnostic-v01
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply deterministic envelope-only patch
        run: |
          set -euo pipefail
          python3 tools/apply_linearization_runtime_diagnostic_v01.py
          git diff --exit-code -- suite_android/app/src/main/java/com/truthraw/adaptiveui/DngContainerMetadataParser.kt
          git diff --exit-code -- suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityRadiometricLinearizationTableValidatorV01.kt
          ! grep -F '50712 to "LinearizationTable"' suite_android/app/src/main/java/com/truthraw/adaptiveui/DngContainerMetadataParser.kt
          grep -F '"radiometric_linearization_table_v0_1"' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02.kt

      - name: Run exposure and dependency regressions
        working-directory: suite_android
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests com.truthraw.adaptiveui.SourceCapabilityRadiometricLinearizationTableRuntimeDiagnosticV01Test
          --tests com.truthraw.adaptiveui.SourceCapabilityRadiometricLinearizationTableValidatorV01Test
          --tests com.truthraw.adaptiveui.SourceCapabilityRuntimeEvidenceEnvelopeV01Test
          --tests com.truthraw.adaptiveui.SourceCapabilityRadiometricEffectiveBlackNormalizationValidatorV01Test

      - name: Commit envelope exposure only
        run: |
          set -euo pipefail
          ENV='suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02.kt'
          if git diff --quiet -- "$ENV"; then
            echo 'Envelope already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ENV"
          git diff --cached --name-only | grep -Fx "$ENV"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'android: expose LinearizationTable read-only runtime diagnostic v0.1'
          git push origin HEAD:feat/source-capability-linearization-table-runtime-diagnostic-v01
