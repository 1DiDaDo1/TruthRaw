name: FotoGraaf HONOR route-proof v0.4 build

on:
  push:
    branches:
      - work/fotograaf-honor-route-proof-v04-sample-domain
    paths:
      - 'capture/android/camera5-200mp-probe-v07/**'
      - '.github/workflows/fotograaf-honor-route-proof-v04-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android SDK 35
        run: "$SDKMANAGER 'platforms;android-35' 'build-tools;35.0.0'"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        working-directory: capture/android/camera5-200mp-probe-v07
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/fotograaf-v04-build.log"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TruthRaw_HONOR_Route_Proof_v0_4_build_diagnostics
          path: fotograaf-v04-build.log
          if-no-files-found: error

      - name: Upload debug APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TruthRaw_HONOR_Route_Proof_v0_4_debug
          path: capture/android/camera5-200mp-probe-v07/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enforce build result
        if: steps.assemble.outcome != 'success'
        run: exit 1
