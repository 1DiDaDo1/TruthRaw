name: FotoGraaf HONOR route-proof v0.4 build

on:
  push:
    branches:
      - work/fotograaf-honor-route-proof-v04-sample-domain
    paths:
      - 'capture/android/camera5-200mp-probe-v07/**'
      - '.github/workflows/fotograaf-honor-route-proof-v04-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        working-directory: capture/android/camera5-200mp-probe-v07
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TruthRaw_HONOR_Route_Proof_v0_4_debug
          path: capture/android/camera5-200mp-probe-v07/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
