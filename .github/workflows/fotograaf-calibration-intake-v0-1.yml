name: FotoGraaf Calibration Intake v0.1

on:
  push:
    paths:
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_CALIBRATION_INTAKE_CONTRACT_V0_1.json'
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_C0_C1_C2_INTAKE_PIPELINE_V0_1_2026-09-14.md'
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_HONOR_TELE_C0_C1_C2_INTAKE_SESSION_TEMPLATE_V0_1.json'
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_HONOR_TELE_CALIBRATION_ACQUISITION_PLAN_V0_1.json'
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_C0_CAPTURE_IDENTITY_CONTRACT_V0_1.json'
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_CALIBRATION_DATASET_MANIFEST_CONTRACT_V0_1.json'
      - 'tools/build_fotograaf_calibration_intake_v0_1.py'
      - 'tools/verify_fotograaf_c0_capture_identity_v0_1.py'
      - 'tools/verify_fotograaf_calibration_dataset_manifest_v0_1.py'
      - 'tests/test_build_fotograaf_calibration_intake_v0_1.py'
      - '.github/workflows/fotograaf-calibration-intake-v0-1.yml'
  pull_request:
    paths:
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_CALIBRATION_INTAKE_CONTRACT_V0_1.json'
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_C0_C1_C2_INTAKE_PIPELINE_V0_1_2026-09-14.md'
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_HONOR_TELE_C0_C1_C2_INTAKE_SESSION_TEMPLATE_V0_1.json'
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_HONOR_TELE_CALIBRATION_ACQUISITION_PLAN_V0_1.json'
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_C0_CAPTURE_IDENTITY_CONTRACT_V0_1.json'
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_CALIBRATION_DATASET_MANIFEST_CONTRACT_V0_1.json'
      - 'tools/build_fotograaf_calibration_intake_v0_1.py'
      - 'tools/verify_fotograaf_c0_capture_identity_v0_1.py'
      - 'tools/verify_fotograaf_calibration_dataset_manifest_v0_1.py'
      - 'tests/test_build_fotograaf_calibration_intake_v0_1.py'
      - '.github/workflows/fotograaf-calibration-intake-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-intake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compile intake builder
        run: python3 -m py_compile tools/build_fotograaf_calibration_intake_v0_1.py

      - name: Validate intake contract against Honor Phase-A plan
        run: >-
          python3 tools/build_fotograaf_calibration_intake_v0_1.py
          --intake-contract docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_CALIBRATION_INTAKE_CONTRACT_V0_1.json
          --c0-contract docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_C0_CAPTURE_IDENTITY_CONTRACT_V0_1.json
          --manifest-contract docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_CALIBRATION_DATASET_MANIFEST_CONTRACT_V0_1.json
          --plan docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_HONOR_TELE_CALIBRATION_ACQUISITION_PLAN_V0_1.json

      - name: Run fail-closed C0/C1/C2 intake tests
        run: >-
          python3 -m unittest
          tests/test_build_fotograaf_calibration_intake_v0_1.py
          -v
