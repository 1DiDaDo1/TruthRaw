name: DNG Projection Export v0.1

on:
  push:
    branches:
      - research/dng-projection-export-v0.1-2026-09-12-ci-fix
    paths:
      - 'docs/research/dng-projection-export-v0.1/**'
      - 'app/android/truthraw-adaptive-ui-v01/**'
      - 'docs/research/scientific-master-streaming-binding-v0.2/**'
      - 'docs/research/scientific-master-streaming-binding-v0.1/**'
      - 'docs/research/scientific-master-digest-v0.1/**'
      - 'docs/research/full-frame-streaming-v0.1/native/**'
      - 'docs/research/scientific-preview-source-binding-v0.1/**'
      - 'docs/research/scientific-preview-source-binding-v0.2/**'
      - 'docs/research/technical-backplane-v0.1/**'
      - 'docs/research/technical-backplane-phase2-v0.1/**'
      - 'docs/research/dng-color-binding-producer-v0.1/**'
      - 'docs/research/dng-color-binding-producer-v0.2/**'
      - 'docs/research/tile-native-dng-source-v0.1/**'
      - 'canonical/reconstruction/v4.7i/native/**'
      - '.github/workflows/dng-projection-export-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-export:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            cc: gcc
            cxx: g++
            build_type: Release
            sanitizer: 'OFF'
          - name: Clang Release
            cc: clang
            cxx: clang++
            build_type: Release
            sanitizer: 'OFF'
          - name: Clang ASan UBSan
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizer: 'ON'
    steps:
      - uses: actions/checkout@v4

      - name: Configure host export test
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          EXTRA=''
          if [ '${{ matrix.sanitizer }}' = 'ON' ]; then
            EXTRA='-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
          fi
          cmake -S docs/research/dng-projection-export-v0.1 \
            -B /tmp/truthraw-dng-export \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} $EXTRA

      - name: Build and falsify projection export
        run: |
          cmake --build /tmp/truthraw-dng-export --parallel 2
          ctest --test-dir /tmp/truthraw-dng-export --output-on-failure
          /tmp/truthraw-dng-export/test_dng_projection_export_v0_1

  build-arm64-export-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify export authority and role separation contract
        run: |
          H='docs/research/dng-projection-export-v0.1/native/dng_projection_export_v0_1.h'
          C='docs/research/dng-projection-export-v0.1/native/dng_projection_export_v0_1.cpp'
          B='app/android/truthraw-adaptive-ui-v01/app/src/main/cpp/projection_export_bridge.cpp'
          K='app/android/truthraw-adaptive-ui-v01/app/src/main/java/com/truthraw/adaptiveui/ProjectionExport.kt'
          A='app/android/truthraw-adaptive-ui-v01/app/src/main/java/com/truthraw/adaptiveui/ProjectionExportActivity.kt'
          M='app/android/truthraw-adaptive-ui-v01/app/src/main/AndroidManifest.xml'
          grep -F 'ScientificIdentityMismatch' "$H"
          grep -F 'scientificMasterDigestVerified' "$H"
          grep -F 'fullScientificMasterMaterialized = false' "$H"
          grep -F 'CFA_DNG_16_RECONSTRUCTED_PROJECTION' "$C"
          grep -F 'LINEAR_DNG_16_COMPATIBILITY_PROJECTION' "$C"
          grep -F 'reverify_source_sha256' "$B"
          grep -F 'reset_output' "$B"
          grep -F 'CFA DNG (rawsensor-projectie) opslaan' "$K"
          grep -F 'Scientific Master .trmaster opslaan' "$A"
          grep -F '.ProjectionExportActivity' "$M"
          echo 'projection_scientific_authority=NONE'
          echo 'projection_changes_evidence=FALSE'
          echo 'historical_rawsensor_term_reserved_for_CFA=TRUE'

      - name: Verify CPU execution backend remains free of TruthRaw Vulkan linkage
        run: |
          CMAKE='app/android/truthraw-adaptive-ui-v01/app/src/main/cpp/CMakeLists.txt'
          if grep -Eiq '(^|[^A-Za-z])(vulkan|libvulkan|Vk[A-Z])' "$CMAKE"; then
            echo 'Unexpected Vulkan dependency in current CPU reference build' >&2
            exit 1
          fi
          echo 'truthraw_execution_backend=CPU_NDK_REFERENCE_NO_VULKAN'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK and NDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'cmake;3.22.1' \
            'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 DNG-export APK
        working-directory: app/android/truthraw-adaptive-ui-v01
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify native export bridge and APK identity
        run: |
          APK='app/android/truthraw-adaptive-ui-v01/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          test -s /tmp/libtruthraw_ui_preview_bridge.so
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_NativeProjectionExportBridge_exportScientificProjection'
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_NativeTilePreviewBridge_buildFinalizedScientificColorPreview'
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/libtruthraw_ui_preview_bridge.so'; then
            echo 'Unexpected non-arm64 preview bridge ABI' >&2
            exit 1
          fi
          echo "dng_export_apk_bytes=$(stat -c%s "$APK")"
          echo "dng_export_apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"
          echo 'projection_roles=LINEAR_DNG_COMPAT,CFA_DNG_RAWSENSOR_PROJECTION,SCIENTIFIC_MASTER_TRMASTER_F32'
          echo 'physical_lightroom_compatibility=UNPROVEN_UNTIL_DEVICE_EXPORT_AND_IMPORT'

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-dng-projection-export-v0.1-debug-arm64
          path: app/android/truthraw-adaptive-ui-v01/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
