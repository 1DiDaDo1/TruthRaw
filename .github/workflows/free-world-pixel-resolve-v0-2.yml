name: D.RAW Free-World Pixel Resolve v0.2

on:
  push:
    branches:
      - research/free-world-output-pixel-v0-1
    paths:
      - 'docs/research/free-world-output-pixel-v0.1/**'
      - 'docs/research/free-world-pixel-resolve-2d-v0.2/**'
      - '.github/workflows/free-world-pixel-resolve-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          set -euo pipefail
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CXX=clang++
          else
            export CXX=g++
          fi
          cmake -S docs/research/free-world-pixel-resolve-2d-v0.2                 -B /tmp/free-world-pixel-v02                 -DCMAKE_BUILD_TYPE=Release                 -DCMAKE_CXX_COMPILER="$CXX"

      - name: Build
        run: cmake --build /tmp/free-world-pixel-v02 --parallel 2

      - name: Test
        run: ctest --test-dir /tmp/free-world-pixel-v02 --output-on-failure

  sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and run ASan/UBSan reference
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O1 -g             -Wall -Wextra -Wpedantic -Werror             -ffp-contract=off -fno-fast-math             -fsanitize=address,undefined -fno-omit-frame-pointer             -Idocs/research/free-world-pixel-resolve-2d-v0.2/native             docs/research/free-world-pixel-resolve-2d-v0.2/tests/test_free_world_pixel_resolve_2d_v0_2.cpp             docs/research/free-world-pixel-resolve-2d-v0.2/native/free_world_pixel_resolve_2d_v0_2.cpp             -o /tmp/free-world-pixel-v02-sanitize
          /tmp/free-world-pixel-v02-sanitize
