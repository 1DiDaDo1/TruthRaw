name: D.RAW Free-World Scene Research v0.2-v0.5

on:
  push:
    branches:
      - research/free-world-output-pixel-v0-1
    paths:
      - 'docs/research/free-world-output-pixel-v0.1/**'
      - 'docs/research/free-world-pixel-resolve-2d-v0.2/**'
      - 'docs/research/free-world-scientific-open-scene-binding-v0.3/**'
      - 'docs/research/free-world-deep-scene-contribution-v0.4/**'
      - 'docs/research/free-world-deep-scene-binding-v0.5/**'
      - '.github/workflows/free-world-pixel-resolve-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Configure v0.2
        run: |
          set -euo pipefail
          if [ "${{ matrix.compiler }}" = "clang" ]; then CXX=clang++; else CXX=g++; fi
          cmake -S docs/research/free-world-pixel-resolve-2d-v0.2                 -B /tmp/free-world-pixel-v02                 -DCMAKE_BUILD_TYPE=Release                 -DCMAKE_CXX_COMPILER="$CXX"

      - name: Build v0.2
        run: cmake --build /tmp/free-world-pixel-v02 --parallel 2

      - name: Test v0.2
        run: ctest --test-dir /tmp/free-world-pixel-v02 --output-on-failure

      - name: Configure v0.3 binding
        run: |
          set -euo pipefail
          if [ "${{ matrix.compiler }}" = "clang" ]; then CXX=clang++; else CXX=g++; fi
          cmake -S docs/research/free-world-scientific-open-scene-binding-v0.3                 -B /tmp/free-world-binding-v03                 -DCMAKE_BUILD_TYPE=Release                 -DCMAKE_CXX_COMPILER="$CXX"

      - name: Build v0.3 binding
        run: cmake --build /tmp/free-world-binding-v03 --parallel 2

      - name: Test v0.3 binding
        run: ctest --test-dir /tmp/free-world-binding-v03 --output-on-failure

      - name: Configure v0.4 deep scene
        run: |
          set -euo pipefail
          if [ "${{ matrix.compiler }}" = "clang" ]; then CXX=clang++; else CXX=g++; fi
          cmake -S docs/research/free-world-deep-scene-contribution-v0.4 \
                -B /tmp/free-world-deep-v04 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER="$CXX"

      - name: Build v0.4 deep scene
        run: cmake --build /tmp/free-world-deep-v04 --parallel 2

      - name: Test v0.4 deep scene
        run: ctest --test-dir /tmp/free-world-deep-v04 --output-on-failure

      - name: Configure v0.5 deep binding
        run: |
          set -euo pipefail
          if [ "${{ matrix.compiler }}" = "clang" ]; then CXX=clang++; else CXX=g++; fi
          cmake -S docs/research/free-world-deep-scene-binding-v0.5 \
                -B /tmp/free-world-deep-v05 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER="$CXX"

      - name: Build v0.5 deep binding
        run: cmake --build /tmp/free-world-deep-v05 --parallel 2

      - name: Test v0.5 deep binding
        run: ctest --test-dir /tmp/free-world-deep-v05 --output-on-failure

  sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and run v0.2 ASan/UBSan
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O1 -g             -Wall -Wextra -Wpedantic -Werror             -ffp-contract=off -fno-fast-math             -fsanitize=address,undefined -fno-omit-frame-pointer             -Idocs/research/free-world-pixel-resolve-2d-v0.2/native             docs/research/free-world-pixel-resolve-2d-v0.2/tests/test_free_world_pixel_resolve_2d_v0_2.cpp             docs/research/free-world-pixel-resolve-2d-v0.2/native/free_world_pixel_resolve_2d_v0_2.cpp             -o /tmp/free-world-pixel-v02-sanitize
          /tmp/free-world-pixel-v02-sanitize

      - name: Configure and run v0.3 ASan/UBSan
        run: |
          set -euo pipefail
          cmake -S docs/research/free-world-scientific-open-scene-binding-v0.3                 -B /tmp/free-world-binding-v03-sanitize                 -DCMAKE_BUILD_TYPE=Debug                 -DCMAKE_CXX_COMPILER=clang++                 -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"                 -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build /tmp/free-world-binding-v03-sanitize --parallel 2
          ctest --test-dir /tmp/free-world-binding-v03-sanitize --output-on-failure

      - name: Configure and run v0.4 ASan/UBSan
        run: |
          set -euo pipefail
          cmake -S docs/research/free-world-deep-scene-contribution-v0.4 \
                -B /tmp/free-world-deep-v04-sanitize \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build /tmp/free-world-deep-v04-sanitize --parallel 2
          ctest --test-dir /tmp/free-world-deep-v04-sanitize --output-on-failure

      - name: Configure and run v0.5 ASan/UBSan
        run: |
          set -euo pipefail
          cmake -S docs/research/free-world-deep-scene-binding-v0.5 \
                -B /tmp/free-world-deep-v05-sanitize \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build /tmp/free-world-deep-v05-sanitize --parallel 2
          ctest --test-dir /tmp/free-world-deep-v05-sanitize --output-on-failure
