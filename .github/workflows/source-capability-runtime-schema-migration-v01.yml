name: Source Capability Runtime Evidence Envelope v0.1 Migration

on:
  push:
    branches:
      - feat/draw-observation-evidence-architecture-v01
    paths:
      - '.github/workflows/source-capability-runtime-schema-migration-v01.yml'

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/draw-observation-evidence-architecture-v01
          fetch-depth: 0

      - name: Apply deterministic schema migration
        run: python3 tools/apply_source_capability_runtime_schema_migration_v01.py

      - name: Prove migration diff is scoped
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'D.RAW/SourceCapabilityRuntimeEvidenceEnvelope/0.1' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02.kt
          grep -F 'D.RAW/ObservationEvidenceLedger/0.1' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02.kt
          test -f suite_android/app/src/test/java/com/truthraw/adaptiveui/SourceCapabilityRuntimeEvidenceEnvelopeV01Test.kt

      - name: Run focused Android unit regression
        working-directory: suite_android
        run: ./gradlew :app:testDebugUnitTest --tests com.truthraw.adaptiveui.SourceCapabilityRuntimeEvidenceEnvelopeV01Test

      - name: Commit validated migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02.kt \
            suite_android/app/src/test/java/com/truthraw/adaptiveui/SourceCapabilityRuntimeEvidenceEnvelopeV01Test.kt
          git diff --cached --quiet && { echo 'No migration changes to commit'; exit 1; }
          git commit -m 'Separate runtime Source Capability evidence-envelope schema v0.1'
          git push origin HEAD:feat/draw-observation-evidence-architecture-v01
