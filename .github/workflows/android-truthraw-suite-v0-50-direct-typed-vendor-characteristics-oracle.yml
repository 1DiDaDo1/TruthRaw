name: TruthRaw v0.50 Direct Typed Vendor Characteristics Oracle

on:
  push:
    branches:
      - integration/truthraw-suite-v0-50-direct-typed-vendor-characteristics-oracle
    paths:
      - 'suite_android/app/src/main/AndroidManifest.xml'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/DirectTypedVendorCharacteristicsOracleActivity.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/TruthRawSuiteLauncherActivity.kt'
      - 'docs/HONOR_V050_DIRECT_TYPED_VENDOR_CHARACTERISTICS_ORACLE_PLAN_2026-09-19.md'
      - 'state/HONOR_V050_DIRECT_TYPED_VENDOR_CHARACTERISTICS_ORACLE_PLAN_2026-09-19.json'
      - '.github/workflows/android-truthraw-suite-v0-50-direct-typed-vendor-characteristics-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v050:
    name: Build v0.50 direct typed vendor characteristics oracle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify v0.50 read-only authority
        run: |
          ACT='suite_android/app/src/main/java/com/truthraw/adaptiveui/DirectTypedVendorCharacteristicsOracleActivity.kt'
          PLAN='state/HONOR_V050_DIRECT_TYPED_VENDOR_CHARACTERISTICS_ORACLE_PLAN_2026-09-19.json'

          grep -F 'truthraw.direct-typed-vendor-characteristics-oracle.v0.50' "$ACT"
          grep -F 'CAMERA2_CHARACTERISTICS_DIRECT_TYPED_VENDOR_KEY_READ_ONLY' "$ACT"
          grep -F 'physicalCameraScene' "$ACT"
          grep -F 'rawSensorResolution' "$ACT"
          grep -F 'sceneCameraIdCapability' "$ACT"
          grep -F 'ultraResolutionSwitchSupportedSize' "$ACT"
          grep -F 'IntArray::class.java' "$ACT"
          grep -F 'java.lang.Byte.TYPE' "$ACT"
          grep -F 'c.get(key)' "$ACT"
          grep -F 'typingObservedInBothComparedApks' "$PLAN"

          python3 - <<'PY'
          from pathlib import Path
          s=Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/DirectTypedVendorCharacteristicsOracleActivity.kt').read_text()
          required=[
              'getCameraCharacteristics(',
              'CameraCharacteristics.Key(spec.name, clazz)',
              'listedInCameraCharacteristicsKeys',
              'directGetCompleted',
              'packageIdentitySpoofedByTruthRaw", false',
          ]
          for token in required:
              assert token in s, token

          forbidden=[
              'openCamera(',
              'createCaptureRequest',
              'import android.media.ImageReader',
              'CameraCaptureSession',
              'bindService(',
              'setPhysicalCameraKey',
              'createExtensionSession',
          ]
          for token in forbidden:
              assert token not in s, token
          print('v0.50 direct-read-only invariants PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-v0-50-direct-typed-vendor-characteristics-oracle-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
