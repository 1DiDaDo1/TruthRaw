name: Canonical Integrity

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify byte-exact canonical provenance
        run: python tools/verify_canonical_integrity_v2.py
      - name: Run zero-line TruthRange architecture self-test
        run: |
          python docs/research/zero-line-dynamic-range-v0.1/implementation/test_truthrange_core_v0_1.py
      - name: Build and run TruthRange v0.2 latent binding
        run: |
          cmake -S docs/research/truthrange-latent-binding-v0.2 -B /tmp/truthraw_truthrange_v02
          cmake --build /tmp/truthraw_truthrange_v02 --parallel 2
          /tmp/truthraw_truthrange_v02/test_truthrange_latent_v0_2
      - name: Build and run TruthRange v0.3 dense uncertainty contract
        run: |
          cmake -S docs/research/truthrange-dense-uncertainty-v0.3 -B /tmp/truthraw_truthrange_v03
          cmake --build /tmp/truthraw_truthrange_v03 --parallel 2
          /tmp/truthraw_truthrange_v03/test_truthrange_dense_uncertainty_v0_3
      - name: Compile v4.7i reconstruction core
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -c \
            canonical/reconstruction/v4.7i/native/src/core.cpp \
            -Icanonical/reconstruction/v4.7i/native/include \
            -o /tmp/truthraw_v47i_core.o
      - name: Build v4.7k output acutance native reference
        run: |
          cmake -S canonical/output-acutance/v4.7k/native -B /tmp/truthraw_v47k_build
          cmake --build /tmp/truthraw_v47k_build --parallel 2
      - name: Compile and run v5.0g uncertainty parity
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            canonical/uncertainty/v5.0g/runtime/uncertainty_runtime_v5_0g.cpp \
            canonical/uncertainty/v5.0g/runtime/runtime_parity_test.cpp \
            -Icanonical/uncertainty/v5.0g/runtime -o /tmp/truthraw_uncertainty_parity
          /tmp/truthraw_uncertainty_parity
      - name: Compile and run PTC v1.1 native self-test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            canonical/ptc/v1.1/native/src/ptc.cpp \
            canonical/ptc/v1.1/tests/ptc_selftest.cpp \
            -Icanonical/ptc/v1.1/native/include -o /tmp/truthraw_ptc_selftest
          /tmp/truthraw_ptc_selftest
      - name: Python syntax smoke
        run: |
          python -m py_compile \
            docs/research/zero-line-dynamic-range-v0.1/implementation/truthrange_core_v0_1.py \
            docs/research/zero-line-dynamic-range-v0.1/implementation/test_truthrange_core_v0_1.py \
            canonical/ptc/v1.1/python/truthraw_ptc.py \
            canonical/output-acutance/v4.7k/output_acutance_v4_7k.py \
            canonical/uncertainty/v5.0g/source/uncertainty_core_v5_0g.py \
            canonical/uncertainty/v5.0g/source/prospective_holdout_v5_0g.py \
            canonical/unified-material/v5.0e/materialize_source.py \
            tools/camera5_200mp_runtime_gate_v07.py \
            tools/normalize_camera5_200mp_raw_v07.py
