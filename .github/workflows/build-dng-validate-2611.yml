name: Build DNG Validate 2611

on:
  push:
    branches:
      - validation/dng-sdk-2611-build
    paths:
      - .github/workflows/build-dng-validate-2611.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential pkg-config \
            libjpeg-dev zlib1g-dev libexpat1-dev \
            libbrotli-dev liblcms2-dev

      - name: Build pinned libjxl 0.9.0
        run: |
          git clone \
            --branch v0.9.0 \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/libjxl/libjxl.git /tmp/libjxl-src
          test "$(git -C /tmp/libjxl-src rev-parse HEAD)" = "c51cffd7587d27fdd73f0be856db3b730314f03c"

          cmake -S /tmp/libjxl-src -B /tmp/libjxl-build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/libjxl-install \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DJPEGXL_ENABLE_TOOLS=OFF \
            -DJPEGXL_ENABLE_DEVTOOLS=OFF \
            -DJPEGXL_ENABLE_JPEGLI=OFF \
            -DJPEGXL_ENABLE_JPEGLI_LIBJPEG=OFF \
            -DJPEGXL_ENABLE_DOXYGEN=OFF \
            -DJPEGXL_ENABLE_MANPAGES=OFF \
            -DJPEGXL_ENABLE_BENCHMARK=OFF \
            -DJPEGXL_ENABLE_EXAMPLES=OFF \
            -DJPEGXL_ENABLE_JNI=OFF \
            -DJPEGXL_ENABLE_SJPEG=OFF \
            -DJPEGXL_ENABLE_OPENEXR=OFF \
            -DJPEGXL_ENABLE_SKCMS=OFF \
            -DJPEGXL_ENABLE_TCMALLOC=OFF \
            -DJPEGXL_FORCE_SYSTEM_BROTLI=ON \
            -DJPEGXL_FORCE_SYSTEM_LCMS2=ON
          cmake --build /tmp/libjxl-build --parallel 2
          cmake --install /tmp/libjxl-build

          test -f /tmp/libjxl-install/include/jxl/encode.h
          test -f /tmp/libjxl-install/lib/libjxl.a
          test -f /tmp/libjxl-install/lib/libjxl_threads.a
          test -f /tmp/libjxl-install/lib/libjxl_cms.a
          grep -q 'JXL_ENC_FRAME_SETTING_BUFFERING' /tmp/libjxl-install/include/jxl/encode.h
          grep -q 'JxlEncoderOutputProcessor' /tmp/libjxl-install/include/jxl/encode.h
          grep -q 'JxlEncoderAddChunkedFrame' /tmp/libjxl-install/include/jxl/encode.h

      - name: Fetch pinned Adobe DNG SDK mirror and pinned Linux CMake wrapper
        run: |
          git clone https://github.com/hfiguiere/dng_sdk.git /tmp/dng-src
          git -C /tmp/dng-src checkout 11e5eb4259c2a7ad92d66e152e4974441d2e226a
          test "$(git -C /tmp/dng-src rev-parse HEAD)" = "11e5eb4259c2a7ad92d66e152e4974441d2e226a"

          git clone https://github.com/ssh4net/DNG-CMake.git /tmp/dng-cmake
          git -C /tmp/dng-cmake checkout 685f7139ba87afba2e40d4fd24a6455db6f8e9d9
          test "$(git -C /tmp/dng-cmake rev-parse HEAD)" = "685f7139ba87afba2e40d4fd24a6455db6f8e9d9"

          rm -rf /tmp/dng-cmake/dng_sdk /tmp/dng-cmake/xmp
          cp -a /tmp/dng-src/dng_sdk /tmp/dng-cmake/dng_sdk
          cp -a /tmp/dng-src/xmp /tmp/dng-cmake/xmp
          test -f /tmp/dng-cmake/xmp/toolkit/XMPCore/source/WXMPDocOps.cpp
          test -f /tmp/dng-cmake/xmp/toolkit/XMPFiles/source/WXMPFiles.cpp
          test -f /tmp/dng-cmake/dng_sdk/source/dng_jxl.cpp

      - name: Configure dng_validate against pinned libjxl
        run: |
          cmake -S /tmp/dng-cmake -B /tmp/dng-build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/libjxl-install \
            -DBUILD_DNG_VALIDATE=ON \
            -DDNG_VALIDATE=ON \
            -DDNG_WITH_XMP=ON \
            -DDNG_WITH_JXL=ON \
            -DDNG_WITH_JPEG=ON \
            -DXMP_USE_SYSTEM_ZLIB=ON

      - name: Build dng_validate
        run: |
          cmake --build /tmp/dng-build --target dng_validate --parallel 2
          BIN="$(find /tmp/dng-build -type f -name dng_validate -perm -111 | head -n1)"
          test -n "$BIN"
          "$BIN" 2>&1 | head -n 20 || true
          mkdir -p /tmp/artifact
          cp "$BIN" /tmp/artifact/dng_validate_1_7_1_2611_linux_x86_64

          JPEG_LIB="$(ldd "$BIN" | awk '/libjpeg\.so\.8/{print $3; exit}')"
          test -n "$JPEG_LIB"
          test -f "$JPEG_LIB"
          cp -L "$JPEG_LIB" /tmp/artifact/libjpeg.so.8

          sha256sum \
            /tmp/artifact/dng_validate_1_7_1_2611_linux_x86_64 \
            /tmp/artifact/libjpeg.so.8 | tee /tmp/artifact/SHA256SUMS.txt
          {
            echo 'Adobe DNG SDK + XMP source mirror commit: 11e5eb4259c2a7ad92d66e152e4974441d2e226a'
            echo 'Mirror commit message: Update to DNG SDK 1.7.1 2611'
            echo 'Linux CMake wrapper commit: 685f7139ba87afba2e40d4fd24a6455db6f8e9d9'
            echo 'Pinned libjxl tag: v0.9.0'
            echo 'Pinned libjxl commit: c51cffd7587d27fdd73f0be856db3b730314f03c'
            echo 'libjxl linkage: static install under /tmp/libjxl-install'
            echo 'Build options: BUILD_DNG_VALIDATE=ON DNG_VALIDATE=ON DNG_WITH_XMP=ON DNG_WITH_JXL=ON DNG_WITH_JPEG=ON XMP_USE_SYSTEM_ZLIB=ON'
            dpkg-query -W -f='libjpeg-turbo8 ${Version}\n' libjpeg-turbo8 || true
            pkg-config --modversion libbrotlienc || true
            pkg-config --modversion lcms2 || true
            uname -a
            c++ --version | head -n1
            cmake --version | head -n1
          } > /tmp/artifact/BUILD_PROVENANCE.txt
          ldd "$BIN" > /tmp/artifact/LDD.txt || true

      - name: Upload validator artifact
        uses: actions/upload-artifact@v4
        with:
          name: dng-validate-1.7.1-2611-linux-x86_64
          path: /tmp/artifact
          if-no-files-found: error
          retention-days: 7
