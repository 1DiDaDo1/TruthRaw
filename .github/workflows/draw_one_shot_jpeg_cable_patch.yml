name: D.RAW one-shot JPEG cable patch

on:
  push:
    branches:
      - feat/draw-workspace-free-raster-v01
    paths:
      - .github/workflows/draw_one_shot_jpeg_cable_patch.yml

permissions:
  contents: write

jobs:
  patch-main-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/draw-workspace-free-raster-v01
          fetch-depth: 0

      - name: Wire frozen JPEG binding into MainActivity
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/draw_jpeg_patch.py
          python3 /tmp/draw_jpeg_patch.py
          git diff --check
          FILE='suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt'
          grep -F 'pendingJpegBinding: DrawPhotoOutputBindingV01?' "$FILE"
          grep -F 'DrawPhotoOutputCableV01.bindFullResolutionJpeg' "$FILE"
          grep -F 'DrawPhotoOutputCableV01.validateCurrentOutputContext' "$FILE"
          grep -F 'Preview-onafhankelijke full-resolution output' "$FILE"
          test "$(grep -F -c 'JPG · full resolution compatibility' "$FILE")" -eq 1
          test "$(grep -F -c 'JPG · full resolution professional' "$FILE")" -eq 1
          git diff -- "$FILE"

      - name: Commit runtime wiring and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'D.RAW CI maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/draw_one_shot_jpeg_cable_patch.yml
          git add suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt
          git commit -m 'Android: decouple full-resolution JPEG from UI preview'
          git push origin HEAD:feat/draw-workspace-free-raster-v01
