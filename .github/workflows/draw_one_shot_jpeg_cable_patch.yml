name: D.RAW one-shot JPEG cable patch

on:
  push:
    branches:
      - feat/draw-workspace-free-raster-v01
    paths:
      - .github/workflows/draw_one_shot_jpeg_cable_patch.yml

permissions:
  contents: write

jobs:
  patch-main-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/draw-workspace-free-raster-v01
          fetch-depth: 0

      - name: Wire frozen JPEG binding into MainActivity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt")
          s = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              s = s.replace(old, new, 1)

          def regex_once(pattern: str, new: str, label: str):
              global s
              rx = re.compile(pattern, re.S)
              matches = list(rx.finditer(s))
              if len(matches) != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {len(matches)}")
              s = rx.sub(lambda _: new, s, count=1)

          replace_once(
              "    private var pendingJpegJobId: String? = null\n    private var jpegStatus: String? = null",
              "    private var pendingJpegJobId: String? = null\n    private var pendingJpegBinding: DrawPhotoOutputBindingV01? = null\n    private var jpegStatus: String? = null",
              "pending JPEG binding field",
          )

          launch_replacement = '''    @Suppress("DEPRECATION")
          private fun launchJpegExport(job: RawJob) {
              val route = preferredRoute()
              val flags = photoFlagsForRoute(route)
              val quarterTurns =
                  TruthRawOrientationOverride.quarterTurns(this, job.source)

              when (
                  val result = DrawPhotoOutputCableV01.bindFullResolutionJpeg(
                      job = job,
                      activeJobId = activeJobId,
                      route = route,
                      routeFlags = flags,
                      userQuarterTurns = quarterTurns,
                  )
              ) {
                  is DrawPhotoOutputBindResultV01.Failed -> {
                      pendingJpegJobId = null
                      pendingJpegBinding = null
                      jpegStatus = result.reason
                      render()
                      return
                  }
                  is DrawPhotoOutputBindResultV01.Ready -> {
                      pendingJpegJobId = result.binding.sourceJobId
                      pendingJpegBinding = result.binding
                      jpegStatus = null
                  }
              }

              val stem = job.source.displayName.substringBeforeLast('.', job.source.displayName)
              val intent = Intent(Intent.ACTION_CREATE_DOCUMENT).apply {
                  addCategory(Intent.CATEGORY_OPENABLE)
                  type = "image/jpeg"
                  putExtra(Intent.EXTRA_TITLE, "${stem}_draw_${route.lowercase()}_fullres.jpg")
              }
              startActivityForResult(intent, REQUEST_SAVE_JPEG)
          }

'''.replace("          ", "")
          regex_once(
              r'    @Suppress\("DEPRECATION"\)\n    private fun launchJpegExport\(job: RawJob\) \{.*?\n    \}\n\n(?=    @Suppress\("DEPRECATION"\)\n    private fun launchFullColourScientificMasterExport)',
              launch_replacement,
              "launchJpegExport",
          )

          result_replacement = '''        if (requestCode == REQUEST_SAVE_JPEG) {
              val binding = pendingJpegBinding
              pendingJpegBinding = null
              pendingJpegJobId = null
              val destination = data?.data
              if (resultCode != RESULT_OK || destination == null) {
                  jpegStatus = "JPG-export geannuleerd."
                  render()
                  return
              }
              if (binding == null) {
                  jpegStatus = "JPG-output geblokkeerd: bevroren outputbinding ontbreekt."
                  render()
                  return
              }

              val expectedJob = binding.sourceJobId
              val job = session.jobs.firstOrNull { it.id == expectedJob }
              if (job == null) {
                  jpegStatus = "JPG-output geblokkeerd: actieve bron ontbreekt."
                  render()
                  return
              }

              val currentRoute = preferredRoute()
              val currentFlags = photoFlagsForRoute(currentRoute)
              val currentQuarterTurns =
                  TruthRawOrientationOverride.quarterTurns(this, job.source)
              val validationError =
                  DrawPhotoOutputCableV01.validateCurrentOutputContext(
                      binding = binding,
                      job = job,
                      activeJobId = activeJobId,
                      currentRoute = currentRoute,
                      currentRouteFlags = currentFlags,
                      currentQuarterTurns = currentQuarterTurns,
                  )
              if (validationError != null) {
                  jpegStatus = validationError
                  render()
                  return
              }

              val route = binding.route
              val flags = binding.routeFlags
              val quarterTurns = binding.userQuarterTurns
              val operationKey = backgroundOperationKey("jpeg", expectedJob)'''.replace("              ", "")
          regex_once(
              r'        if \(requestCode == REQUEST_SAVE_JPEG\) \{.*?            val operationKey = backgroundOperationKey\("jpeg", expectedJob\)',
              result_replacement,
              "JPEG onActivityResult preamble",
          )

          replace_once(
              "        empiricalAudit = null\n        jpegStatus = null\n        fullColourMasterStatus = null",
              "        empiricalAudit = null\n        pendingJpegJobId = null\n        pendingJpegBinding = null\n        jpegStatus = null\n        fullColourMasterStatus = null",
              "internal camera stale JPEG clear",
          )
          replace_once(
              "        pendingJpegJobId = null\n        pendingFullColourMasterJobId = null",
              "        pendingJpegJobId = null\n        pendingJpegBinding = null\n        pendingFullColourMasterJobId = null",
              "source switch stale JPEG clear",
          )
          replace_once(
              "        pendingJpegJobId = null\n        pendingPureFloatDngJobId = null\n        pendingLinearDngJobId = null",
              "        pendingJpegJobId = null\n        pendingJpegBinding = null\n        pendingPureFloatDngJobId = null\n        pendingLinearDngJobId = null",
              "reprocess stale JPEG clear",
          )

          ui_anchor = (
              "        addView(universalIntakePane(active))\n"
              "        addView(space(8))\n\n"
              "        when (val state = previewState) {"
          )
          ui_insert = '''        addView(universalIntakePane(active))
          addView(space(8))

          if (
              active.source.format.nativeProcessingReady &&
              active.source.format.id == "DNG"
          ) {
              val outputRoute = preferredRoute()
              val jpegActionLabel = when (outputRoute) {
                  TruthRawSuiteLauncherActivity.OUTPUT_ADVANCED ->
                      "JPG · full resolution"
                  TruthRawSuiteLauncherActivity.OUTPUT_PRO ->
                      "JPG · full resolution professional"
                  else ->
                      "JPG · full resolution compatibility"
              }
              addView(label("Output / Vrije Raster", 13f, bold = true))
              addView(actionButton(jpegActionLabel) {
                  launchJpegExport(active)
              })
              jpegStatus?.let { status ->
                  backgroundOperationStatusView(
                      backgroundOperationKey("jpeg", active.id),
                      status,
                  )?.let(::addView) ?: addView(
                      label(status, 10f, muted = true),
                  )
              }
              addView(label(
                  "Preview-onafhankelijke full-resolution output · de UI-preview is een zustertak, " +
                      "geen pixelbron of authority. Source mutation=false · Scientific Master writeback=false.",
                  10f,
                  muted = true,
              ))
              addView(space(8))
          }

          when (val state = previewState) {'''.replace("          ", "")
          replace_once(ui_anchor, ui_insert, "preview-independent JPEG action")

          # Remove the old Ready-only duplicates. The single output action above
          # now owns JPEG launch/status for PURE, ADVANCED and PRO.
          for old, label in [
              ('''                        addView(space(7))
                        addView(actionButton("JPG · full resolution compatibility") {
                            launchJpegExport(active)
                        })
                        jpegStatus?.let { status ->
                            backgroundOperationStatusView(
                                backgroundOperationKey("jpeg", active.id),
                                status,
                            )?.let(::addView) ?: addView(label(status, 10f, muted = true))
                        }
''', "PURE Ready JPEG duplicate"),
              ('''                        addView(actionButton("JPG · full resolution") { launchJpegExport(active) })
                        jpegStatus?.let { status ->
                            backgroundOperationStatusView(
                                backgroundOperationKey("jpeg", active.id),
                                status,
                            )?.let(::addView) ?: addView(label(status, 10f, muted = true))
                        }
''', "ADVANCED Ready JPEG duplicate"),
              ('''                        addView(actionButton("JPG · full resolution professional") {
                            launchJpegExport(active)
                        })
                        jpegStatus?.let { status ->
                            backgroundOperationStatusView(
                                backgroundOperationKey("jpeg", active.id),
                                status,
                            )?.let(::addView) ?: addView(label(status, 10f, muted = true))
                        }
''', "PRO Ready JPEG duplicate"),
          ]:
              replace_once(old, "", label)

          path.write_text(s)
          PY

          git diff --check
          grep -F 'pendingJpegBinding: DrawPhotoOutputBindingV01?' suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt
          grep -F 'DrawPhotoOutputCableV01.bindFullResolutionJpeg' suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt
          grep -F 'DrawPhotoOutputCableV01.validateCurrentOutputContext' suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt
          grep -F 'Preview-onafhankelijke full-resolution output' suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt
          test "$(grep -F -c 'JPG · full resolution compatibility' suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt)" -eq 1
          test "$(grep -F -c 'JPG · full resolution professional' suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt)" -eq 1
          git diff -- suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt

      - name: Commit runtime wiring and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "D.RAW CI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/draw_one_shot_jpeg_cable_patch.yml
          git add suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt
          git commit -m "Android: decouple full-resolution JPEG from UI preview"
          git push origin HEAD:feat/draw-workspace-free-raster-v01
