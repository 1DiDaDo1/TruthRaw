name: 44489 LinearizationTable v0.1 Refresh

on:
  push:
    paths:
      - 'tools/update_44489_linearization_table_v01.py'
      - '.github/workflows/update-44489-linearization-table-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-capsule:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-capability-linearization-table-shadow-v01
          fetch-depth: 0

      - name: Update canonical 44489 capsule
        run: python3 tools/update_44489_linearization_table_v01.py

      - name: Commit capsule only when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/handoff/DRAW_44489_KNOWLEDGE_CAPSULE.md; then
            echo 'Capsule already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/handoff/DRAW_44489_KNOWLEDGE_CAPSULE.md
          git commit -m 'docs: record LinearizationTable standalone validated checkpoint'
          git push origin HEAD:feat/source-capability-linearization-table-shadow-v01
