name: TruthRaw v0.48 Target37 RAW14 Retarget Control

on:
  push:
    branches:
      - integration/truthraw-suite-v0-48-target37-raw14-retarget-control
    paths:
      - 'suite_android/app/build.gradle.kts'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/Api37Raw14ExtensionOracleActivity.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/TruthRawSuiteLauncherActivity.kt'
      - 'docs/HONOR_V048_TARGET37_RAW14_RETARGET_CONTROL_PLAN_2026-09-19.md'
      - 'state/HONOR_V048_TARGET37_RAW14_RETARGET_CONTROL_PLAN_2026-09-19.json'
      - '.github/workflows/android-truthraw-suite-v0-48-target37-raw14-retarget-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v048:
    name: Build v0.48 targetSdk37 RAW14 retarget control
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify v0.48 controlled change
        run: |
          GRADLE='suite_android/app/build.gradle.kts'
          ACT='suite_android/app/src/main/java/com/truthraw/adaptiveui/Api37Raw14ExtensionOracleActivity.kt'
          PLAN='state/HONOR_V048_TARGET37_RAW14_RETARGET_CONTROL_PLAN_2026-09-19.json'

          grep -F 'compileSdk = 35' "$GRADLE"
          grep -F 'targetSdk = 37' "$GRADLE"
          grep -F 'versionName = "0.17-v0.48-target37-raw14-retarget-control"' "$GRADLE"
          grep -F 'truthraw.api37-raw14-extension-oracle.v0.47' "$ACT"
          grep -F 'ImageFormat::class.java.getField("RAW14")' "$ACT"
          grep -F '"targetSdkTo": 37' "$PLAN"

          python3 - <<'PY'
          from pathlib import Path
          s=Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/Api37Raw14ExtensionOracleActivity.kt').read_text()

          required=[
            'cameraOpenedByTruthRaw", false',
            'captureSubmittedByTruthRaw", false',
            'extensionSessionCreatedByTruthRaw", false',
            'getCameraCharacteristics(',
            'getField("RAW14")',
            'getHighResolutionOutputSizes(',
            'getCameraExtensionCharacteristics',
          ]
          for token in required:
              assert token in s, token

          forbidden=[
            'openCamera(',
            'createCaptureRequest',
            'import android.media.ImageReader',
            'createExtensionSession',
            'setPhysicalCameraKey',
            'bindService(',
          ]
          for token in forbidden:
              assert token not in s, token

          print('v0.48 target37 retarget-control invariants PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-v0-48-target37-raw14-retarget-control-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error