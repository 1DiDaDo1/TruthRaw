name: TruthRaw v0.58 Android NEF Sample Adapter

on:
  push:
    branches:
      - integration/truthraw-suite-v0-58-nef-uncompressed-sample-adapter
    paths:
      - 'suite_android/**'
      - 'docs/research/multivendor-raw-source-adapter-v0.1/**'
      - '.github/workflows/android-truthraw-suite-v0-58-nef-sample-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v058:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify NEF app claim boundary
        run: |
          REG='suite_android/app/src/main/java/com/truthraw/adaptiveui/RawFormatRegistry.kt'
          CMAKE='suite_android/app/src/main/cpp/CMakeLists.txt'
          grep -F 'NATIVE_SAMPLE_DECODE_CALIBRATION_PENDING' "$REG"
          grep -F 'NIKON_NEF_UNCOMPRESSED16_CFA_V0_1' "$REG"
          grep -F 'nikon_nef_uncompressed_adapter_v0_1.cpp' "$CMAKE"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK and NDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F "classes.dex"
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"
      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-v0-58-nef-uncompressed-sample-adapter-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
