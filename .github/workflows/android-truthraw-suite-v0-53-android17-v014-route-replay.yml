name: TruthRaw v0.53 Android17 V014 Route Replay

on:
  push:
    branches:
      - integration/truthraw-suite-v0-53-android17-v014-route-replay
    paths:
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/Android17Camera5PayloadDeltaActivity.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/TruthRawSuiteLauncherActivity.kt'
      - 'docs/HONOR_V053_ANDROID17_V014_ROUTE_REPLAY_PLAN_2026-09-19.md'
      - 'state/HONOR_V053_ANDROID17_V014_ROUTE_REPLAY_PLAN_2026-09-19.json'
      - '.github/workflows/android-truthraw-suite-v0-53-android17-v014-route-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v053:
    name: Build v0.53 Android17 v0.14 route replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify historical v0.14 route invariants
        run: |
          CAP='suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt'
          DELTA='suite_android/app/src/main/java/com/truthraw/adaptiveui/Android17Camera5PayloadDeltaActivity.kt'
          PLAN='state/HONOR_V053_ANDROID17_V014_ROUTE_REPLAY_PLAN_2026-09-19.json'

          grep -F 'v0.53 Android-17 replay' "$CAP"
          grep -F 'globalSensorPixelModeIntentionallySuppressedByV014Replay' "$CAP"
          grep -F 'requestBuilder.setPhysicalCameraKey(' "$CAP"
          grep -F 'requestBuilder.getPhysicalCameraKey(' "$CAP"
          grep -F 'RAW SOURCE-FIRST SEALED' "$CAP"
          grep -F 'captureResultSensorPixelModeIsAdvisoryAfterSeal' "$CAP"
          grep -F 'af3ad73e5919b816881a661f00ffd84a7b537f23198a5877c242717c5d7526de' "$CAP"
          grep -F '_CAM5_200MP_EVIDENCE_v053.json' "$DELTA"
          grep -F '"globalSensorPixelModeWriteForbidden": true' "$PLAN"

          python3 - <<'PY'
          from pathlib import Path
          s=Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt').read_text()

          # Global SENSOR_PIXEL_MODE must not be written anywhere in the still path.
          assert 'requestBuilder.set(CaptureRequest.SENSOR_PIXEL_MODE' not in s
          assert 'globalSensorPixelModeWritten", false' in s

          # Physical write is attempted directly, not conditioned on advertisement.
          assert 'requestBuilder.setPhysicalCameraKey(' in s
          assert 'lastPhysicalOverrideAdvertised = physicalOverrideSupported' in s

          # Seal must occur before returned result pixel mode is interpreted.
          seal=s.index('val rawEvidence = persistOriginalRawBuffer(image, stamp)')
          returned=s.index('val returnedPixelMode = physicalResult.get(CaptureResult.SENSOR_PIXEL_MODE)')
          assert seal < returned

          # Old destructive result-mode gate must be absent.
          assert 'physical5 SENSOR_PIXEL_MODE=$pixelMode, MAXIMUM_RESOLUTION vereist' not in s

          print('v0.53 historical v0.14 route invariants PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-v0-53-android17-v014-route-replay-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
