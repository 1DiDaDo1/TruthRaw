name: D.RAW Universal Physical Capture v0.1

on:
  push:
    branches:
      - integration/draw-universal-physical-capture-v01-2026-09-28
    paths:
      - 'suite_android/**'
      - '.github/workflows/draw-universal-physical-capture-v01.yml'
  pull_request:
    paths:
      - 'suite_android/**'
      - '.github/workflows/draw-universal-physical-capture-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify universal capture contract
        run: |
          set -euo pipefail
          JAVA='suite_android/app/src/main/java/com/truthraw/adaptiveui'
          CAPTURE="$JAVA/UniversalPhysicalCaptureActivity.kt"
          LAUNCHER="$JAVA/TruthRawSuiteLauncherActivity.kt"

          grep -F 'class UniversalPhysicalCaptureActivity' "$CAPTURE"
          grep -F 'SEALED_DNG_TO_SAME_UNIVERSAL_SOURCE_INTAKE_AS_IMPORTED_RAW' "$CAPTURE"
          grep -F 'transport_backend_is_scientific_truth", false' "$CAPTURE"
          grep -F 'device_map_required", false' "$CAPTURE"
          grep -F 'uses_ai_or_learned_model", false' "$CAPTURE"
          grep -F 'UI_FOCAL_ORDER_HINT_ONLY' "$CAPTURE"
          grep -F 'UniversalPhysicalCaptureActivity::class.java' "$LAUNCHER"
          grep -F 'FotoGraaf200MpStagedActivity::class.java' "$CAPTURE"
          grep -F 'D.RAWnegative 200MP · Float32 Full Colour · DNG' "$JAVA/MainActivity.kt"

          if grep -E 'com\.hihonor\.|professionalTeleRawLogicalCameraID|System ID|cameraId == "[245]"|cameraId = "[245]"' "$CAPTURE"; then
            echo 'Fixed vendor/device lens mapping detected in universal capture adapter' >&2
            exit 1
          fi

          if grep -R -E 'org.tensorflow|tensorflow-lite|onnxruntime|pytorch|mlkit|com.google.mlkit' "$CAPTURE"; then
            echo 'AI/ML dependency detected in universal capture adapter' >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble full D.RAW arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK keeps D.RAW branding and native science
        run: |
          set -euo pipefail
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'draw_icon'
          unzip -l "$APK" | grep -F 'draw_opening_banner'
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_PureFloat32DngNativeBridge_exportPureFloat32Dng'
          sha256sum "$APK" | tee "$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: DRAW_Universal_Physical_Capture_v0.1_debug_arm64
          path: |
            suite_android/app/build/outputs/apk/debug/app-debug.apk
            suite_android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
