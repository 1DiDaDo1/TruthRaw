name: Linear DNG Projection v0.1

on:
  push:
    branches:
      - 'research/linear-dng-projection-v0.1-*'
    paths:
      - 'docs/research/linear-dng-projection-v0.1/**'
      - '.github/workflows/linear-dng-projection-v0.1.yml'
  pull_request:
    paths:
      - 'docs/research/linear-dng-projection-v0.1/**'
      - '.github/workflows/linear-dng-projection-v0.1.yml'

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            cxx: g++
            build_type: Release
            sanitizers: 'OFF'
          - name: Clang Release
            cxx: clang++
            build_type: Release
            sanitizers: 'OFF'
          - name: Clang ASan-UBSan
            cxx: clang++
            build_type: Debug
            sanitizers: 'ON'
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S docs/research/linear-dng-projection-v0.1
          -B build/linear-dng-projection-v0.1
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DTRUTHRAW_LDNG01_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build/linear-dng-projection-v0.1 --parallel 2
      - name: Test
        run: ctest --test-dir build/linear-dng-projection-v0.1 --output-on-failure
