name: Universal Multi-Observation Relation v0.1 Integrity

on:
  pull_request:
    paths:
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/UniversalMultiObservationRelationProtocolV01.kt'
      - 'docs/research/universal-multi-observation-relation-v0.1/**'
      - 'state/UNIVERSAL_MULTI_OBSERVATION_RELATION_PROTOCOL_STATE_2026-09-30.json'
      - 'tools/check_universal_multi_observation_relation_v01.py'
      - '.github/workflows/universal-multi-observation-relation-v01.yml'
  push:
    branches:
      - 'research/universal-multi-observation-relation-v01-2026-09-30'

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_universal_multi_observation_relation_v01.py
