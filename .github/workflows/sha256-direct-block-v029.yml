name: SHA-256 Direct Block v0.2.9 Integrity

on:
  pull_request:
    paths:
      - 'suite_android/app/src/main/cpp/truthraw_sha256_v0_69.h'
      - 'suite_android/app/src/main/cpp/truthraw_sha256_v0_69.cpp'
      - 'docs/research/sha256-direct-block-v0.1/**'
      - 'docs/research/truthnegative-continuous-v0.5/**'
      - 'docs/research/truthnegative-authority-field-fusion-v0.1/**'
      - 'suite_android/app/src/main/cpp/truthnegative_pipeline_bridge_common.h'
      - 'suite_android/app/src/main/cpp/truthnegative_pipeline_bridge_common.cpp'
      - 'suite_android/app/src/main/cpp/truthnegative_n2_factored_confidence_bridge.cpp'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/N2LocalSpatialBindingAudit.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/ResearchPerformanceDiagnosticsV01.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/UniversalSourceProfiler.kt'
      - 'tools/check_sha256_direct_block_v029.py'
      - '.github/workflows/sha256-direct-block-v029.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: SHA-256 known vectors and chunk parity
        run: |
          cmake -S docs/research/sha256-direct-block-v0.1 -B build/sha_direct -DCMAKE_BUILD_TYPE=Release
          cmake --build build/sha_direct --config Release -j2
          ctest --test-dir build/sha_direct --output-on-failure
      - name: Authority SHA and count parity
        run: |
          cmake -S docs/research/truthnegative-continuous-v0.5 -B build/tn_continuous -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tn_continuous --config Release -j2
          ctest --test-dir build/tn_continuous --output-on-failure
      - name: Scientific Master and replay parity
        run: |
          cmake -S docs/research/truthnegative-authority-field-fusion-v0.1 -B build/authority_fusion -DCMAKE_BUILD_TYPE=Release
          cmake --build build/authority_fusion --config Release -j2
          ctest --test-dir build/authority_fusion --output-on-failure
      - name: Verify SHA transport remains authority-neutral
        run: python3 tools/check_sha256_direct_block_v029.py
