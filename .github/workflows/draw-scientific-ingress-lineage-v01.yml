name: D.RAW Scientific Ingress Lineage v0.1

on:
  pull_request:
    paths:
      - 'docs/research/draw-scientific-ingress-lineage-v0.1/**'
      - 'tools/validate_draw_scientific_ingress_lineage_v01.py'
      - '.github/workflows/draw-scientific-ingress-lineage-v01.yml'
  push:
    branches: [main]
    paths:
      - 'docs/research/draw-scientific-ingress-lineage-v0.1/**'
      - 'tools/validate_draw_scientific_ingress_lineage_v01.py'
      - '.github/workflows/draw-scientific-ingress-lineage-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate real main-camera ingress lineage
        run: |
          set -euo pipefail
          python3 tools/validate_draw_scientific_ingress_lineage_v01.py \
            docs/research/draw-source-pre-admission-v0.2/evidence/MAIN_CAMERA_C2OBS_20260914_174825_895_PRE_ADMISSION_v0_2.json \
            docs/research/draw-dng-orientation-quarantine-v0.1/evidence/MAIN_CAMERA_ORIENTATION_QUARANTINE_v0_1.json \
            docs/research/draw-dng-orientation-quarantine-v0.1/evidence/MAIN_CAMERA_HOST_SCIENTIFIC_ROUTE_v0_1.json \
            docs/research/draw-scientific-ingress-lineage-v0.1/evidence/MAIN_CAMERA_SCIENTIFIC_INGRESS_LINEAGE_v0_1.json

      - name: Prove physical and pipeline identities cannot collapse
        run: |
          set -euo pipefail
          BASE=docs/research/draw-scientific-ingress-lineage-v0.1/evidence/MAIN_CAMERA_SCIENTIFIC_INGRESS_LINEAGE_v0_1.json
          python3 - <<'PY'
          import hashlib,json
          base=json.load(open('docs/research/draw-scientific-ingress-lineage-v0.1/evidence/MAIN_CAMERA_SCIENTIFIC_INGRESS_LINEAGE_v0_1.json'))
          def save(name, mutate):
              j=json.loads(json.dumps(base)); mutate(j)
              x=dict(j); x.pop('binding_state_sha256',None)
              j['binding_state_sha256']=hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
              json.dump(j,open('/tmp/'+name,'w'))
          save('bad-physical-id.json', lambda j:j['physical_observation'].__setitem__('physical_observation_id',j['pipeline_lineage']['pipeline_observation_id']))
          save('bad-new-observation.json', lambda j:j['identity_policy'].__setitem__('derived_ingress_is_new_observation',True))
          save('bad-extra-evidence.json', lambda j:j['invariants'].__setitem__('independent_evidence_count_increment',1))
          save('bad-payload.json', lambda j:j['ingress_derivation'].__setitem__('serialized_cfa_payload_sha256','0'*64))
          save('bad-fusion.json', lambda j:j['invariants'].__setitem__('cross_observation_fusion_granted',True))
          PY
          for f in /tmp/bad-physical-id.json /tmp/bad-new-observation.json /tmp/bad-extra-evidence.json /tmp/bad-payload.json /tmp/bad-fusion.json; do
            if python3 tools/validate_draw_scientific_ingress_lineage_v01.py \
                docs/research/draw-source-pre-admission-v0.2/evidence/MAIN_CAMERA_C2OBS_20260914_174825_895_PRE_ADMISSION_v0_2.json \
                docs/research/draw-dng-orientation-quarantine-v0.1/evidence/MAIN_CAMERA_ORIENTATION_QUARANTINE_v0_1.json \
                docs/research/draw-dng-orientation-quarantine-v0.1/evidence/MAIN_CAMERA_HOST_SCIENTIFIC_ROUTE_v0_1.json "$f"; then
              echo "::error::invalid lineage accepted: $f"
              exit 1
            fi
          done
