name: TruthRaw Camera5 8160x6144 runtime result inventory v0.57

on:
  workflow_dispatch:
  push:
    branches: [test/cam5-runtime-result-inventory-v057]
    paths:
      - 'tools/patch_fotograaf_v056_cam5_8160x6144_raw_probe.py'
      - '.github/workflows/android-truthraw-cam5-8160x6144-v056.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated 8160x6144 v0.57 result-inventory patch
        run: |
          python3 tools/patch_fotograaf_v056_cam5_8160x6144_raw_probe.py
          grep -F 'private const val TARGET_W = 8160' suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt
          grep -F 'private const val TARGET_H = 6144' suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt
          grep -F 'private const val TARGET_SAMPLES = 50_135_040L' suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt
          grep -F 'physicalFrameCount", 1' suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt
          grep -F 'independentEvidenceCount", 1' suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt
          grep -F 'calibrationAuthorityGranted", false' suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt\n          grep -F 'truthraw.camera5-runtime-result-inventory.v0.57' suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt\n          grep -F 'vendorRequestWrittenByV057", false' suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          set -euo pipefail
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"
      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-cam5-8160x6144-v057-result-inventory-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
