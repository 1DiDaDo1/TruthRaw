name: TruthRaw FotoGraaf v0.37 Physical-only inSensorZoomEnable BYTE(1)

# v0.36 resolved physical-only candidate H:
# inSensorZoomEnable -> BYTE, tag 0x801F0029.
# v0.37 first tests attachment feasibility. Only a successful attach allows the
# unchanged v0.20 source-first capture chain to proceed.
on:
  push:
    branches:
      - integration/truthraw-suite-v0-37-physical-insensorzoom-byte-one
    paths:
      - 'suite_android/**'
      - 'tools/patch_fotograaf_v012_forced_physical_max.py'
      - 'tools/patch_fotograaf_v013_physical_only_max_submit.py'
      - 'tools/patch_fotograaf_v014_seal_raw_before_result_mode_gate.py'
      - 'tools/patch_fotograaf_v016_hal_buffer_envelope.py'
      - 'tools/patch_fotograaf_v017_pre_hal_airlock.py'
      - 'tools/patch_fotograaf_v019_full_raster_write_audit.py'
      - 'tools/patch_fotograaf_v020_payload_geometry_decoder.py'
      - 'tools/patch_fotograaf_v037_physical_insensorzoom_byte_one.py'
      - '.github/workflows/android-truthraw-suite-v0-37-physical-insensorzoom-byte-one.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v037:
    name: Build FotoGraaf v0.37 physical-only BYTE(1) arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v0.20 and apply one fail-closed physical-only BYTE stimulus
        run: |
          python3 tools/patch_fotograaf_v037_physical_insensorzoom_byte_one.py
          APP='suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt'
          PROBE='suite_android/app/src/main/java/com/truthraw/adaptiveui/Camera2PhysicalInSensorZoomByteSessionProbe.kt'
          PRE='suite_android/app/src/main/java/com/truthraw/adaptiveui/Camera2PreHalGate.kt'
          POST='suite_android/app/src/main/java/com/truthraw/adaptiveui/Camera2EnvelopeProbe.kt'
          AUDIT='suite_android/app/src/main/java/com/truthraw/adaptiveui/RawSensorRasterAudit.kt'
          GEOM='suite_android/app/src/main/java/com/truthraw/adaptiveui/RawPayloadGeometryDecoder.kt'
          NATIVE='suite_android/app/src/main/cpp/hardware_buffer_envelope_probe.cpp'

          grep -F 'TruthRaw · 200MP Tele Test v0.37 · physical-only inSensorZoomEnable BYTE(1)' "$APP"
          grep -F 'Camera2PreHalGate.observeSession(' "$APP"
          grep -F 'Camera2PhysicalInSensorZoomByteSessionProbe.applyExperiment(' "$APP"
          grep -F 'TRUTHRAW_CAM5_V037_ATTACHMENT_RESULT.json' "$APP"
          grep -F 'controlledVendorInterventionKeyCount' "$APP"
          grep -F 'otherV036CandidatesWritten' "$APP"
          grep -F 'persistOriginalRawBuffer(image, stamp)' "$APP"
          grep -F 'Camera2EnvelopeProbe.observe(image, physical, physicalResult)' "$APP"
          grep -F 'RawSensorRasterAudit.audit(' "$APP"
          grep -F 'RawPayloadGeometryDecoder.decode(' "$APP"

          grep -F 'org.codeaurora.qcamera3.sessionParameters.inSensorZoomEnable' "$PROBE"
          grep -F '0x801F0029' "$PROBE"
          grep -F 'RESOLVED_NATIVE_TYPE = "BYTE"' "$PROBE"
          grep -F 'physicalOnlyAvailabilityTopologyPass' "$PROBE"
          grep -F 'CaptureRequest.Key(KEY_NAME, Byte::class.javaObjectType)' "$PROBE"
          grep -F 'builder.set(key, 1.toByte())' "$PROBE"
          grep -F 'config.setSessionParameters(request)' "$PROBE"
          grep -F 'V037_PHYSICAL_ONLY_BYTE_REQUEST_VALID__SESSION_ATTACHMENT_REJECTED__NO_CAPTURE' "$PROBE"
          grep -F 'captureAllowedOnlyAfterAttachmentPass' "$PROBE"
          grep -F 'selectionUsesVendorNameSemantics", false' "$PROBE"
          grep -F 'semanticMeaningAssumed", false' "$PROBE"

          ! grep -F 'EnableVSR' "$PROBE"
          ! grep -F 'ExtendedMaxZoom' "$PROBE"
          ! grep -F 'enableQLL' "$PROBE"
          ! grep -F 'EnableInsensorZoom' "$PROBE"
          ! grep -F 'EnableSnapshotOnlyInsensorZoom' "$PROBE"
          ! grep -F 'EnableMCXMasterCb' "$PROBE"
          ! grep -F 'RawCbSourceType' "$PROBE"
          ! grep -F 'EnableXCFAOptimization' "$PROBE"
          ! grep -F 'EnableIdealRAW' "$PROBE"
          ! grep -F 'HALOutputBufferCombined' "$PROBE"

          grep -F 'vendorKeysWritten", false' "$PRE"
          grep -F 'hardwareBufferLocked' "$POST"
          grep -F 'ONLY_FIRST_768_ROWS_NONZERO__EXACT_12P5MP_BYTE_PAYLOAD_SIGNATURE' "$AUDIT"
          grep -F 'EXACT_PAYLOAD_BYTE_COUNT_MATCH_TO_SINGLE_ADVERTISED_STANDARD_RAW_SENSOR_SIZE' "$GEOM"
          grep -F 'AHardwareBuffer_describe' "$NATIVE"
          ! grep -F 'AHardwareBuffer_lock(' "$NATIVE"
          ! grep -F 'AHardwareBuffer_lockAndGetInfo(' "$NATIVE"
          ! grep -F 'MAXIMUM_RESOLUTION vereist' "$APP"

          python3 - <<'PY'
          from pathlib import Path
          s = Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt').read_text()
          p = Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/Camera2PhysicalInSensorZoomByteSessionProbe.kt').read_text()

          assert s.index('Camera2PreHalGate.observeSession(') < s.index('Camera2PhysicalInSensorZoomByteSessionProbe.applyExperiment(')
          assert s.index('Camera2PhysicalInSensorZoomByteSessionProbe.applyExperiment(') < s.index('device.isSessionConfigurationSupported(config)')
          assert s.index('persistOriginalRawBuffer(image, stamp)') < s.index('Camera2EnvelopeProbe.observe(image, physical, physicalResult)')
          assert s.index('RawSensorRasterAudit.audit(') < s.index('RawPayloadGeometryDecoder.decode(')
          assert s.count('Camera2PhysicalInSensorZoomByteSessionProbe.applyExperiment(') == 1
          assert p.count('builder.set(key, 1.toByte())') == 1
          assert p.count('config.setSessionParameters(request)') == 1
          assert 'logicalSessionAdvertised' in p
          assert 'physicalSessionAdvertised' in p
          assert 'physicalOverrideAdvertised' in p
          assert 'capturePermitted", false' in p
          assert 'otherV036CandidatesWritten", false' in p
          print('v0.37 source-first + fail-closed attachment feasibility invariants PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package and native bridge
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          test -s /tmp/libtruthraw_ui_preview_bridge.so
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/libtruthraw_ui_preview_bridge.so'; then
            echo 'Unexpected non-arm64 TruthRaw native ABI' >&2
            exit 1
          fi
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-main-plus-fotograaf-v0-37-physical-insensorzoom-byte-one-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
