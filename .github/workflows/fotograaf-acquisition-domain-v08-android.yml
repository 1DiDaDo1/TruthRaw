name: FotoGraaf acquisition-domain v0.8 Android

on:
  push:
    branches:
      - research/fotograaf-domain-v08
    paths:
      - 'capture/android/fotograaf-acquisition-domain-v08/**'
      - '.github/workflows/fotograaf-acquisition-domain-v08-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle --no-daemon -p capture/android/fotograaf-acquisition-domain-v08 :app:assembleDebug

      - name: SHA-256
        run: sha256sum capture/android/fotograaf-acquisition-domain-v08/app/build/outputs/apk/debug/app-debug.apk | tee capture/android/fotograaf-acquisition-domain-v08/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TruthRaw_FotoGraaf_AcquisitionDomain_v0.8_debug
          path: |
            capture/android/fotograaf-acquisition-domain-v08/app/build/outputs/apk/debug/app-debug.apk
            capture/android/fotograaf-acquisition-domain-v08/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
