name: 44489 Final Governance Repair Cleanup

on:
  push:
    branches:
      - feat/draw-observation-evidence-architecture-v01
    paths:
      - '.github/workflows/finalize-44489-governance-repair-v01.yml'
      - 'tools/finalize_44489_governance_repair_v01.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/draw-observation-evidence-architecture-v01
          fetch-depth: 0

      - name: Finalize canonical 44489 post-audit state
        run: python3 tools/finalize_44489_governance_repair_v01.py

      - name: Verify final capsule and stage self-cleanup
        run: |
          set -euo pipefail
          FILE='docs/handoff/DRAW_44489_KNOWLEDGE_CAPSULE.md'
          grep -F '7e176006c8e4e7be379ce8a613a695ef750900b1' "$FILE"
          grep -F 'closed superseded/unmerged' "$FILE"
          grep -F 'temporary governance-refresh tooling has been removed' "$FILE"
          grep -F 'runtime-envelope exposure is the next narrow scientific diagnostic and is not yet implemented' "$FILE"
          git diff --check
          git rm .github/workflows/finalize-44489-governance-repair-v01.yml
          git rm tools/finalize_44489_governance_repair_v01.py

      - name: Commit final governance capsule state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/handoff/DRAW_44489_KNOWLEDGE_CAPSULE.md
          git diff --cached --check
          git commit -m 'Finalize 44489 post-audit governance repair'
          git push origin HEAD:feat/draw-observation-evidence-architecture-v01
