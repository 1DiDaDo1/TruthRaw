name: D.RAW Suite Universal Intake v0.1

on:
  push:
    branches:
      - integration/draw-suite-universal-intake-frontside-v01-2026-09-28
    paths:
      - 'suite_android/**'
      - '.github/workflows/draw-suite-universal-intake-v01.yml'
  pull_request:
    paths:
      - 'suite_android/**'
      - '.github/workflows/draw-suite-universal-intake-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify D.RAW vision contract
        run: |
          set -euo pipefail
          JAVA='suite_android/app/src/main/java/com/truthraw/adaptiveui'
          grep -F 'object UniversalSourceProfiler' "$JAVA/UniversalSourceProfiler.kt"
          grep -F 'object FrontsideSceneInspector' "$JAVA/FrontsideSceneInspector.kt"
          grep -F 'ai_or_learned_scene_models_allowed", false' "$JAVA/UniversalSourceProfiler.kt"
          grep -F 'deterministische, inspecteerbare computer vision; geen AI/ML' "$JAVA/MainActivity.kt"
          if grep -R -E 'org.tensorflow|tensorflow-lite|onnxruntime|pytorch|mlkit|com.google.mlkit' "$JAVA"; then
            echo 'AI/ML runtime dependency or import detected in D.RAW product Java/Kotlin source' >&2
            exit 1
          fi
          grep -F 'scientific_writeback_allowed", false' "$JAVA/FrontsideSceneInspector.kt"
          grep -F 'Universele ingang · achterkant + voorkant' "$JAVA/MainActivity.kt"
          grep -F 'ResearchEdgeAwareMeasuredPreservingReconstructionF64' suite_android/app/src/main/cpp/pure_float32_dng_export_bridge.cpp
          grep -F 'three-channel IEEE Float32 LinearRaw primary' suite_android/app/src/main/cpp/pure_float32_dng_export_bridge.cpp

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Materialize stable D.RAW development signing identity
        env:
          DRAW_DEBUG_KEYSTORE_B64: ${{ secrets.DRAW_DEBUG_KEYSTORE_B64 }}
          DRAW_DEBUG_STORE_PASSWORD: ${{ secrets.DRAW_DEBUG_STORE_PASSWORD }}
          DRAW_DEBUG_KEY_ALIAS: ${{ secrets.DRAW_DEBUG_KEY_ALIAS }}
          DRAW_DEBUG_KEY_PASSWORD: ${{ secrets.DRAW_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DRAW_DEBUG_KEYSTORE_B64" || { echo "::error::D.RAW signing slot A missing: keystore Base64 payload"; exit 1; }
          test -n "$DRAW_DEBUG_STORE_PASSWORD" || { echo "::error::D.RAW signing slot B missing: keystore password"; exit 1; }
          test -n "$DRAW_DEBUG_KEY_ALIAS" || { echo "::error::D.RAW signing slot C missing: key alias"; exit 1; }
          test -n "$DRAW_DEBUG_KEY_PASSWORD" || { echo "::error::D.RAW signing slot D missing: key password"; exit 1; }
          printf '%s' "$DRAW_DEBUG_KEYSTORE_B64" | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/draw-debug.jks"
          test -s "$RUNNER_TEMP/draw-debug.jks"
          ACTUAL_KEYSTORE_SHA256=$(sha256sum "$RUNNER_TEMP/draw-debug.jks" | awk '{print $1}')
          test "$ACTUAL_KEYSTORE_SHA256" = "eaddcb4abdab1353a5cd15d71d52ea373abbabc46459ed7f2c8c08acf15d1137"
          keytool -list -keystore "$RUNNER_TEMP/draw-debug.jks" -storepass "$DRAW_DEBUG_STORE_PASSWORD" -alias "$DRAW_DEBUG_KEY_ALIAS" >/dev/null


      - name: Assemble full D.RAW arm64 debug APK
        working-directory: suite_android
        env:
          DRAW_SIGNING_STORE_FILE: ${{ runner.temp }}/draw-debug.jks
          DRAW_SIGNING_STORE_PASSWORD: ${{ secrets.DRAW_DEBUG_STORE_PASSWORD }}
          DRAW_SIGNING_KEY_ALIAS: ${{ secrets.DRAW_DEBUG_KEY_ALIAS }}
          DRAW_SIGNING_KEY_PASSWORD: ${{ secrets.DRAW_DEBUG_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify D.RAW APK
        run: |
          set -euo pipefail
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'draw_icon'
          unzip -l "$APK" | grep -F 'draw_opening_banner'
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_PureFloat32DngNativeBridge_exportPureFloat32Dng'
          sha256sum "$APK" | tee "$APK.sha256"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          echo "apk_signing_cert_sha256=$CERT_SHA256"
          test "$CERT_SHA256" = "a6288a4b7e9d18e908eeba37540cd962b687f2290f7e45d7c7ad3390ad61fd44"

      - uses: actions/upload-artifact@v4
        with:
          name: DRAW_Full_Suite_Universal_Intake_v0.1_debug_arm64
          path: |
            suite_android/app/build/outputs/apk/debug/app-debug.apk
            suite_android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
