name: D.RAW TruthNegative Continuous v0.5

on:
  push:
    branches:
      - integration/truthraw-suite-v0-84-3-float32-full-colour-scientific-master
    paths:
      - 'docs/research/truthnegative-continuous-v0.5/**'
      - 'docs/research/free-world-pixel-resolve-2d-v0.2/**'
      - 'suite_android/app/src/main/cpp/open_scene_field_v0_85.*'
      - 'suite_android/app/src/main/cpp/open_scene_channel_authority_v0_78.*'
      - 'suite_android/app/src/main/cpp/truthnegative_local_authority_projection_v0_4.*'
      - '.github/workflows/truthnegative-continuous-v0-5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          set -euo pipefail
          if [ "${{ matrix.compiler }}" = "clang" ]; then CXX=clang++; else CXX=g++; fi
          cmake -S docs/research/truthnegative-continuous-v0.5 \
                -B /tmp/tn-cont-v05 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER="$CXX"

      - name: Build
        run: cmake --build /tmp/tn-cont-v05 --parallel 2

      - name: Test
        run: ctest --test-dir /tmp/tn-cont-v05 --output-on-failure

  sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: ASan/UBSan
        run: |
          set -euo pipefail
          cmake -S docs/research/truthnegative-continuous-v0.5 \
                -B /tmp/tn-cont-v05-san \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build /tmp/tn-cont-v05-san --parallel 2
          ctest --test-dir /tmp/tn-cont-v05-san --output-on-failure
