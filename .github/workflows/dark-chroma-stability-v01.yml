name: Dark Chroma Stability v0.1 Integrity

on:
  pull_request:
    paths:
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/DarkChromaStabilityAudit.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/FrontsideSceneInspector.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt'
      - 'docs/research/dark-chroma-stability-v0.1/**'
      - 'tools/check_dark_chroma_stability_v01.py'
      - '.github/workflows/dark-chroma-stability-v01.yml'
  push:
    branches:
      - 'research/dark-chroma-stability-v01-2026-09-28'
    paths:
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/DarkChromaStabilityAudit.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/FrontsideSceneInspector.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt'
      - 'docs/research/dark-chroma-stability-v0.1/**'
      - 'tools/check_dark_chroma_stability_v01.py'
      - '.github/workflows/dark-chroma-stability-v01.yml'

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_dark_chroma_stability_v01.py
