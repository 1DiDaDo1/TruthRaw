name: Professional RAW Gatehouse Runtime v0.1

on:
  push:
    branches:
      - research/professional-raw-gatehouse-runtime-v0.1
    paths:
      - 'docs/research/professional-raw-gatehouse-runtime-v0.1/**'
      - 'docs/research/professional-raw-decoder-adapter-v0.1/**'
      - 'docs/research/professional-raw-ingress-v0.1/**'
      - 'docs/research/tile-native-dng-source-v0.1/**'
      - 'docs/research/full-frame-streaming-v0.1/**'
      - 'canonical/reconstruction/v4.7i/**'
      - '.github/workflows/professional-raw-gatehouse-runtime-v0-1.yml'
  pull_request:
    paths:
      - 'docs/research/professional-raw-gatehouse-runtime-v0.1/**'
      - 'docs/research/professional-raw-decoder-adapter-v0.1/**'
      - 'docs/research/professional-raw-ingress-v0.1/**'
      - 'docs/research/tile-native-dng-source-v0.1/**'
      - 'docs/research/full-frame-streaming-v0.1/**'
      - 'canonical/reconstruction/v4.7i/**'
      - '.github/workflows/professional-raw-gatehouse-runtime-v0-1.yml'

jobs:
  contract:
    name: Gatehouse contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolation contract
        shell: bash
        run: |
          set -euo pipefail
          H=docs/research/professional-raw-gatehouse-runtime-v0.1/native/professional_raw_gatehouse_runtime_v0_1.h
          C=docs/research/professional-raw-gatehouse-runtime-v0.1/native/professional_raw_gatehouse_runtime_v0_1.cpp
          R=docs/research/professional-raw-gatehouse-runtime-v0.1/README.md
          grep -q 'allowMainHouseHeavyOverlap' "$H"
          grep -q 'zeroLineCreatedInGatehouse' "$H"
          grep -q 'scientificMasterCreatedInGatehouse' "$H"
          grep -q 'decoderContextLive' "$H"
          grep -q 'physicalFrameCount = 1' "$H"
          grep -q 'independentEvidenceCount = 1' "$H"
          grep -q 'out.allowMainHouseHeavyOverlap = false' "$C"
          grep -q 'Gatehouse created neither zero-line nor Scientific Master' "$R"
          echo 'Gatehouse isolation contract PASS'

  gcc-release:
    name: GCC Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S docs/research/professional-raw-gatehouse-runtime-v0.1 -B build-gcc -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build-gcc --parallel 2
      - name: Test
        run: ./build-gcc/test_professional_raw_gatehouse_runtime_v0_1

  clang-release:
    name: Clang Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S docs/research/professional-raw-gatehouse-runtime-v0.1 -B build-clang -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build-clang --parallel 2
      - name: Test
        run: ./build-clang/test_professional_raw_gatehouse_runtime_v0_1

  clang-sanitizers:
    name: Clang ASan UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: cmake -S docs/research/professional-raw-gatehouse-runtime-v0.1 -B build-san -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build-san --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build-san/test_professional_raw_gatehouse_runtime_v0_1
