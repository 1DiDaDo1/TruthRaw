name: Scientific Master Tile-Read Attribution v0.1 Integrity

on:
  push:
    paths:
      - 'docs/research/scientific-master-streaming-binding-v0.2/**'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/FreeWorldPerformanceDiagnosticsV01.kt'
      - 'docs/research/scientific-master-tile-read-attribution-v0.1/**'
      - 'tools/check_scientific_master_tile_read_attribution_v01.py'
      - '.github/workflows/scientific-master-tile-read-attribution-v01.yml'
  pull_request:
    paths:
      - 'docs/research/scientific-master-streaming-binding-v0.2/**'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/FreeWorldPerformanceDiagnosticsV01.kt'
      - 'docs/research/scientific-master-tile-read-attribution-v0.1/**'
      - 'tools/check_scientific_master_tile_read_attribution_v01.py'
      - '.github/workflows/scientific-master-tile-read-attribution-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Scientific Master tile-read attribution is route-aware and fail-closed
        run: python3 tools/check_scientific_master_tile_read_attribution_v01.py
