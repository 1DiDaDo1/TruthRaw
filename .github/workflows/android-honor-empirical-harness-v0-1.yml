name: Android Honor Empirical Harness v0.1

on:
  push:
    branches:
      - research/android-honor-empirical-harness-v0.1-2026-09-11
    paths:
      - 'app/android/truthraw-adaptive-ui-v01/**'
      - 'docs/research/dng-color-binding-producer-v0.2/**'
      - 'docs/research/dng-color-binding-producer-v0.1/**'
      - 'docs/research/finalized-scientific-preview-release-v0.1/**'
      - 'docs/research/scientific-master-streaming-binding-v0.1/**'
      - 'docs/research/scientific-master-digest-v0.1/**'
      - 'docs/research/truthrange-latent-binding-v0.2/**'
      - 'docs/research/technical-backplane-phase2-v0.1/**'
      - 'docs/research/technical-backplane-v0.1/**'
      - 'docs/research/scientific-preview-source-binding-v0.1/**'
      - 'docs/research/scientific-preview-source-binding-v0.2/**'
      - 'docs/research/reconstructed-color-preview-v0.1/**'
      - 'docs/research/tile-native-dng-source-v0.1/**'
      - 'docs/research/full-frame-streaming-v0.1/native/**'
      - 'docs/research/android-source-bound-color-preview-v0.1/tools/verify_contract_v0_1.py'
      - 'canonical/reconstruction/v4.7i/native/**'
      - '.github/workflows/android-honor-empirical-harness-v0-1.yml'
  pull_request:
    paths:
      - 'app/android/truthraw-adaptive-ui-v01/**'
      - 'docs/research/android-source-bound-color-preview-v0.1/tools/verify_contract_v0_1.py'
      - '.github/workflows/android-honor-empirical-harness-v0-1.yml'

permissions:
  contents: read

jobs:
  host-science-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Revalidate DNG color producer v0.2
        run: |
          cmake -S docs/research/dng-color-binding-producer-v0.2 -B /tmp/truthraw-dng-color-v02 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/truthraw-dng-color-v02 --parallel 2
          ctest --test-dir /tmp/truthraw-dng-color-v02 --output-on-failure

      - name: Revalidate finalized release gate
        run: |
          cmake -S docs/research/finalized-scientific-preview-release-v0.1 -B /tmp/truthraw-fspr -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/truthraw-fspr --parallel 2
          ctest --test-dir /tmp/truthraw-fspr --output-on-failure

  build-arm64-empirical-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify finalized scientific route contract
        run: |
          python3 docs/research/android-source-bound-color-preview-v0.1/tools/verify_contract_v0_1.py
          grep -F 'NativeTilePreviewBridge.buildFinalizedScientificColorPreview(' app/android/truthraw-adaptive-ui-v01/app/src/main/java/com/truthraw/adaptiveui/NativeTilePreview.kt
          grep -F 'scientificMasterModifiedByAppearance' app/android/truthraw-adaptive-ui-v01/app/src/main/cpp/source_bound_color_preview_bridge.cpp
          grep -F 'physicalFrameCount != 1u' app/android/truthraw-adaptive-ui-v01/app/src/main/cpp/source_bound_color_preview_bridge.cpp
          grep -F 'independentEvidenceCount != 1u' app/android/truthraw-adaptive-ui-v01/app/src/main/cpp/source_bound_color_preview_bridge.cpp

      - name: Verify empirical layer is observation-only
        run: |
          grep -F 'changes_scientific_route", false' app/android/truthraw-adaptive-ui-v01/app/src/main/java/com/truthraw/adaptiveui/EmpiricalRun.kt
          grep -F 'measurement_only", true' app/android/truthraw-adaptive-ui-v01/app/src/main/java/com/truthraw/adaptiveui/EmpiricalRun.kt
          grep -F 'NativeEmpiricalBridge.probeSourceColor' app/android/truthraw-adaptive-ui-v01/app/src/main/java/com/truthraw/adaptiveui/EmpiricalRun.kt
          grep -F 'TilePreviewLoader.load(resolver, job)' app/android/truthraw-adaptive-ui-v01/app/src/main/java/com/truthraw/adaptiveui/EmpiricalRun.kt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('app/android/truthraw-adaptive-ui-v01/app/src/main/java/com/truthraw/adaptiveui/EmpiricalRun.kt').read_text()
          match = re.search(r'VALIDATED_SCIENTIFIC_ROUTE_SHA\s*=\s*"([0-9a-f]{40})"', text)
          if not match:
              raise SystemExit('missing well-formed informational scientific-route provenance SHA')
          if '.put("validated_scientific_route_sha", audit.validatedScientificRouteSha)' not in text:
              raise SystemExit('empirical report no longer records route provenance')
          print(f'empirical_route_provenance_sha={match.group(1)}')
          print('empirical_route_sha_role=INFORMATIONAL_PROVENANCE_NOT_AUTHORITY_GATE')
          PY
          grep -F 'seal_source_sha256' app/android/truthraw-adaptive-ui-v01/app/src/main/cpp/empirical_source_probe.cpp
          grep -F 'dng_color_binding_producer_v0_2::produce_source_metadata_color_binding' app/android/truthraw-adaptive-ui-v01/app/src/main/cpp/empirical_source_probe.cpp
          if grep -R "android.permission.CAMERA" app/android/truthraw-adaptive-ui-v01/app/src/main/AndroidManifest.xml; then
            echo 'Empirical harness must not acquire capture authority' >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK and NDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'cmake;3.22.1' \
            'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble Honor empirical arm64 APK
        working-directory: app/android/truthraw-adaptive-ui-v01
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify empirical JNI bridge and report APK identity
        run: |
          APK='app/android/truthraw-adaptive-ui-v01/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          test -s /tmp/libtruthraw_ui_preview_bridge.so
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_NativeEmpiricalBridge_probeSourceColor'
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/libtruthraw_ui_preview_bridge.so'; then
            echo 'Unexpected non-arm64 preview bridge ABI' >&2
            exit 1
          fi
          echo "honor_empirical_apk_bytes=$(stat -c%s "$APK")"
          echo "honor_empirical_apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"
          echo 'scientific_route_contract=SEMANTICALLY_VERIFIED'
          echo 'empirical_probe=READ_ONLY_PRE_POST_SOURCE_AND_COLOR_AUDIT'
          echo 'runtime_observations=PSS_LATENCY_CPU_THERMAL_UI_FRAME_PACING'
          echo 'scientific_authority_from_empirical_layer=NONE'

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-honor-empirical-v0.1-debug-arm64
          path: app/android/truthraw-adaptive-ui-v01/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
