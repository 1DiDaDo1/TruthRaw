name: TruthRaw v0.76 Responsive Camera UI

on:
  push:
    branches:
      - integration/truthraw-suite-v0-76-responsive-camera-ui
    paths:
      - 'suite_android/**'
      - '.github/workflows/android-truthraw-suite-v0-76-responsive-camera-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage:
    name: Scientific lineage unchanged
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tests/test_truthnegative_foundation_v01.py
          python3 tests/test_truthnegative_existing_house_binding_v02.py
          python3 tests/test_open_world_foundations_v01.py
          python3 tests/test_open_world_integration_v03.py
          python3 tests/test_open_world_dynamic_authority_v05.py
          python3 tests/test_open_world_dynamic_runtime_v06.py
          python3 tests/test_open_scene_region_runtime_v07.py
          python3 tests/test_open_scene_state_stream_v08.py
          python3 tests/test_restoration_authority_v01.py

  android:
    name: Android responsive camera UI
    runs-on: ubuntu-24.04
    needs: lineage
    steps:
      - uses: actions/checkout@v4
      - name: Verify UI-only camera change
        run: |
          A='suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt'
          M='suite_android/app/src/main/AndroidManifest.xml'
          grep -F 'ORIENTATION_LANDSCAPE' "$A"
          grep -F 'override fun onConfigurationChanged' "$A"
          grep -F 'MAAK RAW' "$A"
          grep -F 'android:configChanges="orientation|screenSize|smallestScreenSize"' "$M"
          grep -F 'private const val TARGET_W = 16320' "$A"
          grep -F 'private const val TARGET_H = 12288' "$A"
          grep -F 'private const val ZOOM_REQUEST = 3.7f' "$A"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libtruthraw_ui_preview_bridge.so'
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-v0-76-responsive-camera-ui-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
