name: TruthRaw Suite FotoGraaf v0.13 Physical MAX Submit

on:
  push:
    branches:
      - integration/truthraw-suite-v0-12-forced-physical-max
    paths:
      - 'suite_android/**'
      - 'tools/patch_fotograaf_v013_physical_only_max_submit.py'
      - '.github/workflows/android-truthraw-suite-v0-13-physical-only-max-submit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-suite:
    name: Build TruthRaw Suite FotoGraaf v0.13 arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.13 physical-only MAX submit patch
        run: |
          python3 tools/patch_fotograaf_v013_physical_only_max_submit.py
          APP='suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt'
          grep -F 'TruthRaw · 200MP Tele Test v0.13' "$APP"
          grep -F 'if (!lastPhysicalPixelModeWritten)' "$APP"
          grep -F 'setPhysicalCameraKey(' "$APP"
          grep -F 'getPhysicalCameraKey(' "$APP"
          grep -F 'SUBMIT PHYSICAL MAX' "$APP"
          grep -F 'output.addSensorPixelModeUsed(CameraMetadata.SENSOR_PIXEL_MODE_MAXIMUM_RESOLUTION)' "$APP"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-main-plus-fotograaf-v0-13-physical-only-max-submit-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
