name: FotoGraaf Camera2 Acquisition Companion v0.1

on:
  push:
    paths:
      - 'app/android/truthraw-fotograaf-capture-v01/**'
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_CAMERA2_ACQUISITION_OBSERVATION_CONTRACT_V0_1.json'
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_CAMERA2_ACQUISITION_COMPANION_V0_1_2026-09-14.md'
      - 'tools/verify_fotograaf_camera2_acquisition_observation_v0_1.py'
      - 'tests/test_verify_fotograaf_camera2_acquisition_observation_v0_1.py'
      - '.github/workflows/fotograaf-camera2-acquisition-companion-v0-1.yml'
  pull_request:
    paths:
      - 'app/android/truthraw-fotograaf-capture-v01/**'
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_CAMERA2_ACQUISITION_OBSERVATION_CONTRACT_V0_1.json'
      - 'docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_CAMERA2_ACQUISITION_COMPANION_V0_1_2026-09-14.md'
      - 'tools/verify_fotograaf_camera2_acquisition_observation_v0_1.py'
      - 'tests/test_verify_fotograaf_camera2_acquisition_observation_v0_1.py'
      - '.github/workflows/fotograaf-camera2-acquisition-companion-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera2-acquisition-companion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Camera2 acquisition observation contract
        run: >-
          python3 tools/verify_fotograaf_camera2_acquisition_observation_v0_1.py
          --contract docs/research/fotograaf-scene-metrology-v0.1/TRUTHRAW_FOTOGRAAF_CAMERA2_ACQUISITION_OBSERVATION_CONTRACT_V0_1.json

      - name: Run fail-closed observation tests
        run: python3 -m unittest tests/test_verify_fotograaf_camera2_acquisition_observation_v0_1.py -v

      - name: Normal TruthRaw import app still has no CAMERA permission
        run: |
          if grep -R "android.permission.CAMERA" app/android/truthraw-adaptive-ui-v01/app/src/main/AndroidManifest.xml; then
            echo "FAIL: normal TruthRaw import/reconstruction app acquired capture authority"
            exit 1
          fi

      - name: Companion is explicitly camera-scoped and does not emit classifier fields
        run: |
          grep -q 'android.permission.CAMERA' app/android/truthraw-fotograaf-capture-v01/app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.truthraw.fotograafcapture"' app/android/truthraw-fotograaf-capture-v01/app/build.gradle.kts
          if grep -R 'put("captureSampleDomainId"' app/android/truthraw-fotograaf-capture-v01/app/src/main/java; then
            echo "FAIL: source-side observation app must not emit sample-domain classification"
            exit 1
          fi
          if grep -R 'put("gainReadoutStateId"' app/android/truthraw-fotograaf-capture-v01/app/src/main/java; then
            echo "FAIL: source-side observation app must not emit gain/readout classification"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble standalone FotoGraaf capture APK
        working-directory: app/android/truthraw-fotograaf-capture-v01
        run: gradle --no-daemon :app:assembleDebug

      - name: Report APK evidence
        run: |
          APK='app/android/truthraw-fotograaf-capture-v01/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          echo "fotograaf_capture_apk_bytes=$(stat -c%s "$APK")"
          echo "fotograaf_capture_apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"
          echo "scientific_master_route_changed=0"
          echo "normal_truthraw_camera_permission=0"
          echo "calibration_authority_granted=0"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-fotograaf-camera2-capture-v0.1-debug-apk
          path: app/android/truthraw-fotograaf-capture-v01/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
