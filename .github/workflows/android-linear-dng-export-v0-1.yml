name: Android Linear DNG Export v0.1

on:
  push:
    branches:
      - research/bit-exact-read-optimization-v0.1-2026-09-11
      - research/android-dng-projection-v0.1-2026-09-13
    paths:
      - 'app/android/truthraw-adaptive-ui-v01/**'
      - 'docs/research/linear-dng-projection-v0.1/**'
      - 'docs/research/finalized-scientific-preview-release-v0.2/**'
      - 'docs/research/scientific-master-streaming-binding-v0.2/**'
      - 'docs/research/scientific-preview-source-binding-v0.1/**'
      - 'docs/research/scientific-preview-source-binding-v0.2/**'
      - 'docs/research/dng-color-binding-producer-v0.1/**'
      - 'docs/research/dng-color-binding-producer-v0.2/**'
      - 'docs/research/tile-native-dng-source-v0.1/**'
      - 'docs/research/full-frame-streaming-v0.1/native/**'
      - 'canonical/reconstruction/v4.7i/native/**'
      - '.github/workflows/android-linear-dng-export-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-linear-dng:
    name: Host Linear DNG writer
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S docs/research/linear-dng-projection-v0.1 -B /tmp/truthraw-linear-dng -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build /tmp/truthraw-linear-dng --parallel 2
      - name: Test
        run: ctest --test-dir /tmp/truthraw-linear-dng --output-on-failure

  build-arm64-linear-dng-apk:
    name: Android arm64 Linear DNG APK
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify export boundary and no scientific-authority promotion
        run: |
          BRIDGE='app/android/truthraw-adaptive-ui-v01/app/src/main/cpp/linear_dng_export_bridge.cpp'
          KOTLIN='app/android/truthraw-adaptive-ui-v01/app/src/main/java/com/truthraw/adaptiveui/LinearDngExport.kt'
          CMAKE='app/android/truthraw-adaptive-ui-v01/app/src/main/cpp/CMakeLists.txt'
          grep -F 'create_and_release_finalized_scientific_preview' "$BRIDGE"
          grep -F 'reverify_source_sha256' "$BRIDGE"
          grep -F 'release_matches_source' "$BRIDGE"
          grep -F 'write_finalized_linear_dng' "$BRIDGE"
          grep -F 'Linear DNG opslaan' 'app/android/truthraw-adaptive-ui-v01/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt'
          grep -F 'LINEAR_DNG_MAX_LOGICAL_RESIDENT_BYTES' "$KOTLIN"
          grep -F 'LINEAR_DNG_PROJECTION' "$CMAKE"
          if grep -Eiq '(^|[^A-Za-z])(vulkan|libvulkan|Vk[A-Z])' "$CMAKE"; then
            echo 'Unexpected Vulkan dependency in Linear DNG CPU reference build' >&2
            exit 1
          fi
          echo 'linear_dng_authority=REPRESENTATION_ONLY'
          echo 'scientific_authority_promotion=FORBIDDEN'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK and NDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'cmake;3.22.1' \
            'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 APK
        working-directory: app/android/truthraw-adaptive-ui-v01
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Linear DNG JNI symbol and APK identity
        run: |
          APK='app/android/truthraw-adaptive-ui-v01/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          test -s /tmp/libtruthraw_ui_preview_bridge.so
          READELF=$(find "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt" -type f -name llvm-readelf | head -n1)
          test -n "$READELF"
          "$READELF" -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_LinearDngNativeBridge_exportFinalizedLinearDng'
          "$READELF" -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_NativeTilePreviewBridge_buildFinalizedScientificColorPreview'
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/libtruthraw_ui_preview_bridge.so'; then
            echo 'Unexpected non-arm64 TruthRaw bridge ABI' >&2
            exit 1
          fi
          echo "linear_dng_apk_bytes=$(wc -c < "$APK" | tr -d ' ')"
          echo "linear_dng_apk_sha256=$(shasum -a 256 "$APK" | awk '{print $1}')"
          echo 'linear_dng_photometric=LinearRaw_34892'
          echo 'linear_dng_storage=UNCOMPRESSED_UINT16_RGB'
          echo 'full_scientific_master_materialization=FORBIDDEN'
          echo 'truthraw_execution_backend=CPU_NDK_REFERENCE_NO_VULKAN'

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-linear-dng-v0.1-debug-arm64
          path: app/android/truthraw-adaptive-ui-v01/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error