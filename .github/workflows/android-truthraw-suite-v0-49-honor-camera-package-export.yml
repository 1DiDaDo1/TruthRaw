name: TruthRaw v0.49 Honor Camera Package Export

on:
  push:
    branches:
      - integration/truthraw-suite-v0-49-honor-camera-package-export
    paths:
      - 'suite_android/app/src/main/AndroidManifest.xml'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/HonorCameraPackageExportActivity.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/TruthRawSuiteLauncherActivity.kt'
      - 'docs/HONOR_V049_CAMERA_PACKAGE_EXPORT_PLAN_2026-09-19.md'
      - 'state/HONOR_V049_CAMERA_PACKAGE_EXPORT_PLAN_2026-09-19.json'
      - '.github/workflows/android-truthraw-suite-v0-49-honor-camera-package-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v049:
    name: Build v0.49 Honor Camera package export
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify v0.49 software-artifact boundary
        run: |
          ACT='suite_android/app/src/main/java/com/truthraw/adaptiveui/HonorCameraPackageExportActivity.kt'
          grep -F 'truthraw.honor-camera-package-export.v0.49' "$ACT"
          grep -F 'SOFTWARE_PACKAGE_ARTIFACT_ONLY' "$ACT"
          grep -F 'com.hihonor.camera' "$ACT"
          grep -F 'MessageDigest.getInstance("SHA-256")' "$ACT"
          grep -F 'splitSourceDirs' "$ACT"
          grep -F 'ZipOutputStream' "$ACT"

          python3 - <<'PY'
          from pathlib import Path
          s=Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/HonorCameraPackageExportActivity.kt').read_text()
          forbidden=[
            'openCamera(',
            'createCaptureRequest',
            'import android.media.ImageReader',
            'CameraCaptureSession',
            'bindService(',
            'setPhysicalCameraKey',
          ]
          for token in forbidden:
              assert token not in s, token
          print('v0.49 software-artifact-only invariants PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-v0-49-honor-camera-package-export-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
