name: D.RAW Source Capability Evidence Ledger v0.2

on:
  push:
    branches:
      - feat/draw-workspace-free-raster-v01
    paths:
      - 'tools/apply_source_capability_occurrence_ledger_v01.py'
      - 'tools/apply_source_capability_traversal_status_v01.py'
      - 'tools/apply_source_capability_radiometric_semantics_v01.py'
      - 'tools/apply_source_capability_raw_ifd_domain_v01.py'
      - 'suite_android/app/build.gradle.kts'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/DngContainerMetadataParser.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityRadiometricSemanticValidatorV01.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityRawIfdDomainValidatorV01.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/UniversalSourceProfiler.kt'
      - 'suite_android/app/src/test/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02Test.kt'
      - 'suite_android/app/src/test/java/com/truthraw/adaptiveui/SourceCapabilityOccurrenceLedgerV01Test.kt'
      - 'suite_android/app/src/test/java/com/truthraw/adaptiveui/SourceCapabilityTraversalStatusV01Test.kt'
      - 'suite_android/app/src/test/java/com/truthraw/adaptiveui/SourceCapabilityRadiometricSemanticValidatorV01Test.kt'
      - 'suite_android/app/src/test/java/com/truthraw/adaptiveui/SourceCapabilityRawIfdDomainValidatorV01Test.kt'
      - '.github/workflows/draw-source-capability-occurrence-ledger-v01.yml'

concurrency:
  group: draw-source-capability-evidence-ledger-v02-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/draw-workspace-free-raster-v01
          fetch-depth: 0

      - name: Ensure passive occurrence-ledger state
        run: |
          if grep -Fq 'truthraw.classic-tiff-dng-container-metadata.v0.56-traversal-status' suite_android/app/src/main/java/com/truthraw/adaptiveui/DngContainerMetadataParser.kt; then
            echo 'Occurrence-ledger state already superseded by validated v0.56 traversal runtime.'
          else
            python3 tools/apply_source_capability_occurrence_ledger_v01.py
          fi

      - name: Ensure passive traversal-status state
        run: |
          if grep -Fq 'truthraw.classic-tiff-dng-container-metadata.v0.56-traversal-status' suite_android/app/src/main/java/com/truthraw/adaptiveui/DngContainerMetadataParser.kt; then
            echo 'Passive traversal-status state already applied.'
          else
            python3 tools/apply_source_capability_traversal_status_v01.py
          fi

      - name: Ensure shadow radiometric semantic validator
        run: python3 tools/apply_source_capability_radiometric_semantics_v01.py

      - name: Apply shadow raw-IFD format-domain validator
        run: python3 tools/apply_source_capability_raw_ifd_domain_v01.py

      - name: Verify evidence-ledger invariants
        run: |
          git diff --check
          grep -F 'truthraw.classic-tiff-dng-container-metadata.v0.56-traversal-status' suite_android/app/src/main/java/com/truthraw/adaptiveui/DngContainerMetadataParser.kt
          grep -F '.put("entryOffset", entry.entryOffset)' suite_android/app/src/main/java/com/truthraw/adaptiveui/DngContainerMetadataParser.kt
          grep -F '"originalValueOrOffsetBytesHex",' suite_android/app/src/main/java/com/truthraw/adaptiveui/DngContainerMetadataParser.kt
          grep -F 'REVISITED_IFD_OFFSET_FAIL_CLOSED' suite_android/app/src/main/java/com/truthraw/adaptiveui/DngContainerMetadataParser.kt
          grep -F 'RECURSION_LIMIT_EXCEEDED_FAIL_CLOSED' suite_android/app/src/main/java/com/truthraw/adaptiveui/DngContainerMetadataParser.kt
          grep -F 'IFD_OFFSET_OUT_OF_BOUNDS_FAIL_CLOSED' suite_android/app/src/main/java/com/truthraw/adaptiveui/DngContainerMetadataParser.kt
          grep -F 'duplicate_tags_preserved_as_distinct_occurrences' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02.kt
          grep -F 'container_traversal_anomaly_digest_sha256' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02.kt
          grep -F 'CONTRADICTED_FAIL_CLOSED' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02.kt
          grep -F 'radiometric_semantic_validation_v0_1' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02.kt
          grep -F 'raw_ifd_domain_validation_v0_1' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02.kt
          grep -F 'D.RAW/SourceCapabilityRadiometricSemanticValidation/0.1' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityRadiometricSemanticValidatorV01.kt
          grep -F 'D.RAW/SourceCapabilityRawIfdDomainValidation/0.1' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityRawIfdDomainValidatorV01.kt
          grep -F 'VALIDATED_RAW_IFD_FORMAT_DOMAIN_SHADOW_ONLY' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityRawIfdDomainValidatorV01.kt
          grep -F 'domain_validation_is_scientific_admission' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityRawIfdDomainValidatorV01.kt
          grep -F 'duplicate_occurrence_selection_allowed' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityRawIfdDomainValidatorV01.kt
          grep -F 'VALIDATED_RAW_IFD_FORMAT_USAGE_SHADOW_ONLY' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityRadiometricSemanticValidatorV01.kt
          grep -F 'defaults_mint_source_occurrence' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityRadiometricSemanticValidatorV01.kt
          grep -F 'scientific_admission_effect' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityRadiometricSemanticValidatorV01.kt
          grep -F 'SourceCapabilityEnvelopeV02.unavailable' suite_android/app/src/main/java/com/truthraw/adaptiveui/UniversalSourceProfiler.kt
          grep -F 'scientific_writeback_allowed' suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02.kt
          grep -F 'testImplementation("org.json:json:20260814")' suite_android/app/build.gradle.kts

      - name: Verify sealed Full-Frame Streaming untouched
        run: python3 docs/research/full-frame-streaming-v0.1/tools/verify_integrity_v0_1.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run complete Android unit-test suite
        working-directory: suite_android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Commit validated passive source-evidence wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            suite_android/app/src/main/java/com/truthraw/adaptiveui/DngContainerMetadataParser.kt \
            suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02.kt \
            suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityRadiometricSemanticValidatorV01.kt \
            suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityRawIfdDomainValidatorV01.kt \
            suite_android/app/src/main/java/com/truthraw/adaptiveui/UniversalSourceProfiler.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Passive source-evidence wiring already applied.'
          else
            git commit -m 'android: add shadow DNG raw-IFD format-domain validator v0.1'
            git push origin HEAD:feat/draw-workspace-free-raster-v01
          fi
          git rev-parse HEAD
