name: TEMP D.RAW Unified Output lifecycle cleanup

on:
  push:
    branches:
      - feat/draw-workspace-free-raster-v01
    paths:
      - '.github/workflows/draw-mainactivity-presentation-bridge-patch.yml'

permissions:
  contents: write

jobs:
  lifecycle-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact guarded lifecycle correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt')
          data = path.read_bytes()
          git_blob_sha = hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          expected_blob_sha = '98ba25f9a10302a8e2abac22a866f2242af7aa97'
          if git_blob_sha != expected_blob_sha:
              raise SystemExit(f'MainActivity blob moved: {git_blob_sha} != {expected_blob_sha}')

          text = data.decode('utf-8')
          old = '''        // The bridge owns an independent presentation copy. Activity teardown\n        // releases only MainActivity's bitmap; source/job invalidation elsewhere\n        // still clears the bridge through the unifiedOutputPreviewState setter.\n        preserveUnifiedOutputPresentationOnDestroy = true\n'''
          new = '''        // Preserve the bridge-owned presentation copy only across a normal\n        // finish/back transition or a configuration change. Unexpected teardown\n        // clears it fail-closed through the unifiedOutputPreviewState setter.\n        preserveUnifiedOutputPresentationOnDestroy =\n            isFinishing || isChangingConfigurations\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one lifecycle block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact scope
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt'
          grep -F 'isFinishing || isChangingConfigurations' suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt

      - name: Commit lifecycle correction and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add suite_android/app/src/main/java/com/truthraw/adaptiveui/MainActivity.kt
          git rm .github/workflows/draw-mainactivity-presentation-bridge-patch.yml
          git diff --cached --check
          git commit -m 'Android: fail closed stale Unified Output presentation teardown'
          git push origin HEAD:feat/draw-workspace-free-raster-v01
