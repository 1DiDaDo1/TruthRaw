name: Android Linear DNG Export v0.1

on:
  push:
    branches:
      - research/android-linear-dng-export-v0.1-2026-09-12-ci
    paths:
      - 'app/android/truthraw-adaptive-ui-v01/**'
      - 'docs/research/finalized-scientific-preview-release-v0.2/**'
      - 'docs/research/scientific-master-streaming-binding-v0.2/**'
      - 'docs/research/scientific-master-digest-v0.1/**'
      - 'docs/research/scientific-preview-source-binding-v0.1/**'
      - 'docs/research/scientific-preview-source-binding-v0.2/**'
      - 'docs/research/dng-color-binding-producer-v0.1/**'
      - 'docs/research/dng-color-binding-producer-v0.2/**'
      - 'docs/research/tile-native-dng-source-v0.1/**'
      - 'docs/research/full-frame-streaming-v0.1/native/**'
      - 'docs/research/reconstructed-color-preview-v0.1/**'
      - 'docs/research/technical-backplane-v0.1/**'
      - 'docs/research/technical-backplane-phase2-v0.1/**'
      - 'docs/research/truthrange-latent-binding-v0.2/**'
      - 'canonical/reconstruction/v4.7i/native/**'
      - '.github/workflows/android-linear-dng-export-v0-1-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-scientific-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Revalidate Scientific Master streaming v0.2
        run: |
          cmake -S docs/research/scientific-master-streaming-binding-v0.2 -B /tmp/truthraw-sm-v02 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/truthraw-sm-v02 --parallel 2
          ctest --test-dir /tmp/truthraw-sm-v02 --output-on-failure
      - name: Revalidate finalized release v0.2
        run: |
          cmake -S docs/research/finalized-scientific-preview-release-v0.2 -B /tmp/truthraw-fspr-v02 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/truthraw-fspr-v02 --parallel 2
          ctest --test-dir /tmp/truthraw-fspr-v02 --output-on-failure

  build-arm64-linear-dng-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify DNG projection contract is downstream-only
        run: |
          BRIDGE='app/android/truthraw-adaptive-ui-v01/app/src/main/cpp/linear_dng_projection_bridge.cpp'
          grep -F 'RECONSTRUCTED_LINEAR_DNG_PROJECTION' 'app/android/truthraw-adaptive-ui-v01/app/src/main/java/com/truthraw/adaptiveui/DngExportActivity.kt'
          grep -F 'ScientificMasterDigestAccumulator' "$BRIDGE"
          grep -F 'replayHash != release.scientificIdentity.scientificMasterHash' "$BRIDGE"
          grep -F 'NOT direct sensor evidence' "$BRIDGE"
          grep -F 'This product includes DNG technology under license by Adobe.' "$BRIDGE"
          if grep -Eiq '(^|[^A-Za-z])(vulkan|libvulkan|Vk[A-Z])' 'app/android/truthraw-adaptive-ui-v01/app/src/main/cpp/CMakeLists.txt'; then
            echo 'Unexpected Vulkan dependency in CPU reference export build' >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK and NDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'cmake;3.22.1' \
            'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble Linear DNG export arm64 APK
        working-directory: app/android/truthraw-adaptive-ui-v01
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify native export symbol and APK identity
        run: |
          APK='app/android/truthraw-adaptive-ui-v01/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          test -s /tmp/libtruthraw_ui_preview_bridge.so
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_NativeDngProjectionBridge_exportFinalizedLinearDng'
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_NativeTilePreviewBridge_buildFinalizedScientificColorPreview'
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/libtruthraw_ui_preview_bridge.so'; then
            echo 'Unexpected non-arm64 ABI' >&2
            exit 1
          fi
          echo "linear_dng_apk_bytes=$(stat -c%s "$APK")"
          echo "linear_dng_apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"
          echo 'export_role=RECONSTRUCTED_LINEAR_DNG_PROJECTION'
          echo 'scientific_authority_from_export=NONE'
          echo 'output_photometric=LinearRaw'
          echo 'output_bits_per_sample=16x3'

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-linear-dng-v0.1-debug-arm64
          path: app/android/truthraw-adaptive-ui-v01/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
