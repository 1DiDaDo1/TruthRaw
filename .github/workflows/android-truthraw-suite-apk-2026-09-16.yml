name: TruthRaw Suite APK 2026-09-16

on:
  push:
    branches:
      - integration/truthraw-suite-apk-2026-09-16
    paths:
      - 'suite_android/**'
      - '.github/workflows/android-truthraw-suite-apk-2026-09-16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-suite:
    name: Build TruthRaw Suite Main + FotoGraaf arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify recovered camera evidence boundaries
        run: |
          APP='suite_android'
          MANIFEST="$APP/app/src/main/AndroidManifest.xml"
          JAVA="$APP/app/src/main/java/com/truthraw/adaptiveui"
          CPP="$APP/app/src/main/cpp"
          grep -F 'FotoGraafLiveCameraActivity' "$MANIFEST"
          grep -F 'TextureView.SurfaceTextureListener' "$JAVA/FotoGraafLiveCameraActivity.kt"
          grep -F 'setRepeatingRequest' "$JAVA/FotoGraafLiveCameraActivity.kt"
          grep -F 'setPhysicalCameraKey' "$JAVA/FotoGraafLiveCameraActivity.kt"
          grep -F 'physicalCameraResults' "$JAVA/FotoGraafLiveCameraActivity.kt"
          grep -F 'SENSOR_TIMESTAMP' "$JAVA/FotoGraafLiveCameraActivity.kt"
          grep -F 'physicalFrameCount", 1' "$JAVA/FotoGraafLiveCameraActivity.kt"
          grep -F 'independentEvidenceCount", 1' "$JAVA/FotoGraafLiveCameraActivity.kt"
          grep -F 'vendorRequestsWritten", false' "$JAVA/FotoGraafLiveCameraActivity.kt"
          grep -F 'creator.setOrientation(1)' "$JAVA/FotoGraafLiveCameraActivity.kt"
          grep -F 'object LinearDngExporter' "$JAVA/LinearDngExport.kt"
          grep -F 'linear_dng_export_bridge.cpp' "$CPP/CMakeLists.txt"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'cmake;3.22.1' \
            'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK native processor and capture class
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          test -s /tmp/libtruthraw_ui_preview_bridge.so
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_NativeTilePreviewBridge_buildFinalizedScientificColorPreview'
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_LinearDngNativeBridge_exportFinalizedLinearDng'
          unzip -l "$APK" | grep -F 'classes.dex'
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/libtruthraw_ui_preview_bridge.so'; then
            echo 'Unexpected non-arm64 TruthRaw native ABI' >&2
            exit 1
          fi
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-main-plus-fotograaf-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
