name: TruthRaw Suite APK 2026-09-16

on:
  push:
    branches:
      - integration/truthraw-suite-apk-2026-09-16
      - integration/truthraw-suite-v0-6-200mp-preview-first-2026-09-16
      - integration/truthraw-suite-v0-10-200mp-max-highres
    paths:
      - 'suite_android/**'
      - '.github/workflows/android-truthraw-suite-apk-2026-09-16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-suite:
    name: Build TruthRaw Suite Main + FotoGraaf arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify integrated camera and evidence boundaries
        run: |
          APP='suite_android'
          MANIFEST="$APP/app/src/main/AndroidManifest.xml"
          JAVA="$APP/app/src/main/java/com/truthraw/adaptiveui"
          DEBUGJAVA="$APP/app/src/main/java/io/truthraw/debug"
          STAGED="$JAVA/FotoGraaf200MpStagedActivity.kt"
          ENTRY="$JAVA/FotoGraaf200MpEntryActivity.kt"
          CRASH="$JAVA/TruthRawCrashReportActivity.kt"
          APPCLASS="$JAVA/TruthRawSuiteApplication.kt"
          ROUTES="$JAVA/FotoGraafProRoutes.kt"
          CPP="$APP/app/src/main/cpp"

          grep -F 'FotoGraaf200MpEntryActivity' "$MANIFEST"
          grep -F 'TruthRawCrashReportActivity' "$MANIFEST"
          grep -F '200MP TEST · crash-isolatie ingang' "$JAVA/TruthRawSuiteLauncherActivity.kt"
          grep -F 'imports/uses no Camera2 API' "$ENTRY"
          grep -F 'Thread.setDefaultUncaughtExceptionHandler' "$APPCLASS"
          grep -F 'truthraw_last_crash.txt' "$APPCLASS"
          grep -F 'Crashrapport opslaan' "$CRASH"

          # TextureView regression guard remains permanent.
          grep -F 'TruthRaw · 200MP Tele Test v0.10' "$STAGED"
          if grep -F 'setBackgroundColor(Color.BLACK)' "$STAGED"; then
            echo 'Forbidden TextureView background regression in staged 200MP activity' >&2
            exit 1
          fi
          grep -F 'TextureView rejects background drawables/background colors' "$STAGED"

          # v0.10 restores the exact v0.7 200MP discovery route.
          grep -F 'SCALER_STREAM_CONFIGURATION_MAP_MAXIMUM_RESOLUTION' "$STAGED"
          grep -F 'maximumMap?.getHighResolutionOutputSizes(ImageFormat.RAW_SENSOR)' "$STAGED"
          grep -F 'MAXIMUM_MAP_HIGH_RESOLUTION' "$STAGED"

          # Staged science/acquisition path remains explicit and fail-closed.
          grep -F 'STAGE 0 PASS' "$STAGED"
          grep -F 'CONTROL_ZOOM_RATIO' "$STAGED"
          grep -F 'LOGICAL_MULTI_CAMERA_ACTIVE_PHYSICAL_ID' "$STAGED"
          grep -F 'TARGET_W = 16320' "$STAGED"
          grep -F 'TARGET_H = 12288' "$STAGED"
          grep -F 'TARGET_SAMPLES = 200_540_160L' "$STAGED"
          grep -F 'output.setPhysicalCameraId(PHYSICAL_ID)' "$STAGED"
          grep -F 'output.addSensorPixelModeUsed(CameraMetadata.SENSOR_PIXEL_MODE_MAXIMUM_RESOLUTION)' "$STAGED"
          grep -F 'SENSOR_PIXEL_MODE_MAXIMUM_RESOLUTION' "$STAGED"
          grep -F 'persistOriginalRawBuffer' "$STAGED"
          grep -F 'canonicalContiguousRawsensor' "$STAGED"
          grep -F 'sha256ValidSampleBytes' "$STAGED"
          grep -F 'AUXILIARY_DERIVED_CONTAINER' "$STAGED"
          grep -F 'creator.setOrientation(1)' "$STAGED"
          grep -F 'APP_VISIBLE_MAXIMUM_RESOLUTION_RAW_SENSOR_CFA_NOT_UNTOUCHED_NATIVE_ADC_PROOF' "$STAGED"

          # Existing runtime route discovery and verifier remain integrated.
          grep -F 'getHighResolutionOutputSizes(ImageFormat.RAW_SENSOR)' "$ROUTES"
          grep -F 'class MainActivity extends Activity' "$DEBUGJAVA/MainActivity.java"
          grep -F 'IdentityContract.isExactFrozenSource' "$DEBUGJAVA/MainActivity.java"
          grep -F 'DngCfaHasher.hash' "$DEBUGJAVA/MainActivity.java"
          grep -F 'object LinearDngExporter' "$JAVA/LinearDngExport.kt"
          grep -F 'linear_dng_export_bridge.cpp' "$CPP/CMakeLists.txt"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK native processor and package
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          test -s /tmp/libtruthraw_ui_preview_bridge.so
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_NativeTilePreviewBridge_buildFinalizedScientificColorPreview'
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_LinearDngNativeBridge_exportFinalizedLinearDng'
          unzip -l "$APK" | grep -F 'classes.dex'
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/libtruthraw_ui_preview_bridge.so'; then
            echo 'Unexpected non-arm64 TruthRaw native ABI' >&2
            exit 1
          fi
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-main-plus-fotograaf-v0-10-max-highres-rawbuffer-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
