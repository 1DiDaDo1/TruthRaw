name: TruthRaw Suite APK 2026-09-16

on:
  push:
    branches:
      - integration/truthraw-suite-apk-2026-09-16
    paths:
      - 'suite_android/**'
      - '.github/workflows/android-truthraw-suite-apk-2026-09-16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-suite:
    name: Build TruthRaw Suite Main + FotoGraaf arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify integrated camera and evidence boundaries
        run: |
          APP='suite_android'
          MANIFEST="$APP/app/src/main/AndroidManifest.xml"
          JAVA="$APP/app/src/main/java/com/truthraw/adaptiveui"
          DEBUGJAVA="$APP/app/src/main/java/io/truthraw/debug"
          PRO="$JAVA/FotoGraafProCameraActivity.kt"
          ROUTES="$JAVA/FotoGraafProRoutes.kt"
          CPP="$APP/app/src/main/cpp"

          # Historical proven Camera2 path remains present.
          grep -F 'FotoGraafLiveCameraActivity' "$MANIFEST"
          grep -F 'TextureView.SurfaceTextureListener' "$JAVA/FotoGraafLiveCameraActivity.kt"
          grep -F 'setRepeatingRequest' "$JAVA/FotoGraafLiveCameraActivity.kt"
          grep -F 'creator.setOrientation(1)' "$JAVA/FotoGraafLiveCameraActivity.kt"

          # Full Pro camera must be a real registered Camera2 activity.
          grep -F 'FotoGraafProCameraActivity' "$MANIFEST"
          grep -F 'TextureView.SurfaceTextureListener' "$PRO"
          grep -F 'setPhysicalCameraId' "$PRO"
          grep -F 'setPhysicalCameraKey' "$PRO"
          grep -F 'SENSOR_PIXEL_MODE_MAXIMUM_RESOLUTION' "$PRO"
          grep -F 'SCALER_STREAM_CONFIGURATION_MAP_MAXIMUM_RESOLUTION' "$ROUTES"
          grep -F 'CONTROL_AE_MODE_OFF' "$PRO"
          grep -F 'SENSOR_SENSITIVITY' "$PRO"
          grep -F 'SENSOR_EXPOSURE_TIME' "$PRO"
          grep -F 'CONTROL_AE_EXPOSURE_COMPENSATION' "$PRO"
          grep -F 'CONTROL_AF_REGIONS' "$PRO"
          grep -F 'LENS_FOCUS_DISTANCE' "$PRO"
          grep -F 'LENS_OPTICAL_STABILIZATION_MODE' "$PRO"

          # Capture admission remains fail-closed and one-frame.
          grep -F 'physicalCameraResults' "$PRO"
          grep -F 'SENSOR_TIMESTAMP' "$PRO"
          grep -F 'physicalFrameCount", 1' "$PRO"
          grep -F 'independentEvidenceCount", 1' "$PRO"
          grep -F 'scientificMasterModified", false' "$PRO"
          grep -F 'scientificWriteback", false' "$PRO"
          grep -F 'vendorRequestsWritten", false' "$PRO"
          grep -F 'APP_VISIBLE_RAW_SENSOR_PLANE_NOT_UNTOUCHED_ADC_PROOF' "$PRO"
          grep -F 'maximumResolutionCaptureConfirmed' "$PRO"

          # Proven v0.3 exact source/CFA verifier is integrated, not replaced.
          grep -F 'class MainActivity extends Activity' "$DEBUGJAVA/MainActivity.java"
          grep -F 'IdentityContract.isExactFrozenSource' "$DEBUGJAVA/MainActivity.java"
          grep -F 'DngCfaHasher.hash' "$DEBUGJAVA/MainActivity.java"

          # Existing native TruthRaw processor/export bridge remains linked.
          grep -F 'object LinearDngExporter' "$JAVA/LinearDngExport.kt"
          grep -F 'linear_dng_export_bridge.cpp' "$CPP/CMakeLists.txt"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'cmake;3.22.1' \
            'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK native processor and package
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          test -s /tmp/libtruthraw_ui_preview_bridge.so
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_NativeTilePreviewBridge_buildFinalizedScientificColorPreview'
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_LinearDngNativeBridge_exportFinalizedLinearDng'
          unzip -l "$APK" | grep -F 'classes.dex'
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/libtruthraw_ui_preview_bridge.so'; then
            echo 'Unexpected non-arm64 TruthRaw native ABI' >&2
            exit 1
          fi
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-main-plus-fotograaf-v0-5-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
