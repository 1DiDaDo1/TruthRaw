name: Camera RGB Covariance v0.6 Integrity

on:
  push:
    branches: [ main, research/camera-rgb-covariance-v0.6 ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  covariance-v06:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify v0.6 byte-exact module and claim guards
        run: python docs/research/camera-rgb-covariance-v0.6/tools/verify_camera_rgb_covariance_v06_integrity.py
      - name: GCC build against real closed TruthRaw dependencies
        run: |
          cmake -S docs/research/camera-rgb-covariance-v0.6 -B /tmp/truthraw_cov_v06_gcc -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/truthraw_cov_v06_gcc --parallel 2
          ctest --test-dir /tmp/truthraw_cov_v06_gcc --output-on-failure
      - name: Clang build against real closed TruthRaw dependencies
        run: |
          cmake -S docs/research/camera-rgb-covariance-v0.6 -B /tmp/truthraw_cov_v06_clang -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
          cmake --build /tmp/truthraw_cov_v06_clang --parallel 2
          ctest --test-dir /tmp/truthraw_cov_v06_clang --output-on-failure
      - name: ASan and UBSan contract run
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S docs/research/camera-rgb-covariance-v0.6 -B /tmp/truthraw_cov_v06_san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build /tmp/truthraw_cov_v06_san --parallel 2
          ctest --test-dir /tmp/truthraw_cov_v06_san --output-on-failure
      - name: Python syntax smoke
        run: python -m py_compile docs/research/camera-rgb-covariance-v0.6/tools/verify_camera_rgb_covariance_v06_integrity.py
