name: TruthRaw Suite v0.83.2 Orientation Fullres Advanced

on:
  push:
    branches:
      - integration/truthraw-suite-v0-83-2-orientation-fullres-advanced
    paths:
      - 'suite_android/**'
      - '.github/workflows/android-truthraw-suite-v0-83-2-orientation-fullres-advanced.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-suite:
    name: Build v0.83.2 rotate + full-res Advanced arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify v0.83.2 integration contracts
        run: |
          set -euo pipefail
          APP='suite_android'
          JAVA="$APP/app/src/main/java/com/truthraw/adaptiveui"
          CPP="$APP/app/src/main/cpp"

          grep -F 'object TruthRawOrientationOverride' "$JAVA/TruthRawOrientationOverride.kt"
          grep -F 'PRESENTATION_COORDINATE_TRANSFORM_ONLY' "$JAVA/JpgLExport.kt"
          grep -F 'science_orientation_unchanged=1' "$JAVA/JpgLExport.kt"
          grep -F 'hdr_front_authority=' "$JAVA/JpgLExport.kt"
          grep -F 'restoration_front_role=AESTHETIC_REINTEGRATION_ONLY' "$JAVA/JpgLExport.kt"

          grep -F 'TruthRawOrientationOverride.rotateClockwise' "$JAVA/MainActivity.kt"
          grep -F 'Herstel origineel' "$JAVA/MainActivity.kt"
          grep -F 'userQuarterTurns' "$JAVA/FullResJpegExport.kt"
          grep -F 'compose_orientation' "$CPP/photo_export_bridge.cpp"
          grep -F 'scratchRgbOffset_' "$CPP/photo_export_bridge.cpp"
          grep -F 'legacy_display_gain_from_half_log' "$CPP/photo_export_bridge.cpp"
          grep -F 'restorationBaked' "$CPP/photo_export_bridge.cpp"
          grep -F 'canonical_scene::build_from_source' "$CPP/photo_export_bridge.cpp"
          grep -F 'channel_authority::build_generic_fail_closed_from_source' "$CPP/photo_export_bridge.cpp"
          grep -F 'illumination_state::build' "$CPP/photo_export_bridge.cpp"
          grep -F 'hdr_authority::build' "$CPP/photo_export_bridge.cpp"
          grep -F 'per_output_channel_authority_available=' "$JAVA/JpgLExport.kt"
          grep -F 'APPEARANCE_ONLY' "$JAVA/MainActivity.kt"
          grep -F 'AESTHETIC_REINTEGRATION_ONLY' "$JAVA/MainActivity.kt"

          # PURE pixels stay unchanged; only projection orientation metadata is composed.
          grep -F 'composeOrientation(source->metadata().orientation, userQuarterTurns)'             "$CPP/pure_float32_dng_export_bridge.cpp"

          # TIFF infinite-loop regression remains forbidden.
          if grep -F 'while((header.size()%12u)!=2u && header.size()<8u+2u+e.size()*12u){}'             "$CPP/restoration_projection_bridge.cpp"; then
            echo 'Forbidden TIFF infinite header loop regression' >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify native export symbols and APK
        run: |
          set -euo pipefail
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          test -s /tmp/libtruthraw_ui_preview_bridge.so
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so |             grep -F 'Java_com_truthraw_adaptiveui_PhotoExportNativeBridge_renderFullResNv21'
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so |             grep -F 'Java_com_truthraw_adaptiveui_PureFloat32DngNativeBridge_exportPureFloat32Dng'
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so |             grep -F 'Java_com_truthraw_adaptiveui_TruthNegativeNativeBridge_exportTruthNegative'
          unzip -l "$APK" | grep -F 'classes.dex'
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-v0-83-2-orientation-fullres-advanced-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
