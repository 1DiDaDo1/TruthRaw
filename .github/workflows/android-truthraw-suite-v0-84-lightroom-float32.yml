name: TruthRaw v0.84 Lightroom Float32 Output

on:
  push:
    branches:
      - integration/truthraw-suite-v0-84-lightroom-float32-output-authority
    paths:
      - 'suite_android/**'
      - 'docs/research/scientific-master-linear-dng-projection-v0.1/**'
      - '.github/workflows/android-truthraw-suite-v0-84-lightroom-float32.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify Float32 Lightroom contracts
        run: |
          set -euo pipefail
          JAVA='suite_android/app/src/main/java/com/truthraw/adaptiveui'
          CPP='suite_android/app/src/main/cpp'
          DNG='docs/research/scientific-master-linear-dng-projection-v0.1/native'

          grep -F 'JPGL_RAW_EDIT' "$JAVA/PureFloat32DngExport.kt"
          grep -F 'image/x-adobe-dng' "$JAVA/MainActivity.kt"
          grep -F 'truthraw_jpgl_raw_edit_v0_3.dng' "$JAVA/MainActivity.kt"
          grep -F 'embedded JPEG preview' "$JAVA/MainActivity.kt"
          grep -F 'TRUTHRAW_JPGL_RAW_EDIT_FLOAT32_XYZ_D50_LINEAR_DNG' "$CPP/pure_float32_dng_export_bridge.cpp"
          grep -F 'appearance_baked_into_primary=0' "$CPP/pure_float32_dng_export_bridge.cpp"
          grep -F 'jpegPreviewBytes' "$DNG/scientific_master_linear_dng_projection_v0_1.h"
          grep -F 'preview_role=NON_AUTHORITY_RENDERED_PREVIEW' "$DNG/scientific_master_linear_dng_projection_v0_1.cpp"
          grep -F 'kTagStripByteCounts' "$DNG/scientific_master_linear_dng_projection_v0_1.cpp"
          grep -F 'SampleFormat' "$DNG/scientific_master_linear_dng_projection_v0_1.cpp"

          # Old production JPG-L architecture must no longer be launched.
          if grep -F 'truthraw_layered_v0_2.jpg' "$JAVA/MainActivity.kt"; then
            echo 'Legacy JPEG-primary JPG-L is still in production UI' >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          readelf -Ws /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_PureFloat32DngNativeBridge_exportPureFloat32Dng'
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-v0-84-lightroom-float32-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
