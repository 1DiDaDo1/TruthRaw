name: Android Scientific Master Linear DNG v0.1

on:
  push:
    branches:
      - research/android-scientific-master-linear-dng-v0.1-2026-09-12
    paths:
      - 'app/android/truthraw-adaptive-ui-v01/**'
      - 'docs/research/scientific-master-linear-dng-projection-v0.1/**'
      - 'docs/research/finalized-scientific-preview-release-v0.2/**'
      - 'docs/research/scientific-master-streaming-binding-v0.2/**'
      - 'docs/research/scientific-master-digest-v0.1/**'
      - 'docs/research/scientific-preview-source-binding-v0.1/**'
      - 'docs/research/scientific-preview-source-binding-v0.2/**'
      - 'docs/research/dng-color-binding-producer-v0.1/**'
      - 'docs/research/dng-color-binding-producer-v0.2/**'
      - 'docs/research/tile-native-dng-source-v0.1/**'
      - 'docs/research/full-frame-streaming-v0.1/native/**'
      - 'docs/research/reconstructed-color-preview-v0.1/**'
      - 'docs/research/technical-backplane-v0.1/**'
      - 'docs/research/technical-backplane-phase2-v0.1/**'
      - 'docs/research/truthrange-latent-binding-v0.2/**'
      - 'canonical/reconstruction/v4.7i/native/**'
      - '.github/workflows/android-scientific-master-linear-dng-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-linear-dng-and-science:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Scientific Master Linear DNG module
        run: |
          cmake -S docs/research/scientific-master-linear-dng-projection-v0.1 -B /tmp/truthraw-linear-dng -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/truthraw-linear-dng --parallel 2
          ctest --test-dir /tmp/truthraw-linear-dng --output-on-failure
      - name: Revalidate Scientific Master streaming v0.2
        run: |
          cmake -S docs/research/scientific-master-streaming-binding-v0.2 -B /tmp/truthraw-sm-v02 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/truthraw-sm-v02 --parallel 2
          ctest --test-dir /tmp/truthraw-sm-v02 --output-on-failure
      - name: Revalidate finalized release v0.2
        run: |
          cmake -S docs/research/finalized-scientific-preview-release-v0.2 -B /tmp/truthraw-release-v02 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/truthraw-release-v02 --parallel 2
          ctest --test-dir /tmp/truthraw-release-v02 --output-on-failure

  build-arm64-apk:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify downstream-only export contract
        shell: bash
        run: |
          BRIDGE='app/android/truthraw-adaptive-ui-v01/app/src/main/cpp/scientific_master_linear_dng_bridge.cpp'
          grep -F 'write_xyz_d50_linear_dng_projection' "$BRIDGE"
          grep -F 'sourceSeal.sha256' "$BRIDGE"
          grep -F 'release.scientificIdentity.scientificMasterHash' "$BRIDGE"
          grep -F 'projection.scientificMasterIdentityVerified' "$BRIDGE"
          grep -F 'projection.physicalFrameCount != 1u' "$BRIDGE"
          grep -F 'LINEAR_DNG_XYZ_D50_COMPATIBILITY_PROJECTION' 'app/android/truthraw-adaptive-ui-v01/app/src/main/java/com/truthraw/adaptiveui/ScientificDngExportActivity.kt'
          if grep -Eiq '(^|[^A-Za-z])(vulkan|libvulkan|Vk[A-Z])' 'app/android/truthraw-adaptive-ui-v01/app/src/main/cpp/CMakeLists.txt'; then
            echo 'Unexpected TruthRaw Vulkan dependency' >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK/NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'cmake;3.22.1' \
            'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: app/android/truthraw-adaptive-ui-v01
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify native symbols and artifact
        shell: bash
        run: |
          APK='app/android/truthraw-adaptive-ui-v01/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          test -s /tmp/libtruthraw_ui_preview_bridge.so
          strings /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_NativeScientificDngBridge_exportFinalizedScientificMasterLinearDng'
          strings /tmp/libtruthraw_ui_preview_bridge.so | grep -F 'Java_com_truthraw_adaptiveui_NativeTilePreviewBridge_buildFinalizedScientificColorPreview'
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/libtruthraw_ui_preview_bridge.so'; then
            echo 'Unexpected non-arm64 ABI' >&2
            exit 1
          fi
          echo "apk_bytes=$(stat -f%z "$APK")"
          echo "apk_sha256=$(shasum -a 256 "$APK" | awk '{print $1}')"
          echo 'dng_role=LINEAR_DNG_XYZ_D50_COMPATIBILITY_PROJECTION'
          echo 'scientific_authority_from_export=NONE'
          echo 'output=float32_XYZ_D50_LinearRaw'

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-scientific-linear-dng-v0.1-debug-arm64
          path: app/android/truthraw-adaptive-ui-v01/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
