name: D.RAW Geometry Capture APK v0.1

on:
  pull_request:
    paths:
      - 'capture/android/draw-geometry-capture-v01/**'
      - '.github/workflows/draw-geometry-capture-apk-v01.yml'
  push:
    branches: [main]
    paths:
      - 'capture/android/draw-geometry-capture-v01/**'
      - '.github/workflows/draw-geometry-capture-apk-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="$ANDROID_HOME"
          if [ -z "$SDKROOT" ]; then SDKROOT=/usr/local/lib/android/sdk; fi
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDKROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: |
          set -euo pipefail
          gradle --no-daemon -p capture/android/draw-geometry-capture-v01 :app:assembleDebug

      - name: Verify APK and calculate SHA-256
        run: |
          set -euo pipefail
          APK=capture/android/draw-geometry-capture-v01/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: DRAW_Geometry_Capture_v0.1_debug
          path: |
            capture/android/draw-geometry-capture-v01/app/build/outputs/apk/debug/app-debug.apk
            capture/android/draw-geometry-capture-v01/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
