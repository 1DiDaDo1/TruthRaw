name: TruthRaw FotoGraaf v0.30 Vendor Route Full-Factorial Matrix

# 16-run, 2-level, 4-factor Camera-5 route/topology screen.
# Low = key UNSET; high = numeric 1 with the already device-resolved native type.
# The v0.20 source/payload chain remains the unchanged acquisition authority beneath every run.
on:
  push:
    branches:
      - integration/truthraw-suite-v0-30-vendor-route-full-factorial-matrix
    paths:
      - 'suite_android/**'
      - 'tools/patch_fotograaf_v012_forced_physical_max.py'
      - 'tools/patch_fotograaf_v013_physical_only_max_submit.py'
      - 'tools/patch_fotograaf_v014_seal_raw_before_result_mode_gate.py'
      - 'tools/patch_fotograaf_v016_hal_buffer_envelope.py'
      - 'tools/patch_fotograaf_v017_pre_hal_airlock.py'
      - 'tools/patch_fotograaf_v019_full_raster_write_audit.py'
      - 'tools/patch_fotograaf_v020_payload_geometry_decoder.py'
      - 'tools/patch_fotograaf_v030_vendor_route_full_factorial_matrix.py'
      - 'tools/patch_fotograaf_v030b_vendor_route_full_factorial_matrix.py'
      - '.github/workflows/android-truthraw-suite-v0-30-vendor-route-full-factorial-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v030:
    name: Build FotoGraaf v0.30 vendor route full-factorial matrix arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v0.20 and attach corrected controlled 16-run full-factorial matrix
        run: |
          python3 tools/patch_fotograaf_v030b_vendor_route_full_factorial_matrix.py
          APP='suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt'
          MATRIX='suite_android/app/src/main/java/com/truthraw/adaptiveui/Camera2VendorRouteFullFactorialMatrix.kt'
          PRE='suite_android/app/src/main/java/com/truthraw/adaptiveui/Camera2PreHalGate.kt'
          POST='suite_android/app/src/main/java/com/truthraw/adaptiveui/Camera2EnvelopeProbe.kt'
          AUDIT='suite_android/app/src/main/java/com/truthraw/adaptiveui/RawSensorRasterAudit.kt'
          GEOM='suite_android/app/src/main/java/com/truthraw/adaptiveui/RawPayloadGeometryDecoder.kt'
          NATIVE='suite_android/app/src/main/cpp/hardware_buffer_envelope_probe.cpp'

          grep -F 'TruthRaw · 200MP Tele Test v0.30 · Camera-5 vendor route full-factorial matrix' "$APP"
          grep -F 'Camera2PreHalGate.observeSession(' "$APP"
          grep -F 'Camera2VendorRouteFullFactorialMatrix.applyProfile(' "$APP"
          grep -F 'FULL_FACTORIAL_2_LEVEL_4_FACTOR_16_RUN_COMPLEMENT_PAIRED' "$APP"
          grep -F 'UNSET_NO_WRITE' "$APP"
          grep -F 'vendorRouteFullFactorialMatrix' "$APP"
          grep -F 'persistOriginalRawBuffer(image, stamp)' "$APP"
          grep -F 'Camera2EnvelopeProbe.observe(image, physical, physicalResult)' "$APP"
          grep -F 'RawSensorRasterAudit.audit(' "$APP"
          grep -F 'RawPayloadGeometryDecoder.decode(' "$APP"

          grep -F 'const val TOTAL_RUNS = 16' "$MATRIX"
          grep -F '0b0000, 0b1111' "$MATRIX"
          grep -F '0b0101, 0b1010' "$MATRIX"
          grep -F '0b0011, 0b1100' "$MATRIX"
          grep -F '0b0110, 0b1001' "$MATRIX"
          grep -F '0b0001, 0b1110' "$MATRIX"
          grep -F '0b0010, 0b1101' "$MATRIX"
          grep -F '0b0100, 0b1011' "$MATRIX"
          grep -F '0b1000, 0b0111' "$MATRIX"
          grep -F 'org.codeaurora.qcamera3.sessionParameters.EnableIdealRAW' "$MATRIX"
          grep -F 'org.codeaurora.qcamera3.sessionParameters.RawCbSourceType' "$MATRIX"
          grep -F 'org.codeaurora.qcamera3.sessionParameters.EnableXCFAOptimization' "$MATRIX"
          grep -F 'org.codeaurora.qcamera3.sessionParameters.HALOutputBufferCombined' "$MATRIX"
          grep -F '0x801F0027' "$MATRIX"
          grep -F '0x801F0009' "$MATRIX"
          grep -F '0x801F0036' "$MATRIX"
          grep -F '0x801F0034' "$MATRIX"
          grep -F 'CaptureRequest.Key(KEY_IDEAL, Byte::class.javaObjectType)' "$MATRIX"
          grep -F 'CaptureRequest.Key(KEY_RAWCB, Int::class.javaObjectType)' "$MATRIX"
          grep -F 'CaptureRequest.Key(KEY_XCFA, Byte::class.javaObjectType)' "$MATRIX"
          grep -F 'CaptureRequest.Key(KEY_HAL_COMBINED, Int::class.javaObjectType)' "$MATRIX"
          grep -F 'profile.mask == 0' "$MATRIX"
          grep -F 'FULL_FACTORIAL_CONTROL__ALL_FOUR_VENDOR_KEYS_UNSET' "$MATRIX"
          grep -F 'config.setSessionParameters(request)' "$MATRIX"
          grep -F 'allCombinationsCoveredExactlyOnce' "$MATRIX"
          grep -F 'semanticPromotionAllowed' "$MATRIX"
          ! grep -F 'EnableInsensorZoom' "$MATRIX"
          ! grep -F 'EnableSnapshotOnlyInsensorZoom' "$MATRIX"
          ! grep -F 'EnableMCXMasterCb' "$MATRIX"

          grep -F 'vendorKeysWritten", false' "$PRE"
          grep -F 'hardwareBufferLocked' "$POST"
          grep -F 'ONLY_FIRST_768_ROWS_NONZERO__EXACT_12P5MP_BYTE_PAYLOAD_SIGNATURE' "$AUDIT"
          grep -F 'EXACT_PAYLOAD_BYTE_COUNT_MATCH_TO_SINGLE_ADVERTISED_STANDARD_RAW_SENSOR_SIZE' "$GEOM"
          grep -F 'AHardwareBuffer_describe' "$NATIVE"
          ! grep -F 'AHardwareBuffer_lock(' "$NATIVE"
          ! grep -F 'AHardwareBuffer_lockAndGetInfo(' "$NATIVE"
          ! grep -F 'MAXIMUM_RESOLUTION vereist' "$APP"

          python3 - <<'PY'
          from pathlib import Path
          import re

          s = Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt').read_text()
          m = Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/Camera2VendorRouteFullFactorialMatrix.kt').read_text()

          assert s.index('Camera2PreHalGate.observeSession(') < s.index('Camera2VendorRouteFullFactorialMatrix.applyProfile(')
          assert s.index('Camera2VendorRouteFullFactorialMatrix.applyProfile(') < s.index('device.isSessionConfigurationSupported(config)')
          assert s.index('persistOriginalRawBuffer(image, stamp)') < s.index('Camera2EnvelopeProbe.observe(image, physical, physicalResult)')
          assert s.index('RawSensorRasterAudit.audit(') < s.index('RawPayloadGeometryDecoder.decode(')
          assert s.count('Camera2VendorRouteFullFactorialMatrix.applyProfile(') == 1

          order_block = m.split('private val runOrder = intArrayOf(', 1)[1].split(')', 1)[0]
          masks = [int(x, 2) for x in re.findall(r'0b([01]{4})', order_block)]
          assert len(masks) == 16, masks
          assert sorted(masks) == list(range(16)), masks
          for i in range(0, 16, 2):
              assert masks[i] ^ masks[i + 1] == 0b1111, (masks[i], masks[i + 1])
          print('v0.30 ordering, full-factorial completeness and complement pairing PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package and native bridge
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          test -s /tmp/libtruthraw_ui_preview_bridge.so
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/libtruthraw_ui_preview_bridge.so'; then
            echo 'Unexpected non-arm64 TruthRaw native ABI' >&2
            exit 1
          fi
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-main-plus-fotograaf-v0-30-vendor-route-full-factorial-matrix-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
