name: TruthRaw v0.71 Open Scene TRR Role Mask Embed

on:
  push:
    branches:
      - integration/truthraw-suite-v0-71-open-scene-trr-rolemask-embed
    paths:
      - 'suite_android/**'
      - 'docs/research/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/android-truthraw-suite-v0-71-open-scene-trr-rolemask-embed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-pure-float32:
    name: Host PURE Float32 writer
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure PURE writer
        run: cmake -S docs/research/scientific-master-linear-dng-projection-v0.1 -B build/pure-f32 -DCMAKE_BUILD_TYPE=Release
      - name: Build PURE writer
        run: cmake --build build/pure-f32 --parallel 2
      - name: Run PURE writer tests
        run: ctest --test-dir build/pure-f32 --output-on-failure

  scientific-contracts:
    name: Open Scene Dynamic Authority Restoration contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run scientific contract tests
        run: |
          python3 tests/test_truthnegative_foundation_v01.py
          python3 tests/test_truthnegative_existing_house_binding_v02.py
          python3 tests/test_open_world_foundations_v01.py
          python3 tests/test_open_world_integration_v03.py
          python3 tests/test_open_world_dynamic_authority_v05.py
          python3 tests/test_open_world_dynamic_runtime_v06.py
          python3 tests/test_open_scene_region_runtime_v07.py
          python3 tests/test_open_scene_state_stream_v08.py
          python3 tests/test_restoration_authority_v01.py

  android-v071:
    name: Android v0.71 Open Scene TRR role-mask embed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify v0.71 integration guards
        run: |
          G='suite_android/app/build.gradle.kts'
          ADV='suite_android/app/src/main/cpp/advanced_preview_bridge.cpp'
          ADVK='suite_android/app/src/main/java/com/truthraw/adaptiveui/TruthRawAdvanced.kt'
          TRR='suite_android/app/src/main/cpp/fullres_restoration_export_bridge.cpp'
          TRRK='suite_android/app/src/main/java/com/truthraw/adaptiveui/FullResRestorationExport.kt'
          PJ='suite_android/app/src/main/cpp/restoration_projection_bridge.cpp'
          PJK='suite_android/app/src/main/java/com/truthraw/adaptiveui/RestorationProjectionExport.kt'
          OSC='suite_android/app/src/main/cpp/open_scene_canonical_v0_70.cpp'
          DNGH='docs/research/scientific-master-linear-dng-projection-v0.1/native/scientific_master_linear_dng_projection_v0_1.h'
          DNGC='docs/research/scientific-master-linear-dng-projection-v0.1/native/scientific_master_linear_dng_projection_v0_1.cpp'

          grep -F '0.36-v0.71-open-scene-trr-rolemask-embed' "$G"

          # PURE v0.63 remains the frozen base route.
          grep -F 'private_contract=TRUTHRAW_PURE_SELF_BINDING_V0_63' "$DNGC"
          grep -F 'const std::string derivativeExtra = derivative' "$DNGC"

          # One shared canonical builder is available from the sealed RAW source.
          grep -F 'bool build_from_source' "$OSC"
          grep -F 'CANONICAL_OPEN_SCENE' "$ADV" || true
          grep -F 'canonical_scene::build_from_source' "$ADV"
          grep -F 'canonicalOpenSceneArtifactSha256' "$ADVK"

          # TRR itself now carries canonical Open Scene + exact role-mask identities.
          grep -F 'TRUTHRAW_TRR_CANONICAL_OPEN_SCENE_ROLEMASK_V0_71' "$TRR"
          grep -F 'open_scene_artifact_sha256=' "$TRR"
          grep -F 'restoration_role_mask_sha256=' "$TRR"
          grep -F 'roleMaskHasher.update' "$TRR"
          grep -F 'binding_extension=TRUTHRAW_TRR_CANONICAL_OPEN_SCENE_ROLEMASK_V0_71' "$TRRK"

          # Projection refuses old/unbound TRR and requires source-recomputed Open Scene equality.
          grep -F 'TRUTHRAW_TRR_CANONICAL_OPEN_SCENE_ROLEMASK_V0_71' "$PJ"
          grep -F 'openScene.artifactSha256!=trr.meta().openSceneArtifactHash' "$PJ"
          grep -F 'roleHash_!=meta_.declaredRoleMaskHash' "$PJ"

          # Full role-mask bytes, not only a digest, are carried by every normal projection.
          grep -F 'restorationRoleMaskBytes' "$DNGH"
          grep -F 'TRUTHRAW_ROLE_MASK_BINARY_V1' "$DNGC"
          grep -F 'restoration_role_mask_embedded=1' "$DNGC"
          grep -F 'add(65000,BYTE' "$PJ"
          grep -F 'TR_ROLE' "$PJ"
          grep -F 'hasClassicTiffTag(prefix, 65000)' "$PJK"
          grep -F 'TRUTHRAW_ROLE_MASK_BINARY_V1' "$PJK"
          grep -F 'text.contains("TR_ROLE")' "$PJK"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK and NDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F "classes.dex"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libtruthraw_ui_preview_bridge.so"
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"
      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-v0-71-open-scene-trr-rolemask-embed-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
