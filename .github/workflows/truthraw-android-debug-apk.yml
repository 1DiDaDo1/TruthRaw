name: truthraw-android-debug-apk

on:
  push:
    branches:
      - research/open-world-foundations-v01
    paths:
      - 'android/**'
      - '.github/workflows/truthraw-android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install stable CI debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode android/ci-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          sha256sum "$HOME/.android/debug.keystore"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle -p android --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Hash APK and canonical ZIP payload
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum "$APK" | tee "$APK.sha256"
          PAYLOAD_SHA=$(python android/tools/apk_payload_digest.py "$APK")
          printf '%s  %s\n' "$PAYLOAD_SHA" "$APK" | tee "$APK.payload.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: truthraw-debug-apk-v0.3
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/app-debug.apk.payload.sha256
          if-no-files-found: error
          retention-days: 30
