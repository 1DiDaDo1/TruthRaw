name: Refresh 44489 LinearizationTable Runtime v0.1

on:
  pull_request:
    paths:
      - '.github/scripts/refresh_44489_linearization_runtime_v01.py'
      - '.github/workflows/refresh-44489-linearization-runtime-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-capsule:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-capability-linearization-table-runtime-diagnostic-v01
          fetch-depth: 0

      - name: Apply unique-marker capsule refresh
        run: python3 .github/scripts/refresh_44489_linearization_runtime_v01.py

      - name: Verify only canonical capsule changed
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = 'docs/handoff/DRAW_44489_KNOWLEDGE_CAPSULE.md'
          git diff --check
          grep -F 'exact validated code/workflow head `d0e2ed9921662c1bce9324115705989e8dee99d4`' docs/handoff/DRAW_44489_KNOWLEDGE_CAPSULE.md >/dev/null
          test "$(grep -F '<!-- 44489_LINEARIZATION_TABLE_V01_START -->' docs/handoff/DRAW_44489_KNOWLEDGE_CAPSULE.md | wc -l)" -eq 1
          test "$(grep -F '<!-- 44489_LINEARIZATION_TABLE_V01_END -->' docs/handoff/DRAW_44489_KNOWLEDGE_CAPSULE.md | wc -l)" -eq 1

      - name: Commit canonical capsule refresh
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/handoff/DRAW_44489_KNOWLEDGE_CAPSULE.md
          git commit -m 'Refresh 44489 LinearizationTable runtime checkpoint'
          git push origin HEAD:feat/source-capability-linearization-table-runtime-diagnostic-v01
