name: 44489 Post-Schema Migration Refresh

on:
  push:
    branches:
      - feat/draw-observation-evidence-architecture-v01
    paths:
      - '.github/workflows/refresh-44489-post-schema-v01.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/draw-observation-evidence-architecture-v01
          fetch-depth: 0

      - name: Refresh canonical 44489 capsule
        run: python3 tools/refresh_44489_post_schema_migration_v01.py

      - name: Verify capsule checkpoint
        run: |
          set -euo pipefail
          git diff --check
          FILE='docs/handoff/DRAW_44489_KNOWLEDGE_CAPSULE.md'
          grep -F 'PR **#132 — Architecture: separate runtime Source Capability evidence-envelope schema v0.1**' "$FILE"
          grep -F 'e0527b374d6477a0b239125f7aa8d3f8750c5d32' "$FILE"
          grep -F 'D.RAW/SourceCapabilityRuntimeEvidenceEnvelope/0.1' "$FILE"
          grep -F 'runtime-envelope exposure is now the next narrow diagnostic step' "$FILE"

      - name: Commit refreshed capsule
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/handoff/DRAW_44489_KNOWLEDGE_CAPSULE.md
          git diff --cached --quiet && { echo 'No capsule changes to commit'; exit 1; }
          git commit -m 'Advance 44489 through runtime schema separation v0.1'
          git push origin HEAD:feat/draw-observation-evidence-architecture-v01
