name: TruthRaw v0.46 Honor Capability Route Oracle

on:
  push:
    branches:
      - integration/truthraw-suite-v0-46-honor-capability-route-oracle
    paths:
      - 'suite_android/app/src/main/AndroidManifest.xml'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/HonorCapabilityRouteOracleActivity.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/TruthRawSuiteLauncherActivity.kt'
      - 'docs/HONOR_V046_CAPABILITY_ROUTE_ORACLE_PLAN_2026-09-19.md'
      - 'state/HONOR_V046_CAPABILITY_ROUTE_ORACLE_PLAN_2026-09-19.json'
      - '.github/workflows/android-truthraw-suite-v0-46-honor-capability-route-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v046:
    name: Build v0.46 Honor capability route oracle arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify v0.46 authority and invariants
        run: |
          ACT='suite_android/app/src/main/java/com/truthraw/adaptiveui/HonorCapabilityRouteOracleActivity.kt'
          PLAN='state/HONOR_V046_CAPABILITY_ROUTE_ORACLE_PLAN_2026-09-19.json'

          grep -F 'truthraw.honor-capability-route-oracle.v0.46' "$ACT"
          grep -F 'CAMERA2_CHARACTERISTICS_OBSERVATION_ONLY' "$ACT"
          grep -F 'physicalCameraScene' "$ACT"
          grep -F 'sceneCameraIdCapability' "$ACT"
          grep -F 'cameraIdCustomInfo' "$ACT"
          grep -F 'needOpenPhysicalCamera' "$ACT"
          grep -F 'ultraResolutionSwitchSupportedSize' "$ACT"
          grep -F 'uiSceneAndProcessorSceneNamespacesMustNotBeEquated' "$ACT"
          grep -F '"expectedSdkInt": 36' "$PLAN"

          python3 - <<'PY'
          from pathlib import Path
          s=Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/HonorCapabilityRouteOracleActivity.kt').read_text()

          required = [
              'getCameraCharacteristics(',
              '.physicalCameraIds',
              'CameraCharacteristics.LENS_INFO_AVAILABLE_FOCAL_LENGTHS',
              'CAMERA2_CHARACTERISTICS_OBSERVATION_ONLY',
              'STATIC_APK_TARGET_SELECTION_ONLY',
              'pipeline4rawmfultrahighpixelcap.json',
              'listOf(23, 24, 32, 33)',
          ]
          for token in required:
              assert token in s, token

          forbidden = [
              'openCamera(',
              'createCaptureRequest',
              'ImageReader',
              'bindService(',
              'setPhysicalCameraKey',
              'CameraCaptureSession',
              'capture(',
          ]
          for token in forbidden:
              assert token not in s, token

          print('v0.46 characteristics-only invariants PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          test -s /tmp/libtruthraw_ui_preview_bridge.so
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-v0-46-honor-capability-route-oracle-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
