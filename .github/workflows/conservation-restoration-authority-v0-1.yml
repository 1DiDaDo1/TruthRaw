name: conservation-restoration-authority-v0-1

on:
  push:
    paths:
      - 'tools/restoration_authority_v01.py'
      - 'tests/test_restoration_authority_v01.py'
      - 'docs/research/conservation-restoration-authority-v0.1/**'
      - '.github/workflows/conservation-restoration-authority-v0-1.yml'
  pull_request:
    paths:
      - 'tools/restoration_authority_v01.py'
      - 'tests/test_restoration_authority_v01.py'
      - 'docs/research/conservation-restoration-authority-v0.1/**'
      - '.github/workflows/conservation-restoration-authority-v0-1.yml'

jobs:
  restoration-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run restoration authority tests
        run: python -m unittest -v tests.test_restoration_authority_v01
