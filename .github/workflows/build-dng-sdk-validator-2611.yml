name: Build DNG SDK validator 2611

on:
  push:
    branches:
      - tooling/dng-sdk-validator-2611
  workflow_dispatch:

jobs:
  build-validator:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TruthRaw tooling branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build g++ pkg-config cmake zlib1g-dev libexpat1-dev libjpeg-dev libbrotli-dev libhwy-dev liblcms2-dev

      - name: Build pinned libjxl dependency
        run: |
          git clone --branch v0.11.1 --depth 1 --recursive https://github.com/libjxl/libjxl.git libjxl-0.11.1
          cmake -S libjxl-0.11.1 -B libjxl-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DBUILD_TESTING=OFF \
            -DJPEGXL_ENABLE_TOOLS=OFF \
            -DJPEGXL_ENABLE_DEVTOOLS=OFF \
            -DJPEGXL_ENABLE_EXAMPLES=OFF \
            -DJPEGXL_ENABLE_BENCHMARK=OFF \
            -DJPEGXL_ENABLE_DOXYGEN=OFF \
            -DJPEGXL_ENABLE_MANPAGES=OFF \
            -DJPEGXL_ENABLE_JPEGLI=OFF
          cmake --build libjxl-build --parallel 2
          cmake --install libjxl-build
          export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:$PKG_CONFIG_PATH"
          pkg-config --modversion libjxl | tee LIBJXL_VERSION.txt
          test "$(pkg-config --modversion libjxl)" = "0.11.1"

      - name: Fetch pinned DNG SDK mirror revision
        run: |
          git clone https://github.com/hfiguiere/dng_sdk.git dng-sdk-mirror
          cd dng-sdk-mirror
          git checkout --detach 11e5eb4259c2a7ad92d66e152e4974441d2e226a
          test "$(git rev-parse HEAD)" = "11e5eb4259c2a7ad92d66e152e4974441d2e226a"
          git rev-parse HEAD | tee ../DNG_SDK_MIRROR_COMMIT.txt

      - name: Build dng_validate
        env:
          PKG_CONFIG_PATH: /home/runner/.local/lib/pkgconfig
          LD_LIBRARY_PATH: /home/runner/.local/lib
        run: |
          cd dng-sdk-mirror
          meson setup _build
          meson compile -C _build
          test -x _build/dng_sdk/source/dng_validate
          _build/dng_sdk/source/dng_validate 2>&1 | head -80 || true

      - name: Record binary provenance
        env:
          LD_LIBRARY_PATH: /home/runner/.local/lib
        run: |
          mkdir -p validator-artifact/lib
          cp dng-sdk-mirror/_build/dng_sdk/source/dng_validate validator-artifact/
          cp DNG_SDK_MIRROR_COMMIT.txt validator-artifact/
          cp LIBJXL_VERSION.txt validator-artifact/
          cp "$HOME"/.local/lib/libjxl*.so* validator-artifact/lib/ || true
          cp "$HOME"/.local/lib/libbrotli*.so* validator-artifact/lib/ || true
          sha256sum validator-artifact/dng_validate | tee validator-artifact/SHA256SUMS.txt
          LD_LIBRARY_PATH="$HOME/.local/lib" ldd validator-artifact/dng_validate | tee validator-artifact/LDD.txt
          cat > validator-artifact/PROVENANCE.txt <<'EOF'
          Purpose: temporary independent validation tool for TruthRaw LinearRaw DNG v0.4
          DNG SDK mirror: https://github.com/hfiguiere/dng_sdk
          Pinned DNG SDK commit: 11e5eb4259c2a7ad92d66e152e4974441d2e226a
          Commit message at pin: Update to DNG SDK 1.7.1 2611
          libjxl dependency: official libjxl tag v0.11.1
          This artifact is a mirror-built validator, not an Adobe-signed binary.
          EOF

      - name: Upload dng_validate artifact
        uses: actions/upload-artifact@v4
        with:
          name: dng-validate-sdk-1.7.1-2611-linux
          path: validator-artifact/
          if-no-files-found: error
          retention-days: 7
