name: TruthRaw v0.69 Crash-safe Physical-5 session matrix

on:
  workflow_dispatch:
  push:
    branches:
      - test/physical5-session-acceptance-matrix-v069
    paths:
      - 'suite_android/app/src/main/AndroidManifest.xml'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/Physical5CrashSafeSessionAcceptanceMatrixActivity.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/TruthRawSettingsActivity.kt'
      - '.github/workflows/android-truthraw-v069-crash-safe-matrix.yml'

permissions:
  contents: read

jobs:
  build-v069:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify crash-safe/no-capture invariants
        run: |
          set -euo pipefail
          SRC='suite_android/app/src/main/java/com/truthraw/adaptiveui/Physical5CrashSafeSessionAcceptanceMatrixActivity.kt'
          grep -F 'truthraw.physical5-session-acceptance-matrix.v0.69' "$SRC"
          grep -F 'checkpointedBeforeEachHalTouch", true' "$SRC"
          grep -F 'cameraDeviceCallbackExecutorKeptAliveUntilDeviceClosed", true' "$SRC"
          grep -F 'writeCheckpoint(checkpoint)' "$SRC"
          grep -F 'onClosed(camera: CameraDevice)' "$SRC"
          grep -F 'captureSubmittedByTruthRaw", false' "$SRC"
          grep -F 'repeatingRequestSubmittedByTruthRaw", false' "$SRC"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/Physical5CrashSafeSessionAcceptanceMatrixActivity.kt').read_text()
          forbidden=[
              'ImageReader.newInstance',
              '.capture(',
              'setRepeatingRequest',
              'captureBurst',
              'setRepeatingBurst',
              'DngCreator(',
              'bindService(',
          ]
          for token in forbidden:
              assert token not in s, token
          print('v0.69 crash-safe/no-capture invariants PASS')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-v069-crash-safe-physical5-session-matrix-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
