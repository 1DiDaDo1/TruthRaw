name: Technical Backplane v0.1 Integrity

on:
  push:
    paths:
      - 'docs/research/technical-backplane-v0.1/**'
      - '.github/workflows/technical-backplane-v0-1-integrity.yml'
  pull_request:
    paths:
      - 'docs/research/technical-backplane-v0.1/**'
      - '.github/workflows/technical-backplane-v0-1-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backplane:
    strategy:
      fail-fast: false
      matrix:
        mode: [gcc-release, clang-release, clang-asan-ubsan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify sealed module
        run: python3 docs/research/technical-backplane-v0.1/tools/verify_integrity_v0_1.py
      - name: GCC Release
        if: matrix.mode == 'gcc-release'
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Werror \
            docs/research/technical-backplane-v0.1/native/technical_backplane_v0_1.cpp \
            docs/research/technical-backplane-v0.1/tests/test_technical_backplane_v0_1.cpp \
            -I docs/research/technical-backplane-v0.1/native -o /tmp/tbp_gcc
          /tmp/tbp_gcc
      - name: Clang Release
        if: matrix.mode == 'clang-release'
        run: |
          clang++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Werror \
            docs/research/technical-backplane-v0.1/native/technical_backplane_v0_1.cpp \
            docs/research/technical-backplane-v0.1/tests/test_technical_backplane_v0_1.cpp \
            -I docs/research/technical-backplane-v0.1/native -o /tmp/tbp_clang
          /tmp/tbp_clang
      - name: Clang ASan UBSan
        if: matrix.mode == 'clang-asan-ubsan'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          clang++ -std=c++20 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            docs/research/technical-backplane-v0.1/native/technical_backplane_v0_1.cpp \
            docs/research/technical-backplane-v0.1/tests/test_technical_backplane_v0_1.cpp \
            -I docs/research/technical-backplane-v0.1/native \
            -fsanitize=address,undefined -o /tmp/tbp_san
          /tmp/tbp_san
