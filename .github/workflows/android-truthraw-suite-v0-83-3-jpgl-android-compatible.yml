name: TruthRaw Suite v0.83.3 JPG-L Android Compatible

on:
  push:
    branches:
      - integration/truthraw-suite-v0-83-3-jpgl-android-compatible
    paths:
      - 'suite_android/**'
      - '.github/workflows/android-truthraw-suite-v0-83-3-jpgl-android-compatible.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-suite:
    name: Build v0.83.3 JPG-L Android-compatible arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify JPG-L Android compatibility contract
        run: |
          set -euo pipefail
          JAVA='suite_android/app/src/main/java/com/truthraw/adaptiveui'
          grep -F 'type = "image/jpeg"' "$JAVA/MainActivity.kt"
          grep -F 'truthraw_layered_v0_2.jpg' "$JAVA/MainActivity.kt"
          grep -F 'magic=TRUTHRAW_JPGL_MANIFEST_V0_2' "$JAVA/JpgLExport.kt"
          grep -F 'container_role=JPEG_COMPATIBLE_LAYERED_PHOTOGRAPH' "$JAVA/JpgLExport.kt"
          grep -F 'external_mime=image/jpeg' "$JAVA/JpgLExport.kt"
          grep -F 'recommended_extension=.jpg' "$JAVA/JpgLExport.kt"
          grep -F 'legacy_extension=.jpgl' "$JAVA/JpgLExport.kt"
          grep -F 'TRJPGL01' "$JAVA/JpgLExport.kt"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-v0-83-3-jpgl-android-compatible-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
