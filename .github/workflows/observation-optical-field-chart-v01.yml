name: Observation Optical Field Chart v0.1 Integrity

on:
  pull_request:
    paths:
      - 'docs/research/observation-optical-field-chart-v0.1/**'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/ObservationOpticalFieldChartV01.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/BacksideSignalSupportAudit.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/UniversalSourceProfiler.kt'
      - 'state/OBSERVATION_OPTICAL_FIELD_CHART_STATE_2026-09-29.json'
      - 'tools/check_observation_optical_field_chart_v01.py'
      - '.github/workflows/observation-optical-field-chart-v01.yml'
  push:
    branches:
      - 'research/observation-optical-field-chart-v01-2026-09-29'

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_observation_optical_field_chart_v01.py
