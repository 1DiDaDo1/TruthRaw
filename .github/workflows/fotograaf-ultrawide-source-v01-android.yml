name: D.RAW FotoGraaf Ultra-Wide Source v0.1 Android

on:
  pull_request:
    paths:
      - 'capture/android/fotograaf-ultrawide-source-v01/**'
      - '.github/workflows/fotograaf-ultrawide-source-v01-android.yml'
  push:
    branches: [main]
    paths:
      - 'capture/android/fotograaf-ultrawide-source-v01/**'
      - '.github/workflows/fotograaf-ultrawide-source-v01-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon -p capture/android/fotograaf-ultrawide-source-v01 :app:assembleDebug
      - name: SHA-256
        run: |
          sha256sum capture/android/fotograaf-ultrawide-source-v01/app/build/outputs/apk/debug/app-debug.apk |
            tee capture/android/fotograaf-ultrawide-source-v01/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DRAW_FotoGraaf_UltraWide_Source_v0.1_debug
          path: |
            capture/android/fotograaf-ultrawide-source-v01/app/build/outputs/apk/debug/app-debug.apk
            capture/android/fotograaf-ultrawide-source-v01/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
