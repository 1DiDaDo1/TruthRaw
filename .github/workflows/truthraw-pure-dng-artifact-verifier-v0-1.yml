name: TruthRaw PURE DNG Artifact Verifier v0.1

on:
  pull_request:
  push:
    branches:
      - 'research/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run PURE artifact verifier unit tests
        run: python3 -m unittest -v tests/test_verify_truthraw_pure_dng_artifact_v0_1.py
