name: HDR Authority v0.83

on:
  push:
    branches:
      - integration/truthraw-suite-v0-83-authority-aware-hdr
    paths:
      - 'suite_android/app/src/main/cpp/hdr_authority_v0_83.*'
      - 'docs/research/hdr-authority-v0.83/**'
      - '.github/workflows/hdr-authority-v0-83.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority:
    name: ${{ matrix.compiler }} HDR authority
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S docs/research/hdr-authority-v0.83 -B build/v083 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/v083 --parallel 2
      - name: Test
        run: ctest --test-dir build/v083 --output-on-failure

  sanitizer:
    name: Clang ASan UBSan HDR authority
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: clang
          CXX: clang++
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: cmake -S docs/research/hdr-authority-v0.83 -B build/v083-san -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build/v083-san --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/v083-san --output-on-failure
