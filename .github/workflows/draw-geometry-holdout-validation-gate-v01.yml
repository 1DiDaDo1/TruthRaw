name: D.RAW Geometry HOLDOUT Validation Gate v0.1

on:
  pull_request:
    paths:
      - 'docs/research/draw-geometry-holdout-validation-gate-v0.1/**'
      - 'tools/draw_geometry_holdout_validation_gate_v01.py'
      - 'tools/validate_draw_geometry_holdout_validation_result_v01.py'
      - 'tests/test_draw_geometry_holdout_validation_gate_v01.py'
      - '.github/workflows/draw-geometry-holdout-validation-gate-v01.yml'
  push:
    branches: [main]
    paths:
      - 'docs/research/draw-geometry-holdout-validation-gate-v0.1/**'
      - 'tools/draw_geometry_holdout_validation_gate_v01.py'
      - 'tools/validate_draw_geometry_holdout_validation_result_v01.py'
      - 'tests/test_draw_geometry_holdout_validation_gate_v01.py'
      - '.github/workflows/draw-geometry-holdout-validation-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/draw_geometry_holdout_validation_gate_v01.py \
            tools/validate_draw_geometry_holdout_validation_result_v01.py \
            tests/test_draw_geometry_holdout_validation_gate_v01.py

      - name: Run HOLDOUT validation integration matrix
        run: |
          set -euo pipefail
          python3 tests/test_draw_geometry_holdout_validation_gate_v01.py
