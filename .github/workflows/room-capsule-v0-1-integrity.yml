name: Room Capsule v0.1 Integrity

on:
  push:
    paths:
      - 'docs/research/local-illumination-room-capsule-v0.1/**'
      - 'docs/research/counterfactual-illumination-capture-manifold-v1/**'
      - '.github/workflows/room-capsule-v0-1-integrity.yml'
  pull_request:
    paths:
      - 'docs/research/local-illumination-room-capsule-v0.1/**'
      - 'docs/research/counterfactual-illumination-capture-manifold-v1/**'
      - '.github/workflows/room-capsule-v0-1-integrity.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: CICM dependency integrity
        run: python3 docs/research/counterfactual-illumination-capture-manifold-v1/tools/verify_integrity_v1.py
      - name: GCC Release
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror \
            docs/research/local-illumination-room-capsule-v0.1/native/room_capsule_v0_1.cpp \
            docs/research/local-illumination-room-capsule-v0.1/tests/test_room_capsule_v0_1.cpp \
            -Idocs/research/local-illumination-room-capsule-v0.1/native -o /tmp/room_gcc
          /tmp/room_gcc
      - name: Clang Release
        run: |
          clang++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror \
            docs/research/local-illumination-room-capsule-v0.1/native/room_capsule_v0_1.cpp \
            docs/research/local-illumination-room-capsule-v0.1/tests/test_room_capsule_v0_1.cpp \
            -Idocs/research/local-illumination-room-capsule-v0.1/native -o /tmp/room_clang
          /tmp/room_clang
      - name: ASan UBSan
        run: |
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            docs/research/local-illumination-room-capsule-v0.1/native/room_capsule_v0_1.cpp \
            docs/research/local-illumination-room-capsule-v0.1/tests/test_room_capsule_v0_1.cpp \
            -Idocs/research/local-illumination-room-capsule-v0.1/native -o /tmp/room_san
          /tmp/room_san
      - name: Evidence integrity
        run: python3 docs/research/local-illumination-room-capsule-v0.1/tools/verify_integrity_v0_1.py
