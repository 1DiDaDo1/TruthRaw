name: LibRaw Compatibility Probe v0.1 Integrity

on:
  push:
    paths:
      - 'docs/research/libraw-compat-probe-v0.1/**'
      - 'docs/research/professional-raw-ingress-v0.1/native/**'
      - 'docs/research/professional-raw-decoder-adapter-v0.1/native/**'
      - '.github/workflows/libraw-compat-probe-v0-1-integrity.yml'
  pull_request:
    paths:
      - 'docs/research/libraw-compat-probe-v0.1/**'
      - 'docs/research/professional-raw-ingress-v0.1/native/**'
      - 'docs/research/professional-raw-decoder-adapter-v0.1/native/**'
      - '.github/workflows/libraw-compat-probe-v0-1-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libraw-probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [gcc-release, clang-release, clang-asan-ubsan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LibRaw development package
        run: |
          sudo apt-get update
          sudo apt-get install -y libraw-dev pkg-config
          echo "libraw_pkg_version=$(pkg-config --modversion libraw)"
      - name: Verify metadata-only probe contract
        run: python3 docs/research/libraw-compat-probe-v0.1/tools/verify_probe_contract_v0_1.py
      - name: GCC Release
        if: matrix.mode == 'gcc-release'
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Werror \
            docs/research/libraw-compat-probe-v0.1/native/libraw_compat_probe_v0_1.cpp \
            docs/research/libraw-compat-probe-v0.1/tests/test_libraw_compat_probe_v0_1.cpp \
            -I docs/research/libraw-compat-probe-v0.1/native \
            -I docs/research/professional-raw-ingress-v0.1/native \
            $(pkg-config --cflags --libs libraw) \
            -o /tmp/libraw_probe_gcc
          /tmp/libraw_probe_gcc
      - name: Clang Release
        if: matrix.mode == 'clang-release'
        run: |
          clang++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Werror \
            docs/research/libraw-compat-probe-v0.1/native/libraw_compat_probe_v0_1.cpp \
            docs/research/libraw-compat-probe-v0.1/tests/test_libraw_compat_probe_v0_1.cpp \
            -I docs/research/libraw-compat-probe-v0.1/native \
            -I docs/research/professional-raw-ingress-v0.1/native \
            $(pkg-config --cflags --libs libraw) \
            -o /tmp/libraw_probe_clang
          /tmp/libraw_probe_clang
      - name: Clang ASan UBSan
        if: matrix.mode == 'clang-asan-ubsan'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          clang++ -std=c++20 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            docs/research/libraw-compat-probe-v0.1/native/libraw_compat_probe_v0_1.cpp \
            docs/research/libraw-compat-probe-v0.1/tests/test_libraw_compat_probe_v0_1.cpp \
            -I docs/research/libraw-compat-probe-v0.1/native \
            -I docs/research/professional-raw-ingress-v0.1/native \
            $(pkg-config --cflags --libs libraw) \
            -fsanitize=address,undefined -o /tmp/libraw_probe_san
          /tmp/libraw_probe_san
