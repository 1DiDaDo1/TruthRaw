name: CICM v1 Integrity
on:
  push:
    paths:
      - 'docs/research/counterfactual-illumination-capture-manifold-v1/**'
      - '.github/workflows/cicm-v1-integrity.yml'
  pull_request:
    paths:
      - 'docs/research/counterfactual-illumination-capture-manifold-v1/**'
      - '.github/workflows/cicm-v1-integrity.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GCC Release
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror \
            docs/research/counterfactual-illumination-capture-manifold-v1/native/cicm_v1.cpp \
            docs/research/counterfactual-illumination-capture-manifold-v1/tests/test_cicm_v1.cpp \
            -Idocs/research/counterfactual-illumination-capture-manifold-v1/native -o /tmp/cicm_gcc
          /tmp/cicm_gcc
      - name: Clang Release
        run: |
          clang++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror \
            docs/research/counterfactual-illumination-capture-manifold-v1/native/cicm_v1.cpp \
            docs/research/counterfactual-illumination-capture-manifold-v1/tests/test_cicm_v1.cpp \
            -Idocs/research/counterfactual-illumination-capture-manifold-v1/native -o /tmp/cicm_clang
          /tmp/cicm_clang
      - name: ASan UBSan
        run: |
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            docs/research/counterfactual-illumination-capture-manifold-v1/native/cicm_v1.cpp \
            docs/research/counterfactual-illumination-capture-manifold-v1/tests/test_cicm_v1.cpp \
            -Idocs/research/counterfactual-illumination-capture-manifold-v1/native -o /tmp/cicm_san
          /tmp/cicm_san
      - name: Evidence integrity
        run: python3 docs/research/counterfactual-illumination-capture-manifold-v1/tools/verify_integrity_v1.py
