name: Reconstructed Color Preview v0.1

on:
  push:
    branches:
      - research/reconstructed-color-preview-v0.1-2026-09-11
    paths:
      - 'docs/research/reconstructed-color-preview-v0.1/**'
      - 'docs/research/full-frame-streaming-v0.1/native/**'
      - 'docs/research/full-frame-streaming-v0.1/tests/streaming_test_support_v0_1.h'
      - 'canonical/reconstruction/v4.7i/native/**'
      - 'app/android/truthraw-adaptive-ui-v01/**'
      - '.github/workflows/reconstructed-color-preview-v0-1.yml'
  pull_request:
    paths:
      - 'docs/research/reconstructed-color-preview-v0.1/**'
      - 'docs/research/full-frame-streaming-v0.1/native/**'
      - 'docs/research/full-frame-streaming-v0.1/tests/streaming_test_support_v0_1.h'
      - 'canonical/reconstruction/v4.7i/native/**'
      - 'app/android/truthraw-adaptive-ui-v01/**'
      - '.github/workflows/reconstructed-color-preview-v0-1.yml'

permissions:
  contents: read

jobs:
  gcc-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure GCC Release
        run: cmake -S docs/research/reconstructed-color-preview-v0.1 -B build/preview-gcc -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build GCC Release
        run: cmake --build build/preview-gcc --parallel 2
      - name: Run GCC Release
        run: ./build/preview-gcc/test_reconstructed_color_preview_v0_1

  clang-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure Clang Release
        run: cmake -S docs/research/reconstructed-color-preview-v0.1 -B build/preview-clang -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build Clang Release
        run: cmake --build build/preview-clang --parallel 2
      - name: Run Clang Release
        run: ./build/preview-clang/test_reconstructed_color_preview_v0_1

  clang-asan-ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure Clang ASan+UBSan
        run: >-
          cmake -S docs/research/reconstructed-color-preview-v0.1 -B build/preview-san
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build Clang ASan+UBSan
        run: cmake --build build/preview-san --parallel 2
      - name: Run Clang ASan+UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build/preview-san/test_reconstructed_color_preview_v0_1

  android-jpeg-encoder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded JPEG encoder contract
        run: |
          FILE='app/android/truthraw-adaptive-ui-v01/app/src/main/java/com/truthraw/adaptiveui/PortablePreviewEncoder.kt'
          grep -F 'Bitmap.CompressFormat.JPEG' "$FILE"
          grep -F 'ColorSpace.Named.SRGB' "$FILE"
          grep -F 'OutputStream' "$FILE"
          if grep -F 'ByteArrayOutputStream' "$FILE"; then
            echo 'Portable preview must stream to a caller-owned OutputStream instead of creating a second encoded byte-array buffer.' >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK and NDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'cmake;3.22.1' \
            'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble Android preview APK
        working-directory: app/android/truthraw-adaptive-ui-v01
        run: gradle --no-daemon :app:assembleDebug
