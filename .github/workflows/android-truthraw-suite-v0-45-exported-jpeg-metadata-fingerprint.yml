name: TruthRaw v0.45 Exported JPEG Metadata Fingerprint

on:
  push:
    branches:
      - integration/truthraw-suite-v0-45-exported-jpeg-metadata-fingerprint
    paths:
      - 'suite_android/app/src/main/AndroidManifest.xml'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/PassiveExportedJpegMetadataFingerprintService.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/PassiveExportedJpegMetadataFingerprintActivity.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/TruthRawSuiteLauncherActivity.kt'
      - 'docs/HONOR_V044_HIRES_MAIN_TELE_DEVICE_RESULT_2026-09-18.md'
      - 'state/HONOR_V044_HIRES_MAIN_TELE_DEVICE_RESULT_2026-09-18.json'
      - 'docs/HONOR_V045_EXPORTED_JPEG_METADATA_FINGERPRINT_PLAN_2026-09-18.md'
      - 'state/HONOR_V045_EXPORTED_JPEG_METADATA_FINGERPRINT_PLAN_2026-09-18.json'
      - '.github/workflows/android-truthraw-suite-v0-45-exported-jpeg-metadata-fingerprint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v045:
    name: Build v0.45 exported JPEG metadata fingerprint arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify v0.45 authority and invariants
        run: |
          SERVICE='suite_android/app/src/main/java/com/truthraw/adaptiveui/PassiveExportedJpegMetadataFingerprintService.kt'
          ACT='suite_android/app/src/main/java/com/truthraw/adaptiveui/PassiveExportedJpegMetadataFingerprintActivity.kt'
          MANIFEST='suite_android/app/src/main/AndroidManifest.xml'
          PLAN='state/HONOR_V045_EXPORTED_JPEG_METADATA_FINGERPRINT_PLAN_2026-09-18.json'

          grep -F 'truthraw.passive-exported-jpeg-metadata-fingerprint.v0.45' "$SERVICE"
          grep -F 'EXPORTED_OUTPUT_METADATA_ONLY' "$SERVICE"
          grep -F 'EXPORTED_JPEG_METADATA_FINGERPRINT' "$SERVICE"
          grep -F 'openFileDescriptor(uri, "r")' "$SERVICE"
          grep -F 'ExifInterface(pfd.fileDescriptor)' "$SERVICE"
          grep -F 'gpsTagsRequested", false' "$SERVICE"
          grep -F 'imagePixelArrayDecoded", false' "$SERVICE"
          grep -F 'captureEvidenceGranted", false' "$SERVICE"
          grep -F 'HIRES_MAIN_CONFIRMED' "$SERVICE"
          grep -F 'TELE_200MP_UI_SELECTED' "$SERVICE"
          grep -F 'metadataStateTransition' "$SERVICE"
          grep -F 'currentUserStateLabel' "$SERVICE"

          grep -F 'v0.45 · Exported JPEG metadata fingerprint' "$ACT"
          grep -F 'PassiveExportedJpegMetadataFingerprintService' "$MANIFEST"
          grep -F '"exportedMetadataAuthority": "EXPORTED_OUTPUT_METADATA_ONLY"' "$PLAN"
          grep -F '"gpsTagsRequested": false' "$PLAN"

          python3 - <<'PY'
          from pathlib import Path

          service = Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/PassiveExportedJpegMetadataFingerprintService.kt').read_text()

          required = [
              'EXPORTED_JPEG_METADATA_FINGERPRINT',
              'EXPORTED_OUTPUT_METADATA_ONLY',
              'openFileDescriptor(uri, "r")',
              'ExifInterface(pfd.fileDescriptor)',
              'FocalLength',
              'FocalLengthIn35mmFilm',
              'LensModel',
              'LensSpecification',
              'gpsTagsRequested',
              'imagePixelArrayDecoded',
              'captureEvidenceGranted',
              'registerAvailabilityCallback',
              'registerContentObserver',
          ]
          for token in required:
              assert token in service, token

          forbidden = [
              'openCamera(',
              'createCaptureRequest',
              'ImageReader',
              'BitmapFactory',
              'ImageDecoder',
              'bindService(',
              'setPhysicalCameraKey',
              '"GPSLatitude"',
              '"GPSLongitude"',
              '"GPSAltitude"',
          ]
          for token in forbidden:
              assert token not in service, token

          print('v0.45 exported-output metadata invariants PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          test -s /tmp/libtruthraw_ui_preview_bridge.so
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-v0-45-exported-jpeg-metadata-fingerprint-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
