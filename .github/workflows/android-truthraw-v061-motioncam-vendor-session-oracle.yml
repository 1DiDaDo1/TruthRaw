name: TruthRaw v0.61 MotionCam vendor/session oracle

on:
  workflow_dispatch:
  push:
    branches:
      - test/honor-session-vendor-route-oracle-v061
    paths:
      - 'suite_android/app/src/main/AndroidManifest.xml'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/MotionCamVendorSessionOracleActivity.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/TruthRawSettingsActivity.kt'
      - 'docs/research/honor-session-vendor-route-v061/**'
      - '.github/workflows/android-truthraw-v061-motioncam-vendor-session-oracle.yml'

permissions:
  contents: read

jobs:
  build-v061:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify read-only v0.61 invariants
        run: |
          set -euo pipefail
          SRC='suite_android/app/src/main/java/com/truthraw/adaptiveui/MotionCamVendorSessionOracleActivity.kt'
          grep -F 'RUNTIME_CAMERA2_SESSION_KEY_DISCOVERY_VIA_MOTIONCAM_UI' "$SRC"
          grep -F 'availableSessionKeys' "$SRC"
          grep -F 'availableCaptureRequestKeys' "$SRC"
          grep -F 'getPhysicalCameraKey' "$SRC"
          grep -F 'vendorRequestWrittenByTruthRaw", false' "$SRC"
          grep -F 'sessionCreatedByTruthRaw", false' "$SRC"
          grep -F 'captureSubmittedByTruthRaw", false' "$SRC"
          grep -F 'EnableHDRDCGMode' "$SRC"
          grep -F 'MasterFilmSensorType' "$SRC"
          grep -F 'cameraSceneMode' "$SRC"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/MotionCamVendorSessionOracleActivity.kt').read_text()
          forbidden=[
              'builder.set(',
              'setPhysicalCameraKey(',
              'createCaptureSession',
              'SessionConfiguration(',
              'import android.media.ImageReader',
              'ImageReader.newInstance',
              '.capture(',
              'setRepeatingRequest',
              'bindService(',
          ]
          for token in forbidden:
              assert token not in s, token
          print('v0.61 read-only invariants PASS')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-v061-motioncam-vendor-session-oracle-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
