name: TruthRaw v0.51 CameraDeviceSetup RAW14 Session Oracle

on:
  push:
    branches:
      - integration/truthraw-suite-v0-51-camera-device-setup-raw14-session-oracle
    paths:
      - 'suite_android/app/src/main/AndroidManifest.xml'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/CameraDeviceSetupRaw14SessionOracleActivity.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/TruthRawSuiteLauncherActivity.kt'
      - 'docs/HONOR_V051_CAMERA_DEVICE_SETUP_RAW14_SESSION_ORACLE_PLAN_2026-09-19.md'
      - 'state/HONOR_V051_CAMERA_DEVICE_SETUP_RAW14_SESSION_ORACLE_PLAN_2026-09-19.json'
      - '.github/workflows/android-truthraw-suite-v0-51-camera-device-setup-raw14-session-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v051:
    name: Build v0.51 CameraDeviceSetup RAW14 session oracle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify v0.51 query-only authority
        run: |
          ACT='suite_android/app/src/main/java/com/truthraw/adaptiveui/CameraDeviceSetupRaw14SessionOracleActivity.kt'
          grep -F 'truthraw.camera-device-setup-raw14-session-oracle.v0.51' "$ACT"
          grep -F 'CAMERA2_CAMERA_DEVICE_SETUP_SESSION_QUERY_ONLY' "$ACT"
          grep -F 'getCameraDeviceSetup("0")' "$ACT"
          grep -F 'isSessionConfigurationSupported(config)' "$ACT"
          grep -F 'OutputConfiguration(c.formatValue, Size(c.width, c.height))' "$ACT"
          grep -F 'setPhysicalCameraId(c.physicalId)' "$ACT"
          grep -F 'setPhysicalCameraKey(' "$ACT"
          grep -F 'SENSOR_PIXEL_MODE_MAXIMUM_RESOLUTION' "$ACT"

          python3 - <<'PY'
          from pathlib import Path
          s=Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/CameraDeviceSetupRaw14SessionOracleActivity.kt').read_text()
          required=[
              'cameraOpenedByTruthRaw", false',
              'captureSessionCreatedByTruthRaw", false',
              'captureSubmittedByTruthRaw", false',
              'imageReaderCreatedByTruthRaw", false',
              'unknownSizeEnumerationAttempted", false',
              'unknownFormatEnumerationAttempted", false',
          ]
          for token in required:
              assert token in s, token

          forbidden=[
              'openCamera(',
              'createCaptureSession(',
              'import android.media.ImageReader',
              '.capture(',
              'bindService(',
          ]
          for token in forbidden:
              assert token not in s, token
          print('v0.51 CameraDeviceSetup query-only invariants PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-v0-51-camera-device-setup-raw14-session-oracle-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
