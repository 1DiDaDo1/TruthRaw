name: Illumination State v0.82

on:
  push:
    branches:
      - integration/truthraw-suite-v0-82-illumination-state
    paths:
      - 'suite_android/app/src/main/cpp/illumination_state_v0_82.*'
      - 'docs/research/illumination-state-v0.82/**'
      - '.github/workflows/illumination-state-v0-82.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state:
    name: ${{ matrix.compiler }} illumination state
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S docs/research/illumination-state-v0.82 -B build/v082 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/v082 --parallel 2
      - name: Test
        run: ctest --test-dir build/v082 --output-on-failure

  sanitizer:
    name: Clang ASan UBSan illumination state
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: clang
          CXX: clang++
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: cmake -S docs/research/illumination-state-v0.82 -B build/v082-san -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build/v082-san --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/v082-san --output-on-failure
