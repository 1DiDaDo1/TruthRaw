name: TruthNegative foundation v0.1

on:
  push:
    branches:
      - research/truthnegative-v0-1-scientific-negative-foundation
    paths:
      - 'tools/truthnegative_foundation_v01.py'
      - 'tests/test_truthnegative_foundation_v01.py'
      - 'docs/CORE_VISION_TRUTHNEGATIVE_SCIENTIFIC_NEGATIVE.md'
      - 'docs/CURRENT_TRUTHNEGATIVE_ARCHITECTURE_2026-09-19.md'
      - 'docs/research/truthnegative-v0.1/**'
      - 'state/TRUTHNEGATIVE_V0_1_STATE_2026-09-19.json'
      - '.github/workflows/truthnegative-foundation-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truthnegative-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-test
        run: python tools/truthnegative_foundation_v01.py --self-test

      - name: Unit tests
        run: python -m unittest -v tests/test_truthnegative_foundation_v01.py

      - name: Verify branch authority language
        run: |
          grep -F 'TruthNegative is an authority-aware reconstructed scientific negative' docs/CORE_VISION_TRUTHNEGATIVE_SCIENTIFIC_NEGATIVE.md
          grep -F 'projection grid does not imply native sensor geometry' docs/CURRENT_TRUTHNEGATIVE_ARCHITECTURE_2026-09-19.md || true
          grep -F '"measuredTargetClaimCount": 0' state/TRUTHNEGATIVE_V0_1_STATE_2026-09-19.json
          grep -F '"canonicalPromotion": false' state/TRUTHNEGATIVE_V0_1_STATE_2026-09-19.json
