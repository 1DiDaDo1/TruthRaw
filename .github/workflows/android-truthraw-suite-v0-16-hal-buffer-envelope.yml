name: TruthRaw FotoGraaf v0.16 HAL Buffer Envelope

on:
  push:
    branches:
      - integration/truthraw-suite-v0-16-hal-buffer-envelope
    paths:
      - 'suite_android/**'
      - 'tools/patch_fotograaf_v012_forced_physical_max.py'
      - 'tools/patch_fotograaf_v013_physical_only_max_submit.py'
      - 'tools/patch_fotograaf_v014_seal_raw_before_result_mode_gate.py'
      - 'tools/patch_fotograaf_v016_hal_buffer_envelope.py'
      - '.github/workflows/android-truthraw-suite-v0-16-hal-buffer-envelope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v016:
    name: Build FotoGraaf v0.16 HAL envelope arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply proven v0.14 route plus read-only Stage 3.5 envelope probe
        run: |
          python3 tools/patch_fotograaf_v016_hal_buffer_envelope.py
          APP='suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt'
          PROBE='suite_android/app/src/main/java/com/truthraw/adaptiveui/Camera2EnvelopeProbe.kt'
          NATIVE='suite_android/app/src/main/cpp/hardware_buffer_envelope_probe.cpp'
          grep -F 'TruthRaw · 200MP Tele Test v0.16 · HAL envelope' "$APP"
          grep -F 'persistOriginalRawBuffer(image, stamp)' "$APP"
          grep -F 'Camera2EnvelopeProbe.observe(image, physical, physicalResult)' "$APP"
          grep -F 'halBufferEnvelopeCollectedAfterRawSealBeforeDng' "$APP"
          grep -F 'halBufferProbeLockedOrMappedBuffer' "$APP"
          grep -F 'hardwareBufferLocked' "$PROBE"
          grep -F 'nativeDescribeHardwareBuffer' "$PROBE"
          grep -F 'AHardwareBuffer_describe' "$NATIVE"
          grep -F 'AHardwareBuffer_getId' "$NATIVE"
          grep -F 'lockedByProbe' "$NATIVE"
          ! grep -F 'AHardwareBuffer_lock(' "$NATIVE"
          ! grep -F 'AHardwareBuffer_lockAndGetInfo(' "$NATIVE"
          ! grep -F 'MAXIMUM_RESOLUTION vereist' "$APP"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package and native bridge
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          test -s /tmp/libtruthraw_ui_preview_bridge.so
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/libtruthraw_ui_preview_bridge.so'; then
            echo 'Unexpected non-arm64 TruthRaw native ABI' >&2
            exit 1
          fi
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-main-plus-fotograaf-v0-16-hal-buffer-envelope-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
