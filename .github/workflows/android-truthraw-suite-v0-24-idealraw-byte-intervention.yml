name: TruthRaw FotoGraaf v0.24 IdealRAW BYTE Intervention

# First real single-variable upstream route intervention after v0.23 resolved the native
# camera_metadata type of EnableIdealRAW as BYTE. v0.20 remains the unchanged control.
on:
  push:
    branches:
      - integration/truthraw-suite-v0-24-idealraw-byte-intervention
    paths:
      - 'suite_android/**'
      - 'tools/patch_fotograaf_v012_forced_physical_max.py'
      - 'tools/patch_fotograaf_v013_physical_only_max_submit.py'
      - 'tools/patch_fotograaf_v014_seal_raw_before_result_mode_gate.py'
      - 'tools/patch_fotograaf_v016_hal_buffer_envelope.py'
      - 'tools/patch_fotograaf_v017_pre_hal_airlock.py'
      - 'tools/patch_fotograaf_v019_full_raster_write_audit.py'
      - 'tools/patch_fotograaf_v020_payload_geometry_decoder.py'
      - 'tools/patch_fotograaf_v024_idealraw_byte_intervention.py'
      - '.github/workflows/android-truthraw-suite-v0-24-idealraw-byte-intervention.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v024:
    name: Build FotoGraaf v0.24 IdealRAW BYTE intervention arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v0.20 and attach exactly one BYTE session intervention
        run: |
          python3 tools/patch_fotograaf_v024_idealraw_byte_intervention.py
          APP='suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt'
          IDEAL='suite_android/app/src/main/java/com/truthraw/adaptiveui/Camera2IdealRawByteSessionProbe.kt'
          PRE='suite_android/app/src/main/java/com/truthraw/adaptiveui/Camera2PreHalGate.kt'
          POST='suite_android/app/src/main/java/com/truthraw/adaptiveui/Camera2EnvelopeProbe.kt'
          AUDIT='suite_android/app/src/main/java/com/truthraw/adaptiveui/RawSensorRasterAudit.kt'
          GEOM='suite_android/app/src/main/java/com/truthraw/adaptiveui/RawPayloadGeometryDecoder.kt'
          NATIVE='suite_android/app/src/main/cpp/hardware_buffer_envelope_probe.cpp'

          grep -F 'TruthRaw · 200MP Tele Test v0.24 · Camera-5 IdealRAW BYTE intervention' "$APP"
          grep -F 'Camera2PreHalGate.observeSession(' "$APP"
          grep -F 'Camera2IdealRawByteSessionProbe.applyExperiment(' "$APP"
          grep -F 'idealRawNativeTypeOracleTagHex' "$APP"
          grep -F 'idealRawNativeTypeOracleResolvedType' "$APP"
          grep -F 'controlledVendorInterventionKeyCount' "$APP"
          grep -F 'persistOriginalRawBuffer(image, stamp)' "$APP"
          grep -F 'Camera2EnvelopeProbe.observe(image, physical, physicalResult)' "$APP"
          grep -F 'RawSensorRasterAudit.audit(' "$APP"
          grep -F 'RawPayloadGeometryDecoder.decode(' "$APP"

          grep -F 'org.codeaurora.qcamera3.sessionParameters.EnableIdealRAW' "$IDEAL"
          grep -F '0x801F0027' "$IDEAL"
          grep -F 'RESOLVED_NATIVE_TYPE = "BYTE"' "$IDEAL"
          grep -F 'CaptureRequest.Key(KEY_NAME, java.lang.Byte::class.java)' "$IDEAL"
          grep -F 'builder.set(key, 1.toByte())' "$IDEAL"
          grep -F 'config.setSessionParameters(request)' "$IDEAL"
          grep -F 'singleUnknownVendorVariable' "$IDEAL"
          grep -F 'semanticMeaningAssumed' "$IDEAL"
          ! grep -F 'RawCbSourceType' "$IDEAL"
          ! grep -F 'EnableXCFAOptimization' "$IDEAL"
          ! grep -F 'HALOutputBufferCombined' "$IDEAL"
          ! grep -F 'EnableInsensorZoom' "$IDEAL"
          ! grep -F 'EnableSnapshotOnlyInsensorZoom' "$IDEAL"

          grep -F 'vendorKeysWritten", false' "$PRE"
          grep -F 'hardwareBufferLocked' "$POST"
          grep -F 'ONLY_FIRST_768_ROWS_NONZERO__EXACT_12P5MP_BYTE_PAYLOAD_SIGNATURE' "$AUDIT"
          grep -F 'EXACT_PAYLOAD_BYTE_COUNT_MATCH_TO_SINGLE_ADVERTISED_STANDARD_RAW_SENSOR_SIZE' "$GEOM"
          grep -F 'AHardwareBuffer_describe' "$NATIVE"
          ! grep -F 'AHardwareBuffer_lock(' "$NATIVE"
          ! grep -F 'AHardwareBuffer_lockAndGetInfo(' "$NATIVE"
          ! grep -F 'MAXIMUM_RESOLUTION vereist' "$APP"

          python3 - <<'PY'
          from pathlib import Path
          s = Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/FotoGraaf200MpStagedActivity.kt').read_text()
          assert s.index('Camera2PreHalGate.observeSession(') < s.index('Camera2IdealRawByteSessionProbe.applyExperiment(')
          assert s.index('Camera2IdealRawByteSessionProbe.applyExperiment(') < s.index('device.isSessionConfigurationSupported(config)')
          assert s.index('persistOriginalRawBuffer(image, stamp)') < s.index('Camera2EnvelopeProbe.observe(image, physical, physicalResult)')
          assert s.index('RawSensorRasterAudit.audit(') < s.index('RawPayloadGeometryDecoder.decode(')
          assert s.count('Camera2IdealRawByteSessionProbe.applyExperiment(') == 1
          print('v0.24 ordering and single-variable assertions PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package and native bridge
        run: |
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          unzip -p "$APK" lib/arm64-v8a/libtruthraw_ui_preview_bridge.so > /tmp/libtruthraw_ui_preview_bridge.so
          test -s /tmp/libtruthraw_ui_preview_bridge.so
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/libtruthraw_ui_preview_bridge.so'; then
            echo 'Unexpected non-arm64 TruthRaw native ABI' >&2
            exit 1
          fi
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-suite-main-plus-fotograaf-v0-24-idealraw-byte-intervention-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
