name: Documentation Governance Current

on:
  push:
    paths:
      - 'README.md'
      - 'START_HERE_NEW_CHAT.md'
      - 'docs/**'
      - 'state/**'
      - 'tools/verify_documentation_governance.py'
      - '.github/workflows/documentation-governance-2026-09-10.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'START_HERE_NEW_CHAT.md'
      - 'docs/**'
      - 'state/**'
      - 'tools/verify_documentation_governance.py'
      - '.github/workflows/documentation-governance-2026-09-10.yml'
  workflow_dispatch:

jobs:
  governance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile governance checker
        run: python3 -m py_compile tools/verify_documentation_governance.py
      - name: Verify document authority and scientific governance invariants
        run: python3 tools/verify_documentation_governance.py
      - name: Validate all dated current-state JSON snapshots
        shell: bash
        run: |
          set -euo pipefail
          for f in state/CURRENT_CANONICAL_STATE_*.json; do
            python3 -m json.tool "$f" >/dev/null
          done
