name: Documentation Governance current (2026-09-11 snapshot)

on:
  push:
    paths:
      - 'README.md'
      - 'START_HERE_NEW_CHAT.md'
      - 'docs/**'
      - 'state/**'
      - 'tools/verify_documentation_governance.py'
      - '.github/workflows/documentation-governance-2026-09-10.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'START_HERE_NEW_CHAT.md'
      - 'docs/**'
      - 'state/**'
      - 'tools/verify_documentation_governance.py'
      - '.github/workflows/documentation-governance-2026-09-10.yml'
  workflow_dispatch:

jobs:
  governance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify current document authority and historical classification
        run: python3 tools/verify_documentation_governance.py
      - name: Validate current 2026-09-11 state JSON
        run: python3 -m json.tool state/CURRENT_CANONICAL_STATE_2026-09-11.json >/dev/null
      - name: Preserve/validate prior 2026-09-10 snapshot JSON
        run: python3 -m json.tool state/CURRENT_CANONICAL_STATE_2026-09-10.json >/dev/null
