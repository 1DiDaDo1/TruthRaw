name: Apply Effective Black Runtime Diagnostic v0.1

on:
  push:
    branches:
      - feat/source-capability-effective-black-runtime-diagnostic-v01
    paths:
      - '.github/workflows/apply-effective-black-runtime-diagnostic-v01.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-capability-effective-black-runtime-diagnostic-v01
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply deterministic runtime diagnostic patch
        run: python3 tools/apply_effective_black_runtime_diagnostic_v01.py

      - name: Verify patch scope and focused regressions
        run: |
          set -euo pipefail
          git diff --check
          SRC='suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02.kt'
          TEST='suite_android/app/src/test/java/com/truthraw/adaptiveui/SourceCapabilityEffectiveBlackRuntimeDiagnosticV01Test.kt'
          grep -F '"effective_black_normalization_v0_1"' "$SRC"
          grep -F 'SourceCapabilityRadiometricEffectiveBlackNormalizationValidatorV01.describe' "$SRC"
          grep -F 'parsedBefore, parsedForEnvelope.toString()' "$TEST"
          grep -F 'full_raw_to_linear_mapping_validated' "$TEST"
          cd suite_android
          gradle --no-daemon :app:testDebugUnitTest \
            --tests com.truthraw.adaptiveui.SourceCapabilityRuntimeEvidenceEnvelopeV01Test \
            --tests com.truthraw.adaptiveui.SourceCapabilityEffectiveBlackRuntimeDiagnosticV01Test \
            --tests com.truthraw.adaptiveui.SourceCapabilityRadiometricEffectiveBlackNormalizationValidatorV01Test

      - name: Commit only code test and live handoff
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            suite_android/app/src/main/java/com/truthraw/adaptiveui/SourceCapabilityEnvelopeV02.kt \
            suite_android/app/src/test/java/com/truthraw/adaptiveui/SourceCapabilityEffectiveBlackRuntimeDiagnosticV01Test.kt \
            docs/handoff/DRAW_44489_EFFECTIVE_BLACK_RUNTIME_DIAGNOSTIC_V0_1.md
          git diff --cached --check
          git commit -m 'Expose Effective Black read-only runtime diagnostic v0.1'
          git push origin HEAD:feat/source-capability-effective-black-runtime-diagnostic-v01
