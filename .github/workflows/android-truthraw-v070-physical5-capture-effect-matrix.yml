name: TruthRaw v0.70 Physical-5 capture-effect matrix

on:
  workflow_dispatch:
  push:
    branches:
      - test/physical5-capture-effect-matrix-v070
    paths:
      - 'suite_android/app/src/main/AndroidManifest.xml'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/Physical5CaptureEffectMatrixActivity.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/TruthRawSettingsActivity.kt'
      - 'docs/research/physical5-capture-effect-v070/**'
      - '.github/workflows/android-truthraw-v070-physical5-capture-effect-matrix.yml'

permissions:
  contents: read

jobs:
  build-v070:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify v0.70 single-frame/provenance invariants
        run: |
          set -euo pipefail
          SRC='suite_android/app/src/main/java/com/truthraw/adaptiveui/Physical5CaptureEffectMatrixActivity.kt'
          grep -F 'truthraw.physical5-capture-effect-matrix.v0.70' "$SRC"
          grep -F 'CAMERA2_SINGLE_FRAME_CONTROL_CANDIDATE_CAPTURE_EFFECT' "$SRC"
          grep -F 'captureSingleRequest(' "$SRC"
          grep -F 'SENSOR_PIXEL_MODE_MAXIMUM_RESOLUTION' "$SRC"
          grep -F 'ImageFormat.RAW10' "$SRC"
          grep -F 'fullPlaneSha256ComputedInMemory", true' "$SRC"
          grep -F 'rawSourceFilesPersisted", false' "$SRC"
          grep -F 'MasterFilmSensorType' "$SRC"
          grep -F 'aoRunningMode' "$SRC"
          grep -F 'EnableVSR' "$SRC"
          grep -F 'ExtendedMaxZoom' "$SRC"
          grep -F 'inSensorZoomEnable' "$SRC"
          grep -F 'cameraSceneMode' "$SRC"
          grep -F 'extStreamSize' "$SRC"
          grep -F 'teleconverterEnable' "$SRC"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/Physical5CaptureEffectMatrixActivity.kt').read_text()
          forbidden=[
              'setRepeatingRequest',
              'captureBurst',
              'setRepeatingBurst',
              'DngCreator(',
              'bindService(',
          ]
          for token in forbidden:
              assert token not in s, token
          assert 'multiFrameFusionUsed", false' in s
          assert 'scientificMasterModified", false' in s
          print('v0.70 single-frame/provenance invariants PASS')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-v070-physical5-capture-effect-matrix-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
