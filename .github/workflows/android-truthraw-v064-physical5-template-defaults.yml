name: TruthRaw v0.64 Physical-5 template defaults oracle

on:
  workflow_dispatch:
  push:
    branches:
      - test/physical5-template-default-oracle-v064
    paths:
      - 'suite_android/app/src/main/AndroidManifest.xml'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/Physical5TemplateDefaultsOracleActivity.kt'
      - 'suite_android/app/src/main/java/com/truthraw/adaptiveui/TruthRawSettingsActivity.kt'
      - 'docs/research/physical5-template-defaults-v064/**'
      - '.github/workflows/android-truthraw-v064-physical5-template-defaults.yml'

permissions:
  contents: read

jobs:
  build-v064:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify read-only v0.64 invariants
        run: |
          set -euo pipefail
          SRC='suite_android/app/src/main/java/com/truthraw/adaptiveui/Physical5TemplateDefaultsOracleActivity.kt'
          grep -F 'truthraw.physical5-template-defaults-oracle.v0.64' "$SRC"
          grep -F 'requestPermissions(arrayOf(Manifest.permission.CAMERA)' "$SRC"
          grep -F 'createCaptureRequest(' "$SRC"
          grep -F 'setOf(PHYSICAL_ID)' "$SRC"
          grep -F 'getPhysicalCameraKey' "$SRC"
          grep -F 'vendorRequestWrittenByTruthRaw", false' "$SRC"
          grep -F 'sessionCreatedByTruthRaw", false' "$SRC"
          grep -F 'captureSubmittedByTruthRaw", false' "$SRC"

          python3 - <<'PY'
          from pathlib import Path
          s=Path('suite_android/app/src/main/java/com/truthraw/adaptiveui/Physical5TemplateDefaultsOracleActivity.kt').read_text()
          forbidden=[
              'builder.set(',
              'setPhysicalCameraKey(',
              'createCaptureSession',
              'SessionConfiguration(',
              'ImageReader.newInstance',
              '.capture(',
              'setRepeatingRequest',
              'bindService(',
          ]
          for token in forbidden:
              assert token not in s, token
          print('v0.64 read-only invariants PASS')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble arm64 debug APK
        working-directory: suite_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK='suite_android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo "apk_bytes=$(stat -c%s "$APK")"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: truthraw-v064-physical5-template-defaults-debug-arm64
          path: suite_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
