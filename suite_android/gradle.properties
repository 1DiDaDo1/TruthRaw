# D.RAW Android build memory policy.
#
# The suite now contains a large number of deterministic research modules.
# Keep Kotlin compilation in the Gradle process so one bounded heap is used
# instead of competing Gradle/Kotlin daemons on CI.
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon=false
org.gradle.parallel=false
